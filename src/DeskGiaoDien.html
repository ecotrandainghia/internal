<style>
/* app CLB ECO: máy tính có menu dọc bên trái (thu gọn được); điện thoại có thanh trên, thanh tab dưới và bảng "Thêm". */
:root{
  --brand:#274e13; --brand-2:#2f5d18; --brand-3:#1d3a0e; --brand-ink:#ffffff;
  --side-bg:linear-gradient(170deg,#2f5d18 0%,#274e13 55%,#1d3a0e 100%);
  --soft:#eaf1e4; --soft-2:#dfe9d6; --accent:#274e13; --on-accent:#ffffff; --ring:rgb(39 78 19 / .16);
  --bg:#f2f5ef; --surface:#ffffff; --surface-2:#f7f9f5; --fg:#18210f; --muted:#5f6b58; --line:#dfe5d8; --line-2:#cdd8c6;
  --ok:#2f7a28; --ok-bg:#e3f2de; --warn:#8a5a00; --warn-bg:#fff1cc; --bad:#b3261e; --bad-bg:#fde4e1; --info:#1f5c99; --info-bg:#e1ecf8;
  --shadow:0 1px 2px rgb(20 40 10 / .05),0 6px 20px rgb(20 40 10 / .06);
  --shadow-pop:0 18px 50px rgb(10 25 5 / .28);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#1b3410; --brand-2:#22401a; --brand-3:#142a0b; --brand-ink:#eef5e8;
  --side-bg:linear-gradient(170deg,#1f3a12 0%,#18300d 55%,#112308 100%);
  --soft:#22321a; --soft-2:#2a3d20; --accent:#9ccc74; --on-accent:#10160b; --ring:rgb(156 204 116 / .22);
  --bg:#0f150c; --surface:#172012; --surface-2:#1b2616; --fg:#e7eee1; --muted:#9aa892; --line:#2a3822; --line-2:#36472d;
  --ok:#8fd07f; --ok-bg:#1f3419; --warn:#f0c860; --warn-bg:#3a3010; --bad:#f2968d; --bad-bg:#3d1c19; --info:#8cbcf0; --info-bg:#172b40;
  --shadow:0 1px 2px rgb(0 0 0 / .3); --shadow-pop:0 18px 50px rgb(0 0 0 / .55); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#1b3410; --brand-2:#22401a; --brand-3:#142a0b; --brand-ink:#eef5e8;
  --side-bg:linear-gradient(170deg,#1f3a12 0%,#18300d 55%,#112308 100%);
  --soft:#22321a; --soft-2:#2a3d20; --accent:#9ccc74; --on-accent:#10160b; --ring:rgb(156 204 116 / .22);
  --bg:#0f150c; --surface:#172012; --surface-2:#1b2616; --fg:#e7eee1; --muted:#9aa892; --line:#2a3822; --line-2:#36472d;
  --ok:#8fd07f; --ok-bg:#1f3419; --warn:#f0c860; --warn-bg:#3a3010; --bad:#f2968d; --bad-bg:#3d1c19; --info:#8cbcf0; --info-bg:#172b40;
  --shadow:0 1px 2px rgb(0 0 0 / .3); --shadow-pop:0 18px 50px rgb(0 0 0 / .55); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 12px;font-weight:600;display:inline-block}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- Khung ứng dụng ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.app.gon{grid-template-columns:72px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side-bg);color:#fff;display:flex;flex-direction:column;padding:16px 12px 14px;gap:14px;min-width:0;z-index:5}
.sb-top{display:flex;align-items:center;gap:10px;padding:0 4px;min-height:40px}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--brand);flex:none;overflow:hidden;padding:3px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.sb-name{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;flex:1}
.sb-thu{background:none;border:0;color:rgb(255 255 255 / .7);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.sb-thu:hover{background:rgb(255 255 255 / .1);color:#fff}
.sb-nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:thin;scrollbar-color:rgb(255 255 255 / .25) transparent}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgb(255 255 255 / .55);font-weight:700;padding:12px 10px 4px;white-space:nowrap}
.grp:first-child{padding-top:2px}
.nav{display:flex;align-items:center;gap:11px;background:none;border:0;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;width:100%;color:rgb(255 255 255 / .82);position:relative}
.nav span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.nav:hover{background:rgb(255 255 255 / .09);color:#fff}
.nav[aria-current="page"]{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgb(0 0 0 / .14)}
:root[data-theme="dark"] .nav[aria-current="page"]{background:#d7ecc4;color:#132a08}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav[aria-current="page"]{background:#d7ecc4;color:#132a08}}
.badge{margin-left:auto;background:#e5484d;color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700;line-height:18px;min-width:18px;text-align:center}
.sb-user{border-top:1px solid rgb(255 255 255 / .16);padding-top:12px}
.sb-me{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#fff;cursor:pointer;padding:6px;border-radius:10px;text-align:left}
.sb-me:hover{background:rgb(255 255 255 / .09)}
.sb-me .who{min-width:0;flex:1}
.sb-me b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-me span{display:block;font-size:12px;opacity:.7;white-space:nowrap}
.av{width:34px;height:34px;border-radius:50%;background:#d7ecc4;color:#1d3a0e;display:grid;place-items:center;font-weight:800;flex:none}
.sb-me span.av{display:grid;font-size:14px;opacity:1}
.app.gon .sb-name,.app.gon .grp,.app.gon .nav span.t,.app.gon .sb-me .who,.app.gon .sb-me .more{display:none}
.app.gon .nav,.app.gon .sb-me{justify-content:center;padding:10px 0}
.app.gon .sb-top{flex-direction:column;gap:8px}
.app.gon .nav .badge{position:absolute;top:2px;right:6px;margin:0;font-size:10px;line-height:15px;min-width:15px;padding:0 4px}
.app.gon .sb-thu svg{transform:rotate(180deg)}

.wrap{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.main{padding:24px 28px 56px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;width:100%;max-width:1240px;margin-inline:auto}
.main.rong{max-width:1240px}
/* Nút quay lại thư mục cha (trên đầu trang con), cùng lề với nội dung trang. */
.vehub{width:100%;max-width:1240px;margin-inline:auto;padding:20px 28px 0}
.vehub[hidden]{display:none}
.vehub:not([hidden])+.main{padding-top:10px}
.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.head h2{margin:0;font-size:23px;line-height:1.25;text-wrap:balance}
.lead{color:var(--muted);margin:3px 0 0;max-width:72ch}

/* ---------- Thành phần chung ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15.5px}
.card.flush{padding:0;overflow:hidden}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ctitle h3{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid2>*,label.f{min-width:0}
label.f{display:grid;gap:5px;font-weight:600;font-size:13px;grid-template-columns:minmax(0,1fr)}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=password],input[type=email],input[type=number],input[type=url],input[type=datetime-local],input[type=date],input[type=month],select,textarea{width:100%;min-width:0;max-width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;flex:none}
textarea{resize:vertical}
.form{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:9px;padding:9px 15px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--accent);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.soft{background:var(--soft);color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost.bad{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;flex:none}
.ibtn:hover{background:var(--soft);color:var(--fg)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:flex;gap:3px;background:var(--soft);padding:4px;border-radius:11px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.seg .n{font-size:11.5px;font-weight:700;opacity:.75}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--soft);color:var(--muted)}
.ban{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--accent);white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:8px}
.empty svg.i{width:30px;height:30px;opacity:.6}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.box{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:11px;padding:12px;display:grid;gap:8px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:11px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--info-bg);color:var(--info)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.sheet-nguon{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.sheet-nguon .btn,.sheet-nguon input,.sheet-nguon select{height:40px}
@media (max-width:700px){.sheet-nguon{grid-template-columns:1fr}.sheet-nguon .btn{justify-self:start}}
.bang-gon td,.bang-gon th{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note b{color:inherit}
.sd-nk details{border-top:1px solid var(--line)}
.sd-nk details:first-child{border-top:0}
.sd-nk summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 0}
.sd-nk summary::-webkit-details-marker{display:none}
.sd-nk summary::after{content:'';width:7px;height:7px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 4px 3px 0}
.sd-nk details[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.sd-nk-dau{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;flex:1 1 200px;min-width:0}
.sd-nk-so{display:flex;gap:6px;flex-wrap:wrap}
.sd-nk-ct{display:grid;gap:10px;padding:0 0 12px}
.sd-nk-ct ul{margin:4px 0 0;padding-left:20px;display:grid;gap:2px}
.back{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.crumb{font-size:12px;color:var(--muted)}
.lst{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li>.c{min-width:0;flex:1}
.li b.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ---------- Chọn người ---------- */
.picker{display:grid;gap:10px}
.members{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px;align-content:start;background:var(--surface-2)}
.members label{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;min-width:0}
.members label span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.members label:hover{background:var(--soft)}
.members label:has(input:checked){background:var(--soft-2)}

/* ---------- Hộp thoại và bảng trượt ---------- */
.ov{position:fixed;inset:0;background:rgb(8 16 4 / .5);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;animation:hien .15s ease}
.dlg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-pop);width:100%;max-width:560px;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;min-height:0;animation:len .18s ease}
.dlg.rong{max-width:880px}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:16.5px;flex:1;min-width:0}
.dlg-b{padding:18px 20px;overflow:auto;min-height:0;flex:1;display:grid;gap:14px;align-content:start}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.dlg-f .msg{margin-right:auto}
@keyframes hien{from{opacity:0}to{opacity:1}}
@keyframes len{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
.menu{display:grid;gap:2px}
.mi2{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;color:var(--fg);text-decoration:none}
.mi2:hover{background:var(--soft)}
.mi2 .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mi2.bad{color:var(--bad)}.mi2.bad .ic{background:var(--bad-bg);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:grid;justify-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:12.5px;text-align:center;color:var(--fg);position:relative}
.tile .ic{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.tile[aria-current="page"]{border-color:var(--accent);background:var(--soft)}
.tile .badge{position:absolute;top:8px;right:10px;margin:0}
.who-card{display:flex;align-items:center;gap:12px;padding:6px 4px 12px}
.who-card b{display:block}
.sheet-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 4px 2px}

/* ---------- Đăng nhập ---------- */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + var(--sat)) 16px calc(24px + var(--sab));background:var(--side-bg)}
.login{width:100%;max-width:400px;background:var(--surface);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow-pop);display:grid;gap:16px}
.login .brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login .brand .logo{width:58px;height:58px;border-radius:50%;background:#fff;border:1px solid var(--line);padding:5px}
.login h2{margin:0;font-size:21px}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px;font-weight:600;cursor:pointer;width:100%}
.gbtn:hover{background:var(--soft)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- Task ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px}
.tasks{display:grid;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:12px;padding:13px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;box-shadow:var(--shadow)}
.task.st-sap{border-left-color:var(--warn)}.task.st-tre{border-left-color:var(--bad)}.task.st-xong{border-left-color:var(--ok);opacity:.8}.task.st-huy{border-left-color:var(--line-2);opacity:.7}
.task .tt{font-weight:700;font-size:15px}
.task .md{white-space:pre-wrap;font-size:13.5px;margin-top:2px}
.task .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px;align-items:center}
.task .meta b{color:var(--fg);font-weight:600}
.task .act{display:flex;gap:6px;align-items:flex-start;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Cộng điểm ---------- */
.diem-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start}
.diem-grid .recent{position:sticky;top:16px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column}
.diem-grid .recent .lst{overflow:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.type{border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:9px 14px;cursor:pointer;text-align:left;min-width:0}
.type b{display:block;overflow-wrap:anywhere}.type span{font-size:12px;color:var(--muted)}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--ring)}
.sticky-foot{position:sticky;bottom:0;background:var(--surface);margin:0 -18px -18px;padding:12px 18px;border-top:1px solid var(--line);border-radius:0 0 14px 14px}

/* ---------- Mail ---------- */
.mail{display:grid;grid-template-columns:210px minmax(260px,.9fr) minmax(0,1.5fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100dvh - 150px);min-height:480px;box-shadow:var(--shadow)}
.mail.hai{grid-template-columns:minmax(260px,.9fr) minmax(0,1.6fr)}
.folders{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--surface-2)}
.folders .soan{margin-bottom:10px;justify-content:flex-start;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow)}
.fd{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);width:100%;white-space:nowrap}
.fd span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.fd:hover{background:var(--soft);color:var(--fg)}
.fd[aria-current="page"]{background:var(--soft-2);color:var(--accent)}
.fd .badge{margin-left:auto}
.mlist{border-right:1px solid var(--line);overflow:auto;min-width:0;display:flex;flex-direction:column}
.msearch{padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer;color:var(--fg)}
.mi:hover{background:var(--surface-2)}
.mi[aria-current="true"]{background:var(--soft)}
.mi .t1{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.mi b,.mi .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mi .s{font-size:13px}.mi .d{font-size:12px;color:var(--muted);white-space:nowrap}
.mi.moi b,.mi.moi .s.tde{font-weight:800}
.mread{padding:18px 20px;min-width:0;display:grid;gap:12px;align-content:start;overflow:auto}
.mread h3{margin:0;font-size:18px}
.mmsg{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.mbody{width:100%;border:1px solid var(--line);border-radius:10px;min-height:80px;background:#fff}
.mact{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.drafts{display:grid;gap:10px}
.draft{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;box-shadow:var(--shadow)}
.draft[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring)}
.draft .tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draft .s{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph{font-family:var(--f-num);font-size:11.5px;background:var(--info-bg);color:var(--info);padding:1px 6px;border-radius:5px;white-space:nowrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;padding:6px 14px 6px 6px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600;font-size:13px;border:0;cursor:pointer}
.step span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:12px}
.step[aria-current="step"]{background:var(--accent);color:var(--on-accent)}
.step[aria-current="step"] span{color:var(--accent)}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.srcb{border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px}
.srcb b{display:flex;gap:8px;align-items:center}
.srcb span{font-size:12px;color:var(--muted)}
.srcb[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

/* ---------- Khung soạn thư (UCV) ---------- */
.composer .dlg-b{padding:0;gap:0}
.cmp-row{display:flex;align-items:flex-start;gap:8px;padding:6px 16px;border-bottom:1px solid var(--line);min-height:44px}
.cmp-row>label{font-size:13px;color:var(--muted);padding-top:7px;min-width:34px}
.cmp-row .links{display:flex;gap:2px;padding-top:2px}
.cmp-row .links button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:5px 6px;border-radius:6px}
.cmp-row .links button:hover{background:var(--soft);color:var(--fg)}
.recip{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0;padding:3px 0;cursor:text;position:relative}
.recip input{border:0!important;background:none!important;box-shadow:none!important;padding:5px 2px!important;flex:1;min-width:140px}
.rchip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;max-width:100%}
.rchip.sai{background:var(--bad-bg);color:var(--bad)}
.rchip button{border:0;background:none;cursor:pointer;color:inherit;padding:2px;display:grid;place-items:center;border-radius:50%}
.goiy{position:absolute;left:0;top:100%;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-pop);max-height:240px;overflow:auto;min-width:280px;max-width:100%}
.goiy button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
.goiy button:hover,.goiy button.on{background:var(--soft)}
.cmp-subject{border:0!important;background:none!important;box-shadow:none!important;padding:8px 0!important;font-weight:600}
.tbar{display:flex;flex-wrap:wrap;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);align-items:center}
.tb{min-width:32px;height:32px;border:0;background:none;border-radius:7px;cursor:pointer;display:inline-grid;place-items:center;color:var(--fg);padding:0 6px}
.tb:hover{background:var(--soft)}
.tb.on{background:var(--soft-2);color:var(--accent)}
.tb-sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.tb-sel{height:32px;width:auto!important;padding:2px 6px!important;font-size:13px;background:none!important;border-color:transparent!important}
.tb-color{position:relative;overflow:hidden}
.tb-color input{position:absolute;inset:0;opacity:0;cursor:pointer}
.editor{min-height:220px;padding:14px 16px;outline:none;font-family:Arial,sans-serif;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere;color:#1b1b1b;background:#fff}
.editor:empty:before{content:attr(data-ph);color:#9aa29a}
.editor blockquote{margin:0 0 0 .8ex;border-left:2px solid #ccc;padding-left:1ex}
.editor img{max-width:100%}
.linkpop{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.linkpop input{flex:1;min-width:160px}
.quote{padding:4px 16px 10px;background:#fff}
.quote .qt{border:1px solid #ddd;background:#f1f1f1;border-radius:6px;padding:0 8px;cursor:pointer;font-weight:700;color:#555;line-height:16px}
.sig{padding:4px 16px 14px;background:#fff;color:#555;font-family:Arial,sans-serif;font-size:13px;border-top:1px dashed #e0e0e0}
.sig .lb{font-size:11.5px;color:#888;margin:8px 0 6px;font-family:var(--f-body)}
.atts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.att{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;background:var(--surface-2);max-width:260px;font-size:13px}
.att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att.dang{opacity:.6}
.composer.keo .dlg-b{outline:3px dashed var(--accent);outline-offset:-8px}
.cmp-note{padding:10px 16px;border-bottom:1px solid var(--line)}

/* ---------- Báo cáo ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:12px;padding:11px 13px}
.kpi b{display:block;font:700 22px var(--f-num);color:var(--accent)}
.kpi span{font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}

/* ---------- Cài đặt ---------- */
.setsearch{position:relative;max-width:none}
.setsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.setsearch input{padding-left:36px}
.sgroup{display:grid;gap:6px}
.sgroup h4{margin:6px 4px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.sitem{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;text-align:left;cursor:pointer;color:var(--fg)}
.sitem:first-child{border-top:0}
.sitem:hover{background:var(--surface-2)}
.sitem .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sitem>div{min-width:0;flex:1}
.sitem b{display:block}.sitem span{font-size:12.5px;color:var(--muted)}
.sitem .chev{color:var(--muted)}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch input:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.switch input:checked{background:var(--accent)}
.switch input:checked:before{left:21px}

/* ---------- Tìm người, file log ---------- */
.pk-tim{flex:1;min-width:160px;max-width:280px}
.log-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:14px;align-items:start}

/* ---------- Thông báo ---------- */
.nhanTB{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border-radius:11px;padding:9px 12px;font-size:13.5px}
.nhanTB>span{min-width:0;flex:1 1 200px}
.nhanTB>span>svg{vertical-align:-2px;margin-right:4px}
.cachs{display:grid;gap:8px}
.cach{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;cursor:pointer;background:var(--surface-2)}
.cach input{margin-top:2px}
.cach>span>b{display:block}.cach small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.cach:has(input:checked){border-color:var(--accent);background:var(--soft)}
.tb-nhan .c{text-align:center;width:64px}
.tb-nhan td.c input{margin:0 auto}

html.nen-xanh,html.nen-xanh body{background:var(--brand-3)}

/* ---------- Đăng nhập có ảnh nền ---------- */
.login-wrap.dn.coanh{background-size:cover;background-position:center}
.login-wrap.dn.coanh .login{background:rgb(255 255 255 / .9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login-wrap.dn.coanh .login{background:rgb(23 32 18 / .9)}}
:root[data-theme="dark"] .login-wrap.dn.coanh .login{background:rgb(23 32 18 / .9)}
.anh-xem{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--side-bg);background-size:cover;background-position:center;overflow:hidden;display:grid;place-items:center;max-width:520px}
.anh-xem>span{position:absolute;top:10px;left:12px;color:#fff;font-size:12.5px;font-weight:600}
.anh-khung{width:34%;height:58%;background:rgb(255 255 255 / .9);border-radius:8px;box-shadow:0 4px 18px rgb(0 0 0 / .25)}

/* ---------- Trang chủ (khung chào nằm ở DungChung) ---------- */
.toms{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tom{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:13px;padding:12px 14px;cursor:pointer;color:var(--fg);box-shadow:var(--shadow);position:relative}
.tom b{font:700 26px/1.1 var(--f-num);color:var(--accent)}
.tom span{font-weight:700;font-size:13.5px}
.tom small{color:var(--muted);font-size:12px}
.tom.vang{border-left-color:var(--warn)}.tom.vang b{color:var(--warn)}
.tom.do{border-left-color:var(--bad)}.tom.do b{color:var(--bad)}
.tom:hover{background:var(--surface-2)}
.tom.nhanh{grid-template-columns:auto 1fr;column-gap:12px;align-items:center;border-left-width:1px;min-height:92px}
.tom.nhanh .nh-ic{grid-row:span 3;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent)}
.tom.nhanh .nh-t{font-size:15px;display:flex;gap:6px;align-items:center}
.tom.nhanh b{font-size:24px}
.tom.nhanh.vang .nh-ic{color:var(--warn)}.tom.nhanh.do .nh-ic{color:var(--bad)}
.av{background-size:cover;background-position:center}
#tomtat{display:grid;gap:10px}

/* ---------- Trang Thông báo ---------- */
.tb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.gio-o{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:2px 2px 2px 4px}
.gio-o select{width:auto;border:0;background:none;padding:6px 4px;font-weight:700}
.sk{margin:0;padding-left:20px;display:grid;gap:6px}
.mays{display:grid;gap:6px}
.may{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.may .ic{width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.may>div{min-width:0;flex:1}.may b{display:block;font-size:13.5px;overflow-wrap:anywhere}.may .hint{display:block}
.ngs .ng{display:grid;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.ng-dau{display:flex;gap:10px;align-items:center}
.ng-dau b{display:block}.ng-dau .hint{display:block}

/* ---------- Trang menu (điện thoại) ---------- */
.menu-trang{display:grid;gap:8px;max-width:640px;width:100%;margin-inline:auto}
.menu-trang .who-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.mlist2{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.mlist2 .mi2{border-radius:0;border-top:1px solid var(--line);padding:12px 14px}
.mlist2 .mi2:first-child{border-top:0}
.mi2 .t{flex:1;min-width:0}
.mi2 .badge{margin-left:0}
.mi2>svg:last-child{color:var(--muted);flex:none}

/* ---------- Thanh tab dưới (điện thoại) ---------- */
.bottom{display:none}
.chimobile{display:none}

@media (max-width:860px){
  .app,.app.gon{display:block}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:calc(8px + var(--sat)) calc(12px + var(--sar)) 8px calc(14px + var(--sal));min-height:calc(56px + var(--sat))}
  .topbar .logo{width:36px;height:36px;border-radius:50%;padding:2px}
  .topbar h1{margin:0;font-size:17px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .av{width:36px;height:36px;border:0;padding:0;cursor:pointer;font:800 15px/1 var(--f-body);display:grid;place-items:center;text-align:center}
  .main{padding:16px calc(16px + var(--sar)) calc(96px + var(--sab)) calc(16px + var(--sal));gap:14px}
  .app.motab .main{padding-bottom:calc(28px + var(--sab))}
  .vehub{padding:12px calc(16px + var(--sar)) 0 calc(16px + var(--sal))}
  .vehub:not([hidden])+.main{padding-top:8px}
  .head h2{font-size:20px}
  .card{padding:15px;border-radius:13px}
  .sticky-foot{margin:0 -15px -15px;padding:12px 15px}
  .bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px calc(6px + var(--sar)) calc(6px + var(--sab)) calc(6px + var(--sal));z-index:20;box-shadow:0 -4px 16px rgb(0 0 0 / .06)}
  .bottom button{background:none;border:0;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 2px;position:relative;border-radius:10px}
  .bottom button .ic{display:grid;place-items:center;width:52px;height:28px;border-radius:999px}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .bottom button[aria-current="page"] .ic{background:var(--soft-2)}
  .bottom .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
  .ov{padding:0;align-items:flex-end}
  .dlg{max-width:none!important;border-radius:18px 18px 0 0;max-height:calc(100dvh - var(--sat) - 12px);padding-bottom:var(--sab)}
  .dlg.full{height:100dvh;max-height:100dvh;border-radius:0;padding-top:var(--sat)}
  .dlg-b{padding:16px}
  .dlg-f{padding:10px 16px}
  .diem-grid{grid-template-columns:minmax(0,1fr)}
  .diem-grid .recent{position:static;max-height:none}
  .diem-grid .recent .lst{max-height:420px;margin:0 -15px -15px}
  .members{max-height:300px}
  .task{grid-template-columns:minmax(0,1fr)}
  .task .act{justify-content:flex-start}
  .draft{grid-template-columns:minmax(0,1fr)}
  .chimobile{display:inline-flex}
  .mail,.mail.hai{display:block;height:auto;min-height:0;border-radius:13px}
  .folders{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;scrollbar-width:none}
  .folders::-webkit-scrollbar{display:none}
  .folders .soan{display:none}
  .fd{width:auto;flex:none}
  .mlist{border-right:0;max-height:none}
  .mail.doc .mlist,.mail.doc .folders{display:none}
  .mail:not(.doc) .mread{display:none}
  .mread{padding:14px}
  .fab{position:fixed;right:calc(18px + var(--sar));bottom:calc(22px + var(--sab));z-index:15;border-radius:16px;padding:14px 18px;box-shadow:var(--shadow-pop)}
  .app:not(.motab) .fab{bottom:calc(84px + var(--sab))}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  /* iPhone tự phóng to khi ô nhập có chữ nhỏ hơn 16px */
  input[type=text],input[type=search],input[type=password],input[type=email],input[type=number],input[type=url],input[type=datetime-local],input[type=date],input[type=month],select,textarea,.editor{font-size:16px}
  .cmp-row{padding:6px 12px}
  .tbar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tbar::-webkit-scrollbar{display:none}
  .tbar>*{flex:none}
  /* Điện thoại: các nhóm nút tự xuống dòng thay vì kéo ngang (nhiều người không biết kéo được) */
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);overflow:visible;width:100%}
  .seg button{flex-direction:column;justify-content:center;gap:3px;padding:7px 4px;white-space:normal;text-align:center;font-size:12.5px;line-height:1.25;position:relative;min-width:0}
  .seg button .badge{position:absolute;top:3px;right:4px;margin:0}
  .seg .n{font-size:12px}
  #tfil{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}
  .ngs .ng{padding:12px 15px}
  .folders{flex-wrap:wrap;overflow:visible}
  .log-grid{grid-template-columns:minmax(0,1fr)}
  .pk-tim{flex:1 1 100%;max-width:none}
  .members{grid-template-columns:minmax(0,1fr)}
  .toolbar input[type=search]{max-width:none;flex-basis:100%}
}
@media (min-width:861px){ .fab{display:none} }
/* Thông báo của tôi: cột trái là cách nhận, cột phải là nội dung được nhắc và thiết bị. Của người khác: danh sách và gửi thử. */
.tb-toi,.tb-khac{display:grid;gap:14px;align-items:start}
.tb-toi>*,.tb-khac>*{min-width:0}
@media (min-width:1000px){
  .tb-toi{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tb-toi>:nth-child(2){grid-column:1;grid-row:1/span 2}
  .tb-toi>:nth-child(1),.tb-toi>:nth-child(3){grid-column:2}
  .tb-khac{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
