<style>
/* app CLB ECO, design system "giấy": nền giấy ấm, chữ màu mực, nét mảnh, xanh ECO chỉ tô mục menu đang mở và nút chọn đang bật.
   Máy tính: menu trái nền giấy (thu gọn được). Điện thoại: thanh trên có nút ☰ mở menu trượt từ trái, không có thanh tab dưới. */
:root{
  --paper:#FAF8F5; --surface:#FDFBFA; --side:#F3F1EC; --sunken:#F1EFEA;
  --ink:#27251E; --ink-2:#72706B; --ink-3:#92918B; --line:#D1D1CD; --line-2:#D1D1CD;
  --accent:#274E13; --on-accent:#FFFFFF; --accent-soft:#E4EBDD; --btn:#27251E; --on-btn:#FAF8F5;
  --ok:#3F6B35; --ok-soft:#E7EDE2; --warn:#86622A; --warn-soft:#F2EADB; --bad:#9A4636; --bad-soft:#F3E3DE; --info:#476581; --info-soft:#E5EBF0;
  --hover:rgb(39 37 30 / .06); --ring:rgb(39 78 19 / .2); --scrim:rgb(22 22 19 / .38);
  --shadow:0 1px 2px rgb(0 0 0 / .08); --shadow-pop:0 12px 40px rgb(0 0 0 / .16);
  --f-ui:"Be Vietnam Pro",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-btn:6px; --r-in:12px; --r-card:16px;
  /* Tên cũ, giữ để các trang khác dùng chung bộ màu mới */
  --bg:var(--paper); --fg:var(--ink); --muted:var(--ink-2); --surface-2:var(--sunken); --soft:var(--sunken); --soft-2:var(--accent-soft);
  --ok-bg:var(--ok-soft); --warn-bg:var(--warn-soft); --bad-bg:var(--bad-soft); --info-bg:var(--info-soft);
  --brand:var(--accent); --brand-3:var(--accent); --side-bg:var(--side); --f-body:var(--f-ui); --f-num:var(--f-ui);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161613; --surface:#1D1C18; --side:#1A1916; --sunken:#24231F; --ink:#EDEBE5; --ink-2:#A9A69E; --ink-3:#85827A;
  --line:#34322C; --line-2:#3F3D36; --accent:#2F5E18; --accent-soft:#25331D; --btn:#EDEBE5; --on-btn:#1D1C18;
  --ok:#9CC48F; --ok-soft:#232E1F; --warn:#D7B57A; --warn-soft:#352C1C; --bad:#E39A8A; --bad-soft:#3A2622; --info:#9DB5CC; --info-soft:#222B33;
  --hover:rgb(237 235 229 / .07); --ring:rgb(156 196 143 / .25); --scrim:rgb(0 0 0 / .55);
  --shadow:0 1px 2px rgb(0 0 0 / .4); --shadow-pop:0 12px 40px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161613; --surface:#1D1C18; --side:#1A1916; --sunken:#24231F; --ink:#EDEBE5; --ink-2:#A9A69E; --ink-3:#85827A;
  --line:#34322C; --line-2:#3F3D36; --accent:#2F5E18; --accent-soft:#25331D; --btn:#EDEBE5; --on-btn:#1D1C18;
  --ok:#9CC48F; --ok-soft:#232E1F; --warn:#D7B57A; --warn-soft:#352C1C; --bad:#E39A8A; --bad-soft:#3A2622; --info:#9DB5CC; --info-soft:#222B33;
  --hover:rgb(237 235 229 / .07); --ring:rgb(156 196 143 / .25); --scrim:rgb(0 0 0 / .55);
  --shadow:0 1px 2px rgb(0 0 0 / .4); --shadow-pop:0 12px 40px rgb(0 0 0 / .5); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
b,strong,th,h1,h2,h3,h4{font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
a{color:var(--ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-2)}.hint{font-size:14px;color:var(--ink-2)}
.err{color:var(--bad)}
/* Báo kết quả: nền mực, chữ giấy */
.toast{background:var(--ink);color:var(--paper);border-radius:var(--r-in);padding:6px 14px;font-size:14px;display:inline-block}
.num{font-variant-numeric:tabular-nums}

/* ---------- Khung ứng dụng ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.app.gon{grid-template-columns:72px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);color:var(--ink-2);display:flex;flex-direction:column;padding:16px 12px 12px;gap:12px;min-width:0;z-index:5;border-right:1px solid var(--line)}
.sb-top{display:flex;align-items:center;gap:10px;padding:0 4px;min-height:40px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:500;color:var(--ink);flex:none;overflow:hidden;padding:2px;border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.sb-name{font-weight:500;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;flex:1}
.sb-thu{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:6px;border-radius:var(--r-btn);display:grid;place-items:center}
.sb-thu:hover{background:var(--hover);color:var(--ink)}
.sb-nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 12px 4px;white-space:nowrap}
.grp:first-child{padding-top:2px}
.grp:empty{display:none}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:8px 12px;border-radius:var(--r-in);cursor:pointer;white-space:nowrap;width:100%;color:var(--ink-2);position:relative;font-size:15px}
.nav span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.badge{margin-left:auto;background:var(--ink);color:var(--paper);border-radius:999px;font-size:11px;padding:0 7px;font-weight:500;line-height:18px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.nav[aria-current="page"] .badge{background:var(--on-accent);color:var(--accent)}
.sb-user{border-top:1px solid var(--line);padding-top:10px}
.sb-me{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;border-radius:var(--r-in);text-align:left}
.sb-me:hover{background:var(--hover)}
.sb-me .who{min-width:0;flex:1}
.sb-me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-me span{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sb-me .more{color:var(--ink-3)}
.av{width:32px;height:32px;border-radius:50%;background:var(--sunken);color:var(--ink);display:grid;place-items:center;font-weight:500;flex:none;border:1px solid var(--line)}
.sb-me span.av{display:grid;font-size:14px;color:var(--ink)}
.app.gon .sb-name,.app.gon .grp,.app.gon .nav span.t,.app.gon .sb-me .who,.app.gon .sb-me .more{display:none}
.app.gon .nav,.app.gon .sb-me{justify-content:center;padding:10px 0}
.app.gon .sb-top{flex-direction:column;gap:8px}
.app.gon .nav .badge{position:absolute;top:2px;right:6px;margin:0;font-size:10px;line-height:15px;min-width:15px;padding:0 4px}
.app.gon .sb-thu svg{transform:rotate(180deg)}
.man{display:none}

.wrap{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.main{padding:32px 32px 64px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-content:start;width:100%;max-width:960px;margin-inline:auto}
.main.rong{max-width:1240px}
/* Nút quay lại thư mục cha (trên đầu trang con), cùng lề với nội dung trang. */
.vehub{width:100%;max-width:960px;margin-inline:auto;padding:24px 32px 0}
.vehub[hidden]{display:none}
.vehub:not([hidden])+.main{padding-top:12px}
.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.head h2{margin:0;font-size:22px;line-height:1.3;font-weight:500;text-wrap:balance}
.lead{color:var(--ink-2);margin:4px 0 0;max-width:68ch;font-size:15px}

/* ---------- Thành phần chung ---------- */
.card{background:var(--surface);border:0;border-radius:var(--r-card);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.card h3 svg.i{color:var(--ink-2)}
.card.flush{padding:0;overflow:hidden}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ctitle h3{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid2>*,label.f{min-width:0}
label.f{display:grid;gap:6px;font-weight:500;font-size:14px;grid-template-columns:minmax(0,1fr)}
label.f small{font-weight:400;color:var(--ink-3);font-size:13px}
input[type=text],input[type=search],input[type=password],input[type=email],input[type=number],input[type=url],input[type=datetime-local],input[type=date],input[type=month],select,textarea{width:100%;min-width:0;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-in);padding:9px 14px;font-weight:400;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;flex:none}
textarea{resize:vertical}
.form{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
/* Nút đặc màu mực cho việc chính; nút viền mảnh cho việc phụ. Xanh ECO không dùng cho nút. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--btn);color:var(--on-btn);border:1px solid transparent;border-radius:var(--r-in);padding:9px 16px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);border-radius:var(--r-btn);font-weight:400}
.btn.ghost:hover{background:var(--hover);opacity:1}
.btn.soft{background:var(--sunken);color:var(--ink);font-weight:400}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost.bad{background:transparent;color:var(--bad);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-btn);border:0;background:none;color:var(--ink-2);cursor:pointer;flex:none}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;color:var(--ink);white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* Nhóm nút chọn (pill): nút đang bật tô xanh ECO */
.seg{display:flex;gap:6px;flex-wrap:wrap;max-width:100%}
.seg button{border:1px solid var(--line);background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg .n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"] .n{color:inherit;opacity:.8}
/* Nhãn trạng thái có chấm màu */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-mute{background:var(--sunken);color:var(--ink-2)}
.ban{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
/* Trang trống: viền nét đứt */
.empty{border:1px dashed var(--line-2);border-radius:var(--r-in);padding:24px 16px;text-align:center;color:var(--ink-2);display:grid;justify-items:center;gap:6px;font-size:14px}
.empty svg.i{width:24px;height:24px;color:var(--ink-3)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.box{background:var(--sunken);border:1px dashed var(--line-2);border-radius:var(--r-in);padding:12px;display:grid;gap:8px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-in);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.sheet-nguon{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.sheet-nguon .btn,.sheet-nguon input,.sheet-nguon select{height:42px}
@media (max-width:700px){.sheet-nguon{grid-template-columns:1fr}.sheet-nguon .btn{justify-self:start}}
.bang-gon td,.bang-gon th{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note b{color:inherit}
.sd-nk details{border-top:1px solid var(--line)}
.sd-nk details:first-child{border-top:0}
.sd-nk summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:12px 0}
.sd-nk summary::-webkit-details-marker{display:none}
.sd-nk summary::after{content:'';width:7px;height:7px;border:solid var(--ink-3);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:0 4px 3px 0}
.sd-nk details[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.sd-nk-dau{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;flex:1 1 200px;min-width:0}
.sd-nk-so{display:flex;gap:6px;flex-wrap:wrap}
.sd-nk-ct{display:grid;gap:10px;padding:0 0 12px}
.sd-nk-ct ul{margin:4px 0 0;padding-left:20px;display:grid;gap:2px}
.back{background:none;border:0;color:var(--ink-2);cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:4px;font-size:14px}
.back:hover{color:var(--ink)}
.crumb{font-size:12px;color:var(--ink-3)}
/* Dòng danh sách phân cách bằng nét mảnh */
.lst{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li>.c{min-width:0;flex:1}
.li b.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ---------- Chọn người ---------- */
.picker{display:grid;gap:10px}
.members{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-in);padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px;align-content:start;background:var(--paper)}
.members label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;min-width:0;font-size:15px}
.members label span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.members label:hover{background:var(--hover)}
.members label:has(input:checked){background:var(--accent-soft)}

/* ---------- Hộp thoại, ngăn bên phải, menu trượt ---------- */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;animation:hien .15s ease}
.dlg{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-pop);width:100%;max-width:560px;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;min-height:0;animation:len .18s ease}
.dlg.rong{max-width:880px}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:16px;font-weight:500;flex:1;min-width:0}
.dlg-b{padding:20px;overflow:auto;min-height:0;flex:1;display:grid;gap:16px;align-content:start}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.dlg-f .msg{margin-right:auto}
/* Tạo, sửa task: ngăn bên phải trên máy tính, danh sách vẫn thấy phía sau */
.ov.ov-ngan{justify-content:flex-end;align-items:stretch;padding:0}
.ov.ov-ngan .dlg{max-width:540px;max-height:none;height:100dvh;border-radius:0;animation:sang .2s ease}
@keyframes hien{from{opacity:0}to{opacity:1}}
@keyframes len{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
@keyframes sang{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
.menu{display:grid;gap:2px}
.mi2{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 12px;border-radius:var(--r-in);cursor:pointer;text-align:left;color:var(--ink);text-decoration:none}
.mi2:hover{background:var(--hover)}
.mi2 .ic{width:32px;height:32px;border-radius:50%;background:var(--sunken);color:var(--ink-2);display:grid;place-items:center;flex:none}
.mi2.bad{color:var(--bad)}.mi2.bad .ic{background:var(--bad-soft);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:grid;justify-items:center;gap:6px;padding:14px 6px;border-radius:var(--r-in);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;text-align:center;color:var(--ink);position:relative}
.tile .ic{width:40px;height:40px;border-radius:50%;background:var(--sunken);color:var(--ink-2);display:grid;place-items:center}
.tile[aria-current="page"]{border-color:var(--accent)}
.tile .badge{position:absolute;top:8px;right:10px;margin:0}
.who-card{display:flex;align-items:center;gap:12px;padding:6px 4px 12px}
.who-card b{display:block}
.sheet-sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:8px 4px 2px}

/* ---------- Đăng nhập: ảnh nền bên trái, khung đăng nhập bên phải ---------- */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + var(--sat)) 16px calc(24px + var(--sab));background:var(--paper)}
.login-wrap.dn{grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr);place-items:stretch;padding:0}
.dn-anh{background:var(--side);background-size:cover;background-position:center;display:grid;place-items:center;border-right:1px solid var(--line)}
.dn-anh .logo{width:96px;height:96px;padding:8px;opacity:.9}
.dn-anh.coanh .logo{display:none}
.dn-form{display:grid;place-items:center;padding:calc(32px + var(--sat)) 24px calc(32px + var(--sab))}
.login{width:100%;max-width:380px;display:grid;gap:20px}
.login .brand{display:flex;align-items:center;gap:10px}
.login .brand .logo{width:36px;height:36px}
.login .brand b{font-size:16px}
.login h2{margin:0;font-size:22px;font-weight:500}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);border-radius:var(--r-in);padding:10px;cursor:pointer;width:100%}
.gbtn:hover{background:var(--hover)}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:760px){
  .login-wrap.dn{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .dn-anh{min-height:calc(140px + var(--sat));border-right:0;border-bottom:1px solid var(--line)}
  .dn-anh .logo{width:64px;height:64px}
  .dn-form{place-items:start center;padding:28px 20px calc(28px + var(--sab))}
}

/* ---------- Task: mỗi task một dòng ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px}
.tasks{display:grid;border-top:1px solid var(--line)}
.task{border-bottom:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.task.st-xong .tt,.task.st-huy .tt{color:var(--ink-2)}
.task .tt{font-weight:500;font-size:16px}
.task .md{white-space:pre-wrap;font-size:14px;color:var(--ink-2);margin-top:2px}
.task .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-top:6px;align-items:center}
.task .meta b{color:var(--ink);font-weight:400}
.task .meta svg.i{width:14px;height:14px}
.task .act{display:flex;gap:6px;align-items:flex-start;justify-content:flex-end;flex-wrap:wrap}
.tasks>.empty{margin-top:12px}

/* ---------- Cộng điểm ---------- */
.diem-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;align-items:start}
.diem-grid .recent{position:sticky;top:16px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column}
.diem-grid .recent .lst{overflow:auto;margin:0 -20px -20px;border-top:1px solid var(--line)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.type{border:1px solid var(--line);background:transparent;border-radius:var(--r-in);padding:10px 14px;cursor:pointer;text-align:left;min-width:0;color:var(--ink)}
.type:hover{background:var(--hover)}
.type b{display:block;overflow-wrap:anywhere;font-weight:400}.type span{font-size:13px;color:var(--ink-2)}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.type[aria-pressed="true"] span{color:inherit;opacity:.85}
.sticky-foot{position:sticky;bottom:0;background:var(--surface);margin:0 -20px -20px;padding:12px 20px;border-top:1px solid var(--line);border-radius:0 0 var(--r-card) var(--r-card)}

/* ---------- Mail ---------- */
.mail{display:grid;grid-template-columns:210px minmax(260px,.9fr) minmax(0,1.5fr);background:var(--surface);border-radius:var(--r-card);overflow:hidden;height:calc(100dvh - 150px);min-height:480px;box-shadow:var(--shadow)}
.mail.hai{grid-template-columns:minmax(260px,.9fr) minmax(0,1.6fr)}
.folders{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--side)}
.folders .soan{margin-bottom:10px;justify-content:flex-start}
.fd{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:8px 10px;border-radius:var(--r-in);cursor:pointer;color:var(--ink-2);width:100%;white-space:nowrap;font-size:15px}
.fd span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.fd:hover{background:var(--hover);color:var(--ink)}
.fd[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.fd[aria-current="page"] .badge{background:var(--on-accent);color:var(--accent)}
.fd .badge{margin-left:auto}
.mlist{border-right:1px solid var(--line);overflow:auto;min-width:0;display:flex;flex-direction:column}
.msearch{padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer;color:var(--ink)}
.mi:hover{background:var(--hover)}
.mi[aria-current="true"]{background:var(--sunken)}
.mi .t1{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.mi b,.mi .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mi b{font-weight:400}
.mi .s{font-size:14px;color:var(--ink-2)}.mi .d{font-size:12px;color:var(--ink-3);white-space:nowrap}
.mi.moi b,.mi.moi .s.tde{font-weight:500;color:var(--ink)}
.mread{padding:20px;min-width:0;display:grid;gap:12px;align-content:start;overflow:auto}
.mread h3{margin:0;font-size:18px;font-weight:500}
.mmsg{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.mbody{width:100%;border:1px solid var(--line);border-radius:var(--r-in);min-height:80px;background:#fff}
.mact{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.drafts{display:grid;border-top:1px solid var(--line)}
.draft{border-bottom:1px solid var(--line);padding:12px 4px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;cursor:pointer;background:none}
.draft:hover{background:var(--hover)}
.draft[aria-pressed="true"]{background:var(--accent-soft)}
.draft .tt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draft .s{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph{font-size:12px;background:var(--info-soft);color:var(--info);padding:1px 6px;border-radius:5px;white-space:nowrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;padding:5px 14px 5px 5px;border-radius:999px;background:none;border:1px solid var(--line);color:var(--ink-2);font-size:14px;cursor:pointer}
.step span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);font-size:12px}
.step[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step[aria-current="step"] span{background:var(--on-accent);color:var(--accent)}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.srcb{border:1px solid var(--line);background:transparent;border-radius:var(--r-in);padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;color:var(--ink)}
.srcb b{display:flex;gap:8px;align-items:center}
.srcb span{font-size:13px;color:var(--ink-2)}
.srcb[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}

/* ---------- Khung soạn thư (UCV) ---------- */
.composer .dlg-b{padding:0;gap:0}
.cmp-row{display:flex;align-items:flex-start;gap:8px;padding:6px 16px;border-bottom:1px solid var(--line);min-height:44px}
.cmp-row>label{font-size:14px;color:var(--ink-2);padding-top:7px;min-width:34px}
.cmp-row .links{display:flex;gap:2px;padding-top:2px}
.cmp-row .links button{background:none;border:0;color:var(--ink-2);cursor:pointer;font-size:14px;padding:5px 6px;border-radius:6px}
.cmp-row .links button:hover{background:var(--hover);color:var(--ink)}
.recip{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0;padding:3px 0;cursor:text;position:relative}
.recip input{border:0!important;background:none!important;box-shadow:none!important;padding:5px 2px!important;flex:1;min-width:140px}
.rchip{display:inline-flex;align-items:center;gap:4px;background:var(--sunken);border-radius:999px;padding:2px 4px 2px 10px;font-size:14px;max-width:100%}
.rchip.sai{background:var(--bad-soft);color:var(--bad)}
.rchip button{border:0;background:none;cursor:pointer;color:inherit;padding:2px;display:grid;place-items:center;border-radius:50%}
.goiy{position:absolute;left:0;top:100%;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-in);box-shadow:var(--shadow-pop);max-height:240px;overflow:auto;min-width:280px;max-width:100%}
.goiy button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
.goiy button:hover,.goiy button.on{background:var(--hover)}
.cmp-subject{border:0!important;background:none!important;box-shadow:none!important;padding:8px 0!important;font-weight:500}
.tbar{display:flex;flex-wrap:wrap;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--sunken);align-items:center}
.tb{min-width:32px;height:32px;border:0;background:none;border-radius:6px;cursor:pointer;display:inline-grid;place-items:center;color:var(--ink);padding:0 6px}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft)}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tb-sel{height:32px;width:auto!important;padding:2px 6px!important;font-size:13px;background:none!important;border-color:transparent!important}
.tb-color{position:relative;overflow:hidden}
.tb-color input{position:absolute;inset:0;opacity:0;cursor:pointer}
.editor{min-height:220px;padding:14px 16px;outline:none;font-family:Arial,sans-serif;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere;color:#1b1b1b;background:#fff}
.editor:empty:before{content:attr(data-ph);color:#9a9a96}
.editor blockquote{margin:0 0 0 .8ex;border-left:2px solid #ccc;padding-left:1ex}
.editor img{max-width:100%}
.linkpop{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunken)}
.linkpop input{flex:1;min-width:160px}
.quote{padding:4px 16px 10px;background:#fff}
.quote .qt{border:1px solid #ddd;background:#f1f1f1;border-radius:6px;padding:0 8px;cursor:pointer;font-weight:500;color:#555;line-height:16px}
.sig{padding:4px 16px 14px;background:#fff;color:#555;font-family:Arial,sans-serif;font-size:13px;border-top:1px dashed #e0e0e0}
.sig .lb{font-size:12px;color:#888;margin:8px 0 6px;font-family:var(--f-ui)}
.atts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.att{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-in);padding:6px 8px 6px 10px;background:var(--paper);max-width:260px;font-size:14px}
.att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att.dang{opacity:.6}
.composer.keo .dlg-b{outline:2px dashed var(--accent);outline-offset:-8px}
.cmp-note{padding:10px 16px;border-bottom:1px solid var(--line)}

/* ---------- Số liệu ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:12px 16px 12px 0;min-width:0}
.kpi b{display:block;font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.kpi span{font-size:14px;color:var(--ink-2)}
svg text{fill:var(--ink-2);font-family:var(--f-ui);font-size:11px}

/* ---------- Cài đặt ---------- */
.setsearch{position:relative;max-width:none}
.setsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.setsearch input{padding-left:40px}
.sgroup{display:grid;gap:6px}
.sgroup h4{margin:8px 0 0;font-size:12px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slist{background:var(--surface);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.sitem{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:left;cursor:pointer;color:var(--ink)}
.sitem:first-child{border-top:0}
.sitem:hover{background:var(--hover)}
.sitem .ic{width:32px;height:32px;border-radius:50%;background:var(--sunken);color:var(--ink-2);display:grid;place-items:center;flex:none}
.sitem>div{min-width:0;flex:1}
.sitem b{display:block;font-weight:500}.sitem span{font-size:14px;color:var(--ink-2)}
.sitem .chev{color:var(--ink-3)}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch input:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.switch input:checked{background:var(--accent)}
.switch input:checked:before{left:19px}

/* ---------- Góp ý: mỗi góp ý một dòng ---------- */
.gys{display:grid;border-top:1px solid var(--line)}
.gy{border-bottom:1px solid var(--line);padding:14px 4px}
.gy[data-doc]:hover{background:var(--hover)}

/* ---------- Tìm người, file log ---------- */
.pk-tim{flex:1;min-width:160px;max-width:280px}
.log-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:16px;align-items:start}

/* ---------- Thông báo ---------- */
.nhanTB{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r-in);padding:8px 12px;font-size:14px;color:var(--ink-2)}
.nhanTB b{color:var(--ink)}
.nhanTB>span{min-width:0;flex:1 1 200px}
.nhanTB>span>svg{vertical-align:-2px;margin-right:4px}
.cachs{display:grid;gap:8px}
.cach{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-in);padding:12px 14px;cursor:pointer;background:transparent}
.cach input{margin-top:3px}
.cach>span>b{display:block}.cach small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.cach:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tb-nhan .c{text-align:center;width:64px}
.tb-nhan td.c input{margin:0 auto}

/* ---------- Ảnh nền đăng nhập (xem trước trong Cài đặt) ---------- */
.anh-xem{position:relative;aspect-ratio:16/9;border-radius:var(--r-in);background:var(--side);background-size:cover;background-position:center;overflow:hidden;display:grid;grid-template-columns:1.15fr 1fr;max-width:520px;border:1px solid var(--line)}
.anh-xem>span{position:absolute;top:10px;left:12px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgb(0 0 0 / .5)}
.anh-khung{grid-column:2;background:var(--paper);display:grid;place-items:center}
.anh-khung::after{content:"";width:60%;height:46%;border:1px solid var(--line);border-radius:8px}

/* ---------- Trang chủ: dải trang trí, ba con số, danh sách cần làm ---------- */
.dai-mua{position:relative;height:56px;border-radius:var(--r-in);overflow:hidden;isolation:isolate}
.dai-mua .tt-chao{font-size:5px}
.so3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.so3>button{background:none;border:0;border-left:1px solid var(--line);padding:12px 16px;text-align:left;cursor:pointer;color:var(--ink);display:grid;gap:2px;min-width:0}
.so3>button:first-child{border-left:0;padding-left:0}
.so3>button:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.so3 b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3}
.so3 span{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canlam{display:grid;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink);cursor:pointer;width:100%}
.lrow:hover .tt{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lrow .tt{font-weight:500;min-width:0;overflow-wrap:anywhere}
.lrow .meta{grid-column:1 / -1;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);align-items:center}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0}
.sec-h h3{margin:0;font-size:16px;font-weight:500}
.sec-h a,.sec-h button{font-size:14px;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:0}
.loi-tat{display:flex;gap:8px;flex-wrap:wrap}
.av{background-size:cover;background-position:center}
/* Kiểu cũ của trang chủ (vẫn dùng ở vài trang con) */
.toms{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tom{display:grid;gap:2px;text-align:left;background:var(--surface);border:0;border-radius:var(--r-card);padding:14px 16px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);position:relative}
.tom b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.tom span{font-size:14px}
.tom small{color:var(--ink-2);font-size:13px}
.tom.vang b{color:var(--warn)}.tom.do b{color:var(--bad)}
.tom:hover{background:var(--sunken)}
#tomtat{display:grid;gap:10px}

/* ---------- Trang Thông báo ---------- */
.tb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.gio-o{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-in);padding:2px 2px 2px 4px}
.gio-o select{width:auto;border:0;background:none;padding:6px 4px;font-weight:500}
.sk{margin:0;padding-left:20px;display:grid;gap:6px}
.mays{display:grid;gap:0;border-top:1px solid var(--line)}
.may{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.may .ic{width:30px;height:30px;border-radius:50%;background:var(--sunken);color:var(--ink-2);display:grid;place-items:center;flex:none}
.may>div{min-width:0;flex:1}.may b{display:block;font-size:14px;overflow-wrap:anywhere}.may .hint{display:block}
.ngs .ng{display:grid;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.ng-dau{display:flex;gap:10px;align-items:center}
.ng-dau b{display:block}.ng-dau .hint{display:block}

/* ---------- Trang menu (điện thoại, mở từ đường dẫn cũ) ---------- */
.menu-trang{display:grid;gap:8px;max-width:640px;width:100%;margin-inline:auto}
.menu-trang .who-card{background:var(--surface);border-radius:var(--r-card);padding:14px;box-shadow:var(--shadow)}
.mlist2{background:var(--surface);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.mlist2 .mi2{border-radius:0;border-top:1px solid var(--line);padding:12px 14px}
.mlist2 .mi2:first-child{border-top:0}
.mi2 .t{flex:1;min-width:0}
.mi2 .badge{margin-left:0}
.mi2>svg:last-child{color:var(--ink-3);flex:none}

/* ---------- Điện thoại: thanh trên có nút ☰, menu trượt từ trái ---------- */
.man{position:fixed;inset:0;background:var(--scrim);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
@media (max-width:860px){
  .app,.app.gon{display:block}
  .side,.app.gon .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(300px,84vw);z-index:50;transform:translateX(-100%);transition:transform .22s ease;padding:calc(14px + var(--sat)) 12px calc(12px + var(--sab)) calc(12px + var(--sal));box-shadow:none;visibility:hidden}
  .app.mo .side{transform:none;visibility:visible;box-shadow:var(--shadow-pop)}
  .app.mo .man{opacity:1;pointer-events:auto}
  .man{display:block}
  .sb-thu{display:none}
  .app.gon .sb-name,.app.gon .grp,.app.gon .nav span.t,.app.gon .sb-me .who,.app.gon .sb-me .more{display:revert}
  .app.gon .nav span.t,.app.gon .sb-name{display:block}
  .app.gon .nav,.app.gon .sb-me{justify-content:flex-start;padding:8px 12px}
  .app.gon .sb-top{flex-direction:row}
  .app.gon .nav .badge{position:static;margin-left:auto;font-size:11px;line-height:18px;min-width:18px;padding:0 7px}
  .nav{font-size:16px;padding:10px 12px}
