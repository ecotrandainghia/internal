  ['gopy', 'mail'].forEach(function (k) {

}

function picker(id, thanhVien, chonHet) {
  var nhom = [];
  thanhVien.forEach(function (t) { if (t.nhom && nhom.indexOf(t.nhom) < 0) nhom.push(t.nhom); });
  return '<div class="picker" id="' + id + '"><div class="row sb"><b style="font-size:13px">Chọn người</b><span class="hint" data-cnt></span></div>' +
    '<div class="row"><input type="search" id="' + id + '-q" placeholder="Tìm tên…" aria-label="Tìm thành viên" class="pk-tim">' +
    '<div class="row" data-bans>' + ['Tất cả'].concat(nhom).map(function (b, i) { return '<button type="button" class="chip" aria-pressed="' + (i === 0) + '" data-b="' + esc(b) + '">' + esc(b) + '</button>'; }).join('') + '</div></div>' +
    '<div class="members">' + (thanhVien.length ? thanhVien.map(function (t, i) { return '<label data-ban="' + esc(t.nhom) + '"><input type="checkbox" id="' + id + '-m' + i + '" value="' + esc(t.ten) + '"' + (chonHet ? ' checked' : '') + '><span class="t">' + esc(t.ten) + '</span><span class="ban">' + esc(t.ban) + '</span></label>'; }).join('') : '<p class="hint" style="padding:6px">Chưa có danh sách thành viên.</p>') + '</div>' +
    '<div class="row"><button type="button" class="btn ghost sm" data-all>Chọn tất cả đang hiện</button><button type="button" class="btn ghost sm" data-none>Bỏ chọn hết</button></div></div>';
}
function bindPicker(id) {
  var el = $('#' + id), ban = 'Tất cả', q = '';
  var loc = function () { $$('.members label', el).forEach(function (l) { l.hidden = !((ban === 'Tất cả' || l.getAttribute('data-ban') === ban) && boDau(l.textContent).indexOf(q) >= 0); }); };
  var dem = function () { el.querySelector('[data-cnt]').textContent = 'Đã chọn ' + el.querySelectorAll('.members input:checked').length + ' / ' + el.querySelectorAll('.members input').length; };
  el.querySelector('[data-bans]').onclick = function (e) { var b = e.target.closest('[data-b]'); if (!b) return; ban = b.getAttribute('data-b'); $$('[data-b]', el).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); loc(); };
  $('#' + id + '-q').oninput = function (e) { q = boDau(e.target.value); loc(); };
  el.querySelector('.members').onchange = dem;
  el.querySelector('[data-all]').onclick = function () { $$('.members label:not([hidden]) input', el).forEach(function (i) { i.checked = true; }); dem(); };
  el.querySelector('[data-none]').onclick = function () { $$('.members input', el).forEach(function (i) { i.checked = false; }); dem(); };
  dem();
  return function () { return $$('.members input:checked', el).map(function (i) { return i.value; }); };
}
