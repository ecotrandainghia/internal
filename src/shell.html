/** Gọi một hàm trong Apps Script, trả về Promise. Phiên hết hạn thì quay về màn đăng nhập. */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, fail) {
    var run = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      var err = e instanceof Error ? e : new Error(String(e && e.message || e));
      if (err.message === 'SESSION_EXPIRED') { forgetSession(); showLogin(); }
      fail(err);
    });
    run[fn].apply(run, args);
  });
}

/* ---------- Trang vỏ (app cài trên điện thoại, máy tính): ghi nhớ đăng nhập, đăng nhập Google, màu thanh trên ---------- */
var wrapper = null, wrapperOrigin = '', WRAPPER_PUSH = '';
function toWrapper(d) { if (wrapper) { try { wrapper.postMessage(d, wrapperOrigin); } catch (e) {} } }
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object' || !/^https:\/\//.test(e.origin) || e.source !== window.top) return;
  if (d.eco === 'dang-ky-thong-bao' || d.eco === 'thong-bao-loi') return onPushResult(d);
  if (d.eco === 'vo') {
    WRAPPER_PUSH = String(d.thongBao || '');
    var first = !wrapper;
    wrapper = e.source; wrapperOrigin = e.origin;
    // Khoảng an toàn (tai thỏ, thanh vuốt) do trang vỏ đo, app tự chừa chỗ.
    if (d.vien) ['t', 'b', 'l', 'r'].forEach(function (k) { document.documentElement.style.setProperty('--sa' + k, (Number(d.vien[k]) || 0) + 'px'); });
    if (!first) return;
    toWrapper({ eco: 'ho-tro-vien' });
    if (d.trang) { if (USER) openPath(String(d.trang), true); else START_PATH = String(d.trang); }
    paintWrapper();
    // Phiên lưu ở trang vỏ bền hơn (điện thoại hay xoá dữ liệu của khung bên trong).
    if (!TOKEN && d.phien) openSession(String(d.phien));
    else if (TOKEN) toWrapper({ eco: 'phien', phien: TOKEN });
    if (!USER && !TOKEN && !d.phien) showLogin();
    return;
  }
  if (d.eco === 'vo-trang' && wrapper) { openPath(String(d.duong || ''), false); return; }
  if (d.eco === 'google-token' && d.token && !USER) {
    loginMsg('', 'Đang đăng nhập…');
    call('loginWithGoogle', d.token).then(loggedIn).catch(function (err) { loginMsg('bad', err.message); });
  }
});
if (window.top !== window) { try { window.top.postMessage({ eco: 'xin-chao' }, '*'); } catch (e) {} }
function paintWrapper() {
  var c = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
  if (/^#[0-9a-f]{6}$/i.test(c)) toWrapper({ eco: 'mau', mau: c, nen: c, chan: c });
}

/* ---------- Phiên đăng nhập và người dùng ---------- */
var TOKEN = null, USER = null;
function savedToken() { try { return localStorage.getItem('eco-session') || ''; } catch (e) { return ''; } }
function saveSession(t) {
  TOKEN = t || null;
  try { if (t) localStorage.setItem('eco-session', t); else localStorage.removeItem('eco-session'); } catch (e) {}
  toWrapper({ eco: 'phien', phien: t || '' });
}
function forgetSession() { saveSession(null); USER = null; }
function openSession(t) {
  TOKEN = t;
  call('openApp', t).then(function (r) {
    if (TOKEN !== t) return;
    if (!r) { forgetSession(); showLogin(); return; }
    saveSession(t); enterApp(r.user);
  }).catch(function () { if (TOKEN === t && !USER) { TOKEN = null; showLogin(); } });
}
function loggedIn(r) { saveSession(r.token); enterApp(r.user); }
function enterApp(u) {
  USER = u;
  var local = u.theme === 'system' ? 'auto' : u.theme;
  if (local !== getTheme()) { try { localStorage.setItem('eco-theme', local); } catch (e) {} applyTheme(local); }
  $('screen').hidden = true; $('screen').innerHTML = '';
  $('app').hidden = false;
  if (!pageAllowed(page)) page = 'home';
  if (START_PATH) { var p = START_PATH; START_PATH = ''; openPath(p, true); } else renderPage();
  if (u.firstLogin) startOnboarding();
}
function logOut() {
  closeMenu(); closeSettings(); closeModal();
  var t = TOKEN;
  forgetSession();
  if (t) call('logout', t).catch(function () {});
  showLogin();
}
function userSubtitle() {
  if (USER.isBod) return USER.position ? USER.position + ' · BOD' : 'BOD';
  return USER.position || ('Thành viên' + (USER.deptCode ? ' · ' + USER.deptCode : ''));
}

/* Tour: lần lượt chỉ vào từng phần chính của app. */
var tourStep = 0;
function tourSteps() {
  var phone = window.matchMedia('(max-width: 860px)').matches;
  return [
    [phone ? 'openSide' : 'nav', 'Menu', phone ? 'Bấm nút 3 gạch để mở menu. Mỗi mục là một trang bạn dùng được.' : 'Mỗi mục trên thanh bên là một trang bạn dùng được.'],
    ['main', 'Trang đang mở', 'Nội dung của trang bạn chọn hiện ở đây.'],
    [phone ? 'meBtnPhone' : 'meBtn', 'Tài khoản của bạn', 'Bấm vào avatar để mở Cài đặt, đổi giao diện sáng tối, xem lại hướng dẫn này hoặc đăng xuất.']
  ];
}
function startTour() { closeMenu(); closeSide(); tourStep = 0; showTourStep(); }
function endTour() { ['tourHole', 'tourTip'].forEach(function (id) { var n = $(id); if (n) n.remove(); }); }
function showTourStep() {
  endTour();
  var steps = tourSteps(), st = steps[tourStep], el = $(st[0]);
  if (!el) { tourStep++; return tourStep < steps.length ? showTourStep() : null; }
  var r = el.getBoundingClientRect(), pad = 6;
  var hole = document.createElement('div');
  hole.id = 'tourHole'; hole.className = 'tour-hole';
  hole.style.cssText = 'left:' + (r.left - pad) + 'px;top:' + (r.top - pad) + 'px;width:' + (r.width + pad * 2) + 'px;height:' + Math.min(r.height + pad * 2, window.innerHeight - r.top + pad) + 'px';
  var tip = document.createElement('div');
  tip.id = 'tourTip'; tip.className = 'tour-tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-label', st[1]);
  var last = tourStep === steps.length - 1;
  tip.innerHTML = '<b>' + esc(st[1]) + '</b><span>' + esc(st[2]) + '</span><div class="actions"><span>' + (tourStep + 1) + ' trên ' + steps.length + '</span>' +
    (last ? '' : '<button type="button" class="btn ghost" data-tour="end">Bỏ qua</button>') +
    '<button type="button" class="btn" data-tour="next">' + (last ? 'Xong' : 'Tiếp') + '</button></div>';
  document.body.appendChild(hole); document.body.appendChild(tip);
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  var left = r.right + 16 + tw < window.innerWidth ? r.right + 16 : Math.max(16, Math.min(r.left, window.innerWidth - tw - 16));
  var top = r.right + 16 + tw < window.innerWidth ? Math.min(Math.max(16, r.top), window.innerHeight - th - 16)
    : (r.bottom + 16 + th < window.innerHeight ? r.bottom + 16 : Math.max(16, r.top - th - 16));
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
  tip.querySelector('[data-tour="next"]').focus();
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-tour]');
  if (!b) return;
  if (b.dataset.tour === 'next' && tourStep < tourSteps().length - 1) { tourStep++; showTourStep(); } else endTour();
});
window.addEventListener('resize', function () { if ($('tourTip')) showTourStep(); });

/* ---------- Giao diện sáng, tối, theo máy (lưu trên máy này) ---------- */
function getTheme() { try { return localStorage.getItem('eco-theme') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme(t) {
  var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

}
/** Đổi giao diện: nhớ trên máy này và lưu vào tài khoản (mở ở máy khác vẫn đúng). */

  document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.themeSet === t); });
  if (USER && TOKEN) { USER.theme = t === 'auto' ? 'system' : t; call('saveTheme', TOKEN, USER.theme).catch(function () {}); }
}

var EXTRA_PAGES = { notifications: 'Thông báo', seeding: 'Seeding', birthdays: 'Sinh nhật' };

/* ---------- Link riêng cho từng trang: #/task, #/points, #/settings/rules ---------- */
var START_PATH = '', SENT_PATH = '', FROM_URL = false;
function currentPath() { return USER && !$('settings').hidden ? 'settings' + (openSection ? '/' + openSection : '') : page; }
/** Ghi đường dẫn trang đang mở lên thanh địa chỉ (trang vỏ, hoặc link Apps Script khi mở thẳng). */
function reportPath(replace) {
  var p = currentPath();
  if (FROM_URL || !USER || !p || p === SENT_PATH) return;
  SENT_PATH = p;
  if (wrapper) return toWrapper({ eco: 'trang', duong: p, thay: !!replace });
  try { google.script.history[replace ? 'replace' : 'push'](null, null, '/' + p); } catch (e) {}
}
/** Mở trang theo đường dẫn (link dán vào, nút quay lại của trình duyệt). Trang không có hoặc không được vào thì về Trang chủ. */
function openPath(path, replace) {
  var parts = String(path || '').replace(/^#?\/?/, '').split('/'), k = parts[0];
  if (!USER) { START_PATH = path; return; }
  FROM_URL = true;
  try {
    if (k === 'settings') {
      if ($('settings').hidden) openSettings();
      var all = [].concat.apply([], visibleGroups().map(function (g) { return g[2]; }));
      openSection = all.some(function (x) { return x[0] === parts[1]; }) ? parts[1] : null;
      renderSettings($('setQuery').value);
    } else {
      closeSettings();
      page = pageAllowed(k) ? k : 'home';
      renderPage();
    }
  } finally { FROM_URL = false; }
  if (replace || currentPath() !== String(path || '').replace(/^#?\/?/, '')) { SENT_PATH = ''; reportPath(true); } else SENT_PATH = currentPath();
}
try { google.script.history.setChangeHandler(function (e) { if (!wrapper) openPath(e.location && e.location.hash, false); }); } catch (e) {}
try { google.script.url.getLocation(function (l) { if (!wrapper && l && l.hash) { if (USER) openPath(l.hash, true); else START_PATH = l.hash; } }); } catch (e) {}

function visibleGroups() { return SETTINGS.filter(function (g) { return !g[1] || USER.isBod; }); }
function settingControl(r) {

  else if (act === 'todo') alert('Phần này làm ở các bước sau của kế hoạch.');
});
$('meBtn').addEventListener('click', function () { $('meMenu').hidden ? openMenu(this) : closeMenu(); });
$('meBtnPhone').addEventListener('click', function () { openMenu(this); });
$('openSide').addEventListener('click', openSide);
/* Thu gọn thanh bên trên máy tính, nhớ trên máy này */
function setFolded(on) {
  $('app').classList.toggle('folded', on);
  $('foldSide').title = on ? 'Mở rộng menu' : 'Thu gọn menu';
  $('foldSide').setAttribute('aria-label', $('foldSide').title);
  try { localStorage.setItem('eco-side-folded', on ? '1' : '0'); } catch (e) {}
}
$('foldSide').addEventListener('click', function () { setFolded(!$('app').classList.contains('folded')); });
try { if (localStorage.getItem('eco-side-folded') === '1') setFolded(true); } catch (e) {}
$('closeSide').addEventListener('click', closeSide);
$('scrim').addEventListener('click', closeSide);
/* Bấm ra vùng mờ quanh pop-up là đóng, như bấm nút Đóng của pop-up đó. Pop-up không có nút đóng (bước bắt buộc) thì giữ nguyên. */
var pressedOn = null;
document.addEventListener('mousedown', function (e) { pressedOn = e.target; });
['modal', 'settings'].forEach(function (id) {
  $(id).addEventListener('click', function (e) {
    if (e.target !== this || pressedOn !== this) return;
    var close = this.querySelector(id === 'settings' ? '[data-act="close-settings"]' : '[data-act="close-modal"]');
    if (close) close.click();
  });
});
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); openSettings(); }
  if (e.key !== 'Escape') return;
  // Có pop-up nhỏ thì Esc chỉ đóng pop-up đó (nếu nó có nút Đóng), Cài đặt bên dưới giữ nguyên.
  if (!$('modal').hidden) { var c = $('modal').querySelector('[data-act="close-modal"]'); if (c) c.click(); return; }
  closeMenu(); closeSettings(); closeSide(); endTour();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyTheme(getTheme()); });
applyTheme(getTheme());

/* Mở app: máy đã nhớ phiên thì vào thẳng, không thì hiện màn đăng nhập. Mở trong trang vỏ thì chờ trang vỏ gửi phiên. */
(function boot() {
  $('screen').innerHTML = '<div class="splash">' + loadingHtml() + '</div>';
  var t = savedToken();
  if (t) return openSession(t);
  if (window.top === window) return showLogin();
  setTimeout(function () { if (!TOKEN && !USER && !$('loginForm')) showLogin(); }, 1500);
})();
</script>
