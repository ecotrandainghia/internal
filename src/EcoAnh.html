<style>
/* Ảnh thành tích để đăng story (mọi người trừ BOD). Vẽ trên canvas 1080 × 1920. */
.anh-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.anh-grid{grid-template-columns:1fr}}
.anh-grid canvas{width:100%;max-width:340px;height:auto;border-radius:16px;box-shadow:var(--shadow-pop);display:block;margin:0 auto}
.anh-chk{display:grid;gap:8px}
.anh-chk label{display:flex;gap:8px;align-items:center;cursor:pointer}
</style>
<script>
/* =================== Ảnh thành tích =================== */
var ANH = { mau: 'la', hang: true, kpi: true, hd: true, d: null };
var MAU_ANH = {
  la: { ten: 'Lá', nen: ['#16330a', '#4f8a2b'], chu: '#ffffff', phu: 'rgba(255,255,255,.75)', nhan: '#f5d77a', chuNhan: '#3a2a00', the: 'rgba(255,255,255,.12)' },
  dem: { ten: 'Đêm', nen: ['#0b1410', '#1f3b2a'], chu: '#eaf5e4', phu: 'rgba(234,245,228,.7)', nhan: '#8cc152', chuNhan: '#0b1410', the: 'rgba(255,255,255,.08)' },
  nang: { ten: 'Nắng', nen: ['#fff7df', '#ffd877'], chu: '#213a10', phu: 'rgba(33,58,16,.72)', nhan: '#274e13', chuNhan: '#ffffff', the: 'rgba(39,78,19,.1)' }
};
var FONT_ANH = '"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif';

function napLogoAnh() {
  return new Promise(function (ok) {
    if (!window.ECO_LOGO) return ok(null);
    var im = new Image(); im.onload = function () { ok(im); }; im.onerror = function () { ok(null); }; im.src = window.ECO_LOGO;
  });
}
/** Cắt chữ cho vừa chiều rộng, thêm dấu … nếu dài quá. */
function vuaChu(c, s, w) {
  s = String(s);
  if (c.measureText(s).width <= w) return s;
  while (s.length > 1 && c.measureText(s + '…').width > w) s = s.slice(0, -1);
  return s + '…';
}
/** Chia tên thành tối đa 2 dòng vừa chiều rộng. */
function chiaDong(c, s, w) {
  var tu = String(s).split(/\s+/), dong = [''];
  tu.forEach(function (t) { var thu = dong[dong.length - 1] ? dong[dong.length - 1] + ' ' + t : t; if (c.measureText(thu).width <= w || !dong[dong.length - 1]) dong[dong.length - 1] = thu; else dong.push(t); });
  if (dong.length > 2) dong = [dong[0], vuaChu(c, dong.slice(1).join(' '), w)];
  return dong;
}
function oTron(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function veAnhThanhTich(cv, d, logo) {
  var c = cv.getContext('2d'), W = 1080, H = 1920, m = MAU_ANH[ANH.mau];
  var g = c.createLinearGradient(0, 0, W * 0.4, H); g.addColorStop(0, m.nen[0]); g.addColorStop(1, m.nen[1]);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.globalAlpha = .08; c.fillStyle = m.chu;
  [[940, 260, 260], [120, 1500, 340], [980, 1720, 180]].forEach(function (o) { c.beginPath(); c.arc(o[0], o[1], o[2], 0, Math.PI * 2); c.fill(); });
  c.globalAlpha = 1; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  var y = 190;
  if (logo) { c.save(); c.beginPath(); c.arc(W / 2, y, 80, 0, Math.PI * 2); c.closePath(); c.fillStyle = '#fff'; c.fill(); c.clip(); c.drawImage(logo, W / 2 - 80, y - 80, 160, 160); c.restore(); y += 150; }
  c.fillStyle = m.phu; c.font = '600 38px ' + FONT_ANH; c.fillText('CLB ECO Trần Đại Nghĩa', W / 2, y);
  if (d.ky) { c.font = '400 32px ' + FONT_ANH; c.fillText('Nhiệm kỳ ' + d.ky.nhiemKy + ' · Giai đoạn ' + d.ky.giaiDoan, W / 2, y + 50); }
  y += 190;
  c.fillStyle = m.chu; c.font = '800 92px ' + FONT_ANH;
  chiaDong(c, d.ten, W - 140).forEach(function (s) { c.fillText(s, W / 2, y); y += 108; });
  c.fillStyle = m.phu; c.font = '500 40px ' + FONT_ANH; c.fillText('Ban ' + d.ban, W / 2, y - 30);
  y += 200;
  c.fillStyle = m.chu; c.font = '800 230px ' + FONT_ANH; c.fillText(String(d.diem), W / 2, y);
  c.fillStyle = m.phu; c.font = '500 42px ' + FONT_ANH; c.fillText('điểm giai đoạn ' + (d.ky ? d.ky.giaiDoan : ''), W / 2, y + 70);
  y += 130;
  var nhan = [];
  (d.topGd || []).forEach(function (t, i) { if (t) nhan.push('TOP ' + d.tiLeTop + '% GIAI ĐOẠN ' + (i + 1)); });
  if (d.topCaKy && d.topGd && d.topGd.length > 1) nhan.push('TOP ' + d.tiLeTop + '% CẢ NHIỆM KỲ');
  if (ANH.hang && d.hang) nhan.push('HẠNG ' + d.hang + ' / ' + d.soNguoi);
  c.font = '700 38px ' + FONT_ANH;
  nhan.forEach(function (s, i) {
    var w = c.measureText(s).width + 80, x = (W - w) / 2;
    oTron(c, x, y, w, 76, 38); c.fillStyle = i < nhan.length - (ANH.hang && d.hang ? 1 : 0) ? m.nhan : m.the; c.fill();
    c.fillStyle = i < nhan.length - (ANH.hang && d.hang ? 1 : 0) ? m.chuNhan : m.chu; c.fillText(s, W / 2, y + 52); y += 88;
  });
  y += 20;
  var o = [];
  if (ANH.kpi) {
    if (d.log !== null) o.push([d.log + '%', 'KPI log']);
    if (d.task !== null) o.push([d.task + '%', 'KPI task']);
  }
  if (d.soLan) o.push([String(d.soLan), 'lần cộng điểm']);
  if (o.length) {
    var gap = 30, w2 = (W - 140 - gap * (o.length - 1)) / o.length;
    o.forEach(function (x, i) {
      var x0 = 70 + i * (w2 + gap);
      oTron(c, x0, y, w2, 180, 32); c.fillStyle = m.the; c.fill();
      c.fillStyle = m.chu; c.font = '800 76px ' + FONT_ANH; c.fillText(x[0], x0 + w2 / 2, y + 98);
      c.fillStyle = m.phu; c.font = '500 32px ' + FONT_ANH; c.fillText(vuaChu(c, x[1], w2 - 30), x0 + w2 / 2, y + 148);
    });
    y += 220;
  }
  if (ANH.hd && d.hoatDong.length && y + 100 + d.hoatDong.length * 66 < H - 130) {
    c.textAlign = 'left'; c.fillStyle = m.phu; c.font = '600 34px ' + FONT_ANH; c.fillText('Hoạt động nổi bật', 90, y + 20); y += 80;
    d.hoatDong.forEach(function (h) {
      c.fillStyle = m.chu; c.font = '500 38px ' + FONT_ANH; c.fillText(vuaChu(c, h.ten, W - 330), 90, y);
      c.textAlign = 'right'; c.font = '700 38px ' + FONT_ANH; c.fillText('× ' + h.so, W - 90, y); c.textAlign = 'left'; y += 66;
    });
    c.textAlign = 'center';
  }
  c.fillStyle = m.phu; c.font = '500 30px ' + FONT_ANH; c.fillText('ecotrandainghia.github.io/internal', W / 2, H - 90);
}

VIEWS.anh = function () {
  dangTai();
  Promise.all([goiPhien('layThanhTich'), napLogoAnh(), document.fonts && document.fonts.ready ? document.fonts.ready.catch(function () {}) : null]).then(function (r) {
    if (page !== 'anh') return;
    var d = r[0], logo = r[1];
    ANH.d = d;
    $('#main').innerHTML = '<div class="head"><div><h2>Ảnh thành tích</h2><p class="lead">Tạo ảnh khổ story (1080 × 1920) từ điểm và KPI của bạn trong nhiệm kỳ này, tải về rồi đăng lên story.</p></div></div>' +
      '<div class="anh-grid"><canvas id="anh-cv" width="1080" height="1920" aria-label="Ảnh thành tích của ' + esc(d.ten) + '"></canvas>' +
      '<div class="card form"><b style="font-size:13px">Màu</b><div class="row" id="anh-mau">' + Object.keys(MAU_ANH).map(function (k) { return '<button class="chip" data-mau="' + k + '" aria-pressed="' + (ANH.mau === k) + '">' + MAU_ANH[k].ten + '</button>'; }).join('') + '</div>' +
      '<b style="font-size:13px">Hiện trên ảnh</b><div class="anh-chk">' + [['hang', 'Hạng trên bảng xếp hạng'], ['kpi', 'KPI log và KPI task'], ['hd', 'Hoạt động nổi bật']].map(function (x) { return '<label><input type="checkbox" data-anh="' + x[0] + '"' + (ANH[x[0]] ? ' checked' : '') + '>' + x[1] + '</label>'; }).join('') + '</div>' +
      '<div class="row"><button class="btn" id="anh-tai">' + ic('ext', 16) + 'Tải ảnh</button>' + (navigator.canShare ? '<button class="btn ghost" id="anh-chia">Chia sẻ</button>' : '') + '<span id="anh-m"></span></div>' +
      '<p class="hint" style="margin:0">Điểm và KPI lấy theo số liệu hiện tại của app. KPI đang tính giữa nhiệm kỳ, kết quả cuối có ở tổng kết.</p></div></div>';
    var cv = $('#anh-cv');
    var ve = function () { veAnhThanhTich(cv, d, logo); };
    ve();
    $('#anh-mau').onclick = function (e) { var b = e.target.closest('[data-mau]'); if (!b) return; ANH.mau = b.getAttribute('data-mau'); $$('#anh-mau .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); ve(); };
    $$('[data-anh]').forEach(function (x) { x.onchange = function () { ANH[x.getAttribute('data-anh')] = x.checked; ve(); }; });
    var tenTep = 'eco-thanh-tich-' + boDau(d.ten).replace(/[^a-z0-9]+/g, '-') + '.png';
    $('#anh-tai').onclick = function () { taiTep({ base64: cv.toDataURL('image/png').split(',')[1], ten: tenTep }, 'image/png'); thongBao($('#anh-m'), 'ok', 'Đã tải ảnh'); };
    if ($('#anh-chia')) $('#anh-chia').onclick = function () {
      cv.toBlob(function (blob) {
        var tep = new File([blob], tenTep, { type: 'image/png' });
        if (!navigator.canShare({ files: [tep] })) { thongBao($('#anh-m'), 'loi', 'Máy này không chia sẻ ảnh trực tiếp được, bạn bấm Tải ảnh nhé.'); return; }
        navigator.share({ files: [tep] }).catch(function (err) { if (err && err.name !== 'AbortError') thongBao($('#anh-m'), 'loi', 'Không chia sẻ được, bạn bấm Tải ảnh nhé.'); });
      }, 'image/png');
    };
  }).catch(loiTai);
};
</script>
