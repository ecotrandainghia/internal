<script>
/* Thông báo: trang xem lại tin 30 ngày, Cài đặt > Thông báo của tôi, Cài đặt > Thông báo của CLB (BOD).
   Bật thông báo app: trang vỏ (app cài trên màn hình chính) đăng ký nhận tin rồi gửi địa chỉ máy về đây. */
var NT = { me: null, club: null };

function wideModal(html) { openModal(html); $('modal').firstChild.classList.add('wide'); }
function failBox(title, err) {
  openModal('<h2 id="boxTitle">' + esc(title) + '</h2><p class="msg bad">' + esc(err.message) + '</p><div class="actions"><button type="button" class="btn ghost" data-act="close-modal">Đóng</button></div>');
}
function reportHtml(lines) { return lines && lines.length ? '<ul class="nt-report">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' : ''; }
function whenText(ms) { return fmtTime(ms) + ' ' + fmtDay(ms) + '/' + new Date(ms).getFullYear(); }

/* ---------- Trang Thông báo ---------- */
PAGES.notifications = function (main) {
  main.innerHTML = '<div class="page stack"><div class="page-head"><div><h1>Thông báo</h1><p class="lead" id="ntLead">Những tin app đã gửi bạn, qua Zalo hay app trên điện thoại đều có ở đây.</p></div>' +
    '<button type="button" class="btn ghost" data-act="notify">' + icon('bell') + 'Cách nhận tin</button></div><div id="ntBody">' + loadingHtml() + '</div></div>';
  load('myNotifications', TOKEN).then(function (d) {
    if (currentPage() !== 'notifications') return;
    $('ntLead').textContent = 'Những tin app đã gửi bạn trong ' + d.days + ' ngày qua, qua Zalo hay app trên điện thoại đều có ở đây. Tin cũ hơn app tự xoá.';
    $('ntBody').innerHTML = d.items.length ? '<div class="list">' + d.items.map(function (n) {
      return '<div class="nt-item"><div class="nt-top"><b>' + esc(n.title) + '</b><span class="soft small">' + whenText(n.at) + '</span></div>' +
        '<p>' + esc(n.body).replace(/\n/g, '<br>') + '</p></div>';
    }).join('') + '</div>' : '<div class="empty">Chưa có thông báo nào.</div>';
  }).catch(function (err) { pageError('ntBody', err); });
};

/* ---------- Thông báo của tôi (vẽ thẳng trong Cài đặt) ---------- */
/** Từ trang khác (Trang chủ, trang Thông báo): mở Cài đặt ở mục Thông báo của tôi. */
function openMyNotify() { openSettings(); openSection = 'my-notify'; renderSettings(''); }
function loadMyNotify() {
  loadFresh('myNotify', TOKEN).then(function (d) { drawMyNotify(d); })
    .catch(function (err) { if ($('myNotify')) $('myNotify').innerHTML = '<p class="msg bad">' + esc(err.message) + '</p>'; });
}
/** Nút Bật/Tắt; off là lý do chưa dùng được (nút mờ, không bấm được). */
function ntSwitch(key, on, off) {
  var dis = off ? ' disabled' : '';
  return '<span class="seg"><button type="button" data-nt-set="' + key + '" data-v="1" aria-pressed="' + !!on + '"' + dis + '>Bật</button>' +
    '<button type="button" data-nt-set="' + key + '" data-v="0" aria-pressed="' + !on + '"' + dis + '>Tắt</button></span>';
}
/** Báo kết quả ở đầu mục, cuộn tới cho người dùng thấy. */
function ntSay(kind, text) { setMsg('ntMsg', kind, text); var m = $('ntMsg'); if (m && m.scrollIntoView) m.scrollIntoView({ block: 'nearest' }); }
function ntRow(title, note, control, off, extra) {
  return '<div class="row nt-row' + (off ? ' off' : '') + '"><div><b>' + esc(title) + '</b><small>' + note + '</small>' + (extra || '') + '</div>' + control + '</div>';
}

function drawMyNotify(d, flash) {
  NT.me = d;
  var box = $('myNotify');
  if (!box) return;
  var push = WRAPPER_PUSH;
  var appOff = !wrapper ? 'Chỉ bật được trong app CLB ECO đã thêm vào màn hình chính điện thoại.'
    : push === 'can-cai' ? 'Trên iPhone, thêm CLB ECO vào màn hình chính rồi mở từ đó mới bật được.'
    : push === 'khong' ? 'Máy này không hỗ trợ thông báo của app.' : '';
  var zaloOff = d.bot.has ? '' : 'Chưa dùng được: CLB chưa có bot Zalo. BOD cài bot ở mục Thông báo của CLB.';
  var zaloNote = zaloOff || (d.linked ? 'Đã kết nối' + (d.zaloName ? ' với ' + esc(d.zaloName) : '') + '.' : 'Chưa kết nối.');
  var botLink = /^https:\/\//i.test(d.bot.link || '') ? d.bot.link : '';
  var zaloSteps = d.bot.has && !d.linked ? '<p class="nt-step">1. ' + (botLink ? 'Bấm Mở bot trên Zalo bên dưới' : 'Nhờ BOD gửi link bot, mở link đó') +
    ', bấm Quan tâm.<br>2. Quay lại đây, bấm Kiểm tra kết nối.<br>3. Trong 25 giây, nhắn mã <b class="nt-code">' + esc(d.code) + '</b> cho bot.</p><div class="nt-btns">' +
    (botLink ? '<a class="btn-outline" href="' + esc(botLink) + '" target="_blank" rel="noopener noreferrer">Mở bot trên Zalo</a>' : '') +
    '<button type="button" class="btn-outline" id="ntCheck">Kiểm tra kết nối</button></div>' : '';
  // Đã có máy bật thì vẫn đổi được, kể cả khi đang mở trên máy không bật được.
  var appLock = appOff && !d.devices.length && !d.app;
  var appNote = d.devices.length ? d.devices.length + ' máy đã bật.' + (appOff ? ' ' + esc(appOff) : '') : esc(appOff || 'Chưa bật trên máy nào.');
  var devices = (d.devices.length ? '<div class="nt-devs">' + d.devices.map(function (m) {
    return '<div class="nt-dev"><span>' + esc(m.name) + (m.at ? ' <span class="soft small">· bật ' + fmtDay(m.at) + '</span>' : '') + '</span>' +
      '<button type="button" class="btn-outline" data-nt-remove="' + esc(m.id) + '">Gỡ</button></div>';
  }).join('') + '</div>' : '') + (appOff ? '' : '<div><button type="button" class="btn-outline" id="ntEnable">Bật trên máy này</button></div>');
  box.innerHTML = (d.must ? '<p class="hint">Bạn có việc cần nhận tin nhắc, nên hãy cài xong ít nhất một cách.</p>' : '') +
    '<span class="msg" id="ntMsg" role="status"></span>' +
    ntRow('Zalo', zaloNote, ntSwitch('zalo', d.zalo, zaloOff && !d.zalo), !!zaloOff, zaloSteps) +
    ntRow('App trên điện thoại', appNote, ntSwitch('app', d.app, appLock), appLock, devices) +
    ntRow('Tự nhắc hạn task', 'Nhắc cả task của chính bạn. Mặc định tắt vì người phụ trách ban đã nhắc giúp.', ntSwitch('self', d.selfRemind, '')) +
    ntRow('Gửi thử', 'Gửi một tin thử qua mọi cách đang bật.', '<button type="button" class="btn-outline" id="ntTest">Gửi thử</button>', false, '<div id="ntReport"></div>') +
    ntRow('Thông báo 30 ngày qua', 'Xem lại những tin app đã gửi bạn.', '<button type="button" class="btn-outline" data-act="notices">Xem</button>');
  if (flash) ntSay(flash[0], flash[1]);
  box.querySelectorAll('[data-nt-set]').forEach(function (b) {
    b.onclick = function () {
      var key = b.dataset.ntSet, on = b.dataset.v === '1';
      if (key === 'self') {
        if (on === !!d.selfRemind) return;
        call('saveSelfRemind', TOKEN, on).then(function (x) { drawMyNotify(x, ['ok', x.selfRemind ? 'Đã bật tự nhắc hạn task.' : 'Đã tắt tự nhắc hạn task.']); })
          .catch(function (err) { drawMyNotify(d, ['bad', err.message]); });
        return;
      }
      if (on === !!d[key]) return;
      var ch = { zalo: !!d.zalo, app: !!d.app }; ch[key] = on;
      call('saveMyChannels', TOKEN, ch).then(function (x) { drawMyNotify(x, ['ok', 'Đã lưu cách nhận tin.']); })
        .catch(function (err) { drawMyNotify(d, ['bad', err.message]); });
    };
  });
  if ($('ntCheck')) $('ntCheck').onclick = function () {
    this.disabled = true; ntSay('', 'Bây giờ mở Zalo, nhắn mã ' + d.code + ' cho bot. App chờ tối đa 25 giây…');
    call('checkMyZalo', TOKEN).then(function (x) { drawMyNotify(x, [x.linked ? 'ok' : 'bad', x.checkText]); })
      .catch(function (err) { drawMyNotify(d, ['bad', err.message]); });
  };
  if ($('ntEnable')) $('ntEnable').onclick = function () {
    this.disabled = true; ntSay('', 'Bấm Cho phép khi điện thoại hỏi…');
    toWrapper({ eco: 'bat-thong-bao', khoaCong: d.publicKey });
  };
  $('ntTest').onclick = function () {
    this.disabled = true; ntSay('', 'Đang gửi thử…');
    call('sendMeTest', TOKEN).then(function (r) {
      $('ntTest').disabled = false;
      ntSay(r.sent ? 'ok' : 'bad', r.sent ? 'Đã gửi. Bạn xem điện thoại nhé.' : 'Chưa gửi được qua cách nào.');
      $('ntReport').innerHTML = reportHtml(r.report);
    }).catch(function (err) { $('ntTest').disabled = false; ntSay('bad', err.message); });
  };
}

/* Trang vỏ báo kết quả bật thông báo trên máy. */
function onPushResult(d) {
  if (!NT.me || !$('ntMsg')) return;
  if (d.eco === 'thong-bao-loi') { drawMyNotify(NT.me, ['bad', d.loi || 'Chưa bật được thông báo.']); return; }
  call('saveDevice', TOKEN, { endpoint: d.diaChi, key: d.khoa, name: d.tenMay, p256dh: d.p256dh, auth: d.auth })
    .then(function (x) { drawMyNotify(x, ['ok', 'Đã bật thông báo trên máy này. Bấm Gửi thử để kiểm tra.']); })
    .catch(function (err) { drawMyNotify(NT.me, ['bad', err.message]); });
}

/* ---------- Thông báo của CLB (BOD) ---------- */
function openClubNotify(view) {
  NT.view = view;
  openModal('<h2 id="boxTitle">Thông báo của CLB</h2>' + loadingHtml());
  loadFresh('clubNotify', TOKEN).then(function (d) { drawClubNotify(d); }).catch(function (err) { failBox('Thông báo của CLB', err); });
}

function drawClubNotify(d, flash, report) {
  NT.club = d;
  var draw = { people: drawNotifyPeople, alerts: drawBodAlerts, bot: drawZaloBot }[NT.view] || drawNotifyPeople;
  draw(d);
  if (flash) setMsg('ncMsg', flash[0], flash[1]);
  if (report && $('ncReport')) $('ncReport').innerHTML = reportHtml(report);
}

function drawNotifyPeople(d) {
  var linked = d.people.filter(function (p) { return p.linked; }).length;
  wideModal('<h2 id="boxTitle">Thông báo của thành viên</h2>' +
    '<p class="hint">' + linked + '/' + d.people.length + ' người đã kết nối Zalo. Đổi cách nhận giúp ai đó thì tick ở cột Zalo hoặc App; mỗi người phải giữ ít nhất một cách.</p>' +
    '<div class="nc-test"><span>Gửi thử tới mọi người qua</span><label class="check"><input type="checkbox" id="ncTZ" checked><span>Zalo</span></label>' +
    '<label class="check"><input type="checkbox" id="ncTA"><span>App</span></label><button type="button" class="btn ghost sm" data-nc-test="*">Gửi thử tất cả</button></div>' +
    '<span class="msg" id="ncMsg" role="status"></span><div id="ncReport"></div>' +
    '<div class="table-wrap"><table class="mtable nc-table"><thead><tr><th>Thành viên</th><th>Zalo</th><th>App</th><th></th></tr></thead><tbody>' +
    d.people.map(function (p) {
      return '<tr><td>' + esc(p.name) + ' <span class="soft small">' + esc(p.dept) + '</span><div class="soft small">' +
          (p.linked ? 'Zalo: ' + esc(p.zaloName || 'đã nối') + ' <button type="button" class="link-btn" data-nc-unlink="' + esc(p.id) + '">Gỡ</button>' : 'Zalo: chưa nối, mã ' + esc(p.code)) +
          ' · ' + (p.devices.length ? p.devices.map(function (m) { return esc(m.name) + ' <button type="button" class="link-btn" data-nc-dev="' + esc(m.id) + '">Gỡ</button>'; }).join(', ') : 'App: chưa bật') + '</div></td>' +
        '<td><input type="checkbox" aria-label="Nhận qua Zalo" data-nc-ch="' + esc(p.id) + '" data-k="zalo"' + (p.zalo ? ' checked' : '') + '></td>' +
        '<td><input type="checkbox" aria-label="Nhận qua app" data-nc-ch="' + esc(p.id) + '" data-k="app"' + (p.app ? ' checked' : '') + '></td>' +
        '<td><button type="button" class="btn ghost sm" data-nc-test="' + esc(p.id) + '">Gửi thử</button></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="actions"><button type="button" class="btn" data-act="close-modal">Xong</button></div>');
}

function drawBodAlerts(d) {
  openModal('<h2 id="boxTitle">Báo cho BOD</h2><p class="hint">Gửi cho mọi BOD qua cách mỗi người chọn. Kết quả duyệt thư luôn được báo cho UCV.</p>' +
    Object.keys(d.alerts).map(function (k) {
      return '<label class="check"><input type="checkbox" data-nc-alert="' + k + '"' + (d.alerts[k].on ? ' checked' : '') + '><span>' + esc(d.alerts[k].label) + '</span></label>';
    }).join('') + '<span class="msg" id="ncMsg" role="status"></span>' +
    '<div class="actions"><button type="button" class="btn" data-act="close-modal">Xong</button></div>');
}

function drawZaloBot(d) {
  var linked = d.people.filter(function (p) { return p.linked; }).length;
  openModal('<h2 id="boxTitle">Bot Zalo</h2>' +
    '<p>' + (d.bot.has ? 'Đang dùng bot <b>' + esc(d.bot.name || '(chưa rõ tên)') + '</b>. ' + linked + '/' + d.people.length + ' người đã kết nối.' : 'CLB chưa có bot Zalo.') + '</p>' +
    '<p class="hint">Head HR tạo bot mỗi năm trong Zalo Bot Manager rồi dán mã bot vào đây. Mã bot cất riêng trong phần bí mật của app, không ghi vào sheet. Đổi bot mới thì mọi người phải nhắn mã kết nối cho bot mới.</p>' +
    '<label class="field">Mã bot mới<input id="ncToken" type="password" autocomplete="off" placeholder="Dán mã bot"></label>' +
    '<div class="actions"><button type="button" class="btn" id="ncSaveBot">Lưu mã bot</button></div>' +
    (d.bot.has ? '<p class="hint">Thành viên mở bot bằng link chia sẻ (deeplink) rồi bấm Quan tâm. Dán link bot vào đây, app sẽ hiện nút mở bot cho từng người ở Cài đặt, Thông báo của tôi.</p>' +
      '<label class="field">Link chia sẻ bot<input id="ncLink" type="url" autocomplete="off" placeholder="https://..." value="' + esc(d.bot.link || '') + '"></label>' +
      '<div class="actions"><button type="button" class="btn" id="ncSaveLink">Lưu link</button></div>' : '') +
    '<span class="msg" id="ncMsg" role="status"></span>' +
    '<div class="actions"><button type="button" class="btn ghost" data-act="close-modal">Đóng</button></div>');
  if ($('ncSaveLink')) $('ncSaveLink').onclick = function () {
    this.disabled = true; setMsg('ncMsg', '', 'Đang lưu…');
    call('saveZaloBotLink', TOKEN, $('ncLink').value).then(function (x) { drawClubNotify(x, ['ok', 'Đã lưu link bot.']); })
      .catch(function (err) { $('ncSaveLink').disabled = false; setMsg('ncMsg', 'bad', err.message); });
  };
  $('ncSaveBot').onclick = function () {
    var t = $('ncToken').value.trim();
    if (!t) return setMsg('ncMsg', 'bad', 'Bạn dán mã bot vào nhé.');
    if (d.bot.has && !confirm('Đổi sang bot mới thì mọi người phải nhắn mã kết nối lại. Đổi chứ?')) return;
    this.disabled = true; setMsg('ncMsg', '', 'Đang kiểm tra mã bot…');
    call('saveZaloBot', TOKEN, t).then(function (x) { drawClubNotify(x, ['ok', 'Đã lưu bot ' + (x.bot.name || '') + '.']); })
      .catch(function (err) { $('ncSaveBot').disabled = false; setMsg('ncMsg', 'bad', err.message); });
  };
}

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.ncCh) {
    var id = t.dataset.ncCh, z = document.querySelector('[data-nc-ch="' + id + '"][data-k="zalo"]').checked, a = document.querySelector('[data-nc-ch="' + id + '"][data-k="app"]').checked;
    call('saveMemberChannels', TOKEN, id, { zalo: z, app: a }).then(function (x) { drawClubNotify(x, ['ok', 'Đã lưu.']); })
      .catch(function (err) { drawClubNotify(NT.club, ['bad', err.message]); });
  } else if (t.dataset.ncAlert) {
    var alerts = {};
    alerts[t.dataset.ncAlert] = t.checked;
    call('saveBodAlerts', TOKEN, alerts).then(function (x) { drawClubNotify(x, ['ok', 'Đã lưu.']); })
      .catch(function (err) { drawClubNotify(NT.club, ['bad', err.message]); });
  }
});

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-nt-remove],[data-nc-test],[data-nc-unlink],[data-nc-dev]');
  if (!b) return;
  if (b.dataset.ntRemove) {
    b.disabled = true;
    call('removeDevice', TOKEN, b.dataset.ntRemove).then(function (x) { drawMyNotify(x, ['ok', 'Đã gỡ máy.']); })
      .catch(function (err) { drawMyNotify(NT.me, ['bad', err.message]); });
  } else if (b.dataset.ncTest) {
    var ch = { zalo: $('ncTZ').checked, app: $('ncTA').checked };
    b.disabled = true; setMsg('ncMsg', '', 'Đang gửi thử…');
    call('sendTest', TOKEN, b.dataset.ncTest, ch).then(function (r) {
      b.disabled = false;
      setMsg('ncMsg', r.sent ? 'ok' : 'bad', 'Gửi được cho ' + r.sent + '/' + r.total + ' người.');
      $('ncReport').innerHTML = reportHtml(r.report);
    }).catch(function (err) { b.disabled = false; setMsg('ncMsg', 'bad', err.message); });
  } else if (b.dataset.ncUnlink) {
    if (!confirm('Gỡ kết nối Zalo của người này? Họ sẽ phải nhắn mã cho bot lại.')) return;
    call('unlinkZalo', TOKEN, b.dataset.ncUnlink).then(function (x) { drawClubNotify(x, ['ok', 'Đã gỡ kết nối Zalo.']); })
      .catch(function (err) { setMsg('ncMsg', 'bad', err.message); });
  } else if (b.dataset.ncDev) {
    call('removeDevice', TOKEN, b.dataset.ncDev).then(function () { return loadFresh('clubNotify', TOKEN); })
      .then(function (x) { drawClubNotify(x, ['ok', 'Đã gỡ máy.']); }).catch(function (err) { setMsg('ncMsg', 'bad', err.message); });
  }
});
</script>
