<style>
/* KPI: task và log của mình (thành viên), bảng KPI của nhiều người (BOD, HR phụ trách). */
.kpi-the{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi-the div{background:var(--soft);border-radius:12px;padding:12px}
.kpi-the b{display:block;font:700 24px var(--f-num);color:var(--accent)}
.kpi-the span{font-size:12px;color:var(--muted)}
.kq-dat{background:var(--ok-bg);color:var(--ok)}
.kq-chua{background:var(--bad-bg,#fde3e1);color:var(--bad,#b3261e)}
.kq-cho{background:var(--warn-bg);color:var(--warn)}
.kpi-task{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.kpi-task:first-child{border-top:0;padding-top:0}
.kpi-task .dh{font-size:13px;color:var(--muted)}
.kpi-bang td.n,.kpi-bang th.n{text-align:right;white-space:nowrap}
</style>
<script>
/* =================== KPI =================== */
function pillKetQua(kq, chu) {
  if (!kq) return '';
  return '<span class="pill ' + (kq === 'Đạt' ? 'kq-dat' : kq === 'Chưa đạt' ? 'kq-chua' : 'kq-cho') + '">' + esc(chu || kq) + '</span>';
}
/**
 * Tóm tắt KPI task một người: phần trăm task đạt trên số task đã có kết quả, hoặc được miễn.
 * Chỉ là con số: đạt hay chưa đạt, có certificate hay không chỉ ghi ở trang Chứng nhận của BOD.
 */
function tomTatKpi(k) {
  if (k.mien) return { so: 'Miễn', chu: 'Được miễn task (ôn thi chuyển cấp)', tiLe: null };
  var t = k.task;
  return { so: t.tiLe === null ? '–' : t.tiLe + '%', chu: 'Đạt ' + t.dat + '/' + (t.dat + t.chuaDat) + ' task có kết quả', tiLe: t.tiLe };
}

/** Tóm tắt KPI log: số buổi đã tham gia / tổng số buổi được giao cuối. */
function tomTatLog(l) {
  var giao = String(l.giaoCuoi).replace('.', ',');
  return { so: l.tiLe === null ? '–' : l.tiLe + '%', chu: l.tiLe === null ? 'Chưa được giao buổi log nào' : 'Tham gia ' + l.thamGia + '/' + giao + ' buổi được giao cuối', tiLe: l.tiLe };
}
function theLog(l) {
  var t = tomTatLog(l);
  return '<div class="card"><div class="ctitle"><h3>' + ic('file', 18) + ' Log của tôi</h3></div><div class="kpi-the"><div><b>' + t.so + '</b><span>' + t.chu + '</span></div></div>' +
    (l.chiTiet.length ? '<div style="margin-top:10px">' + l.chiTiet.map(function (c) {
      return '<div class="kpi-task"><div class="row sb"><b>' + esc(c.ten) + '</b><span class="pill ' + (c.daChot ? 'p-ok' : 'p-info') + '">' + (c.daChot ? 'Đã chốt' : 'Đang diễn ra') + '</span></div><span class="dh">Giao ' + c.giao + ' buổi' + (c.giaoCuoi !== c.giao ? ', giao cuối ' + String(c.giaoCuoi).replace('.', ',') : '') + ' · Đã tham gia ' + c.thamGia + (c.vuot ? ' · Vượt ' + c.vuot + ' buổi' + (c.daChot ? ' (đã cộng điểm)' : ' (cộng điểm khi BOD chốt)') : '') + '</span></div>';
    }).join('') + '</div>' : '<p class="hint" style="margin:10px 0 0">Chưa có sự kiện log nào giao cho bạn.</p>') + '</div>';
}

/** Trang Task và Log của thành viên (không phải BOD): việc của chính mình. */
function veKpiCaNhan(phan) {
  dangTai();
  goiPhien('layKpi').then(function (d) {
    if (page !== phan) return;
    var k = d.kpi;
    if (phan === 'log') {
      $('#main').innerHTML = '<div class="head"><div><h2>Log của tôi</h2><p class="lead">Số buổi log bạn đã tham gia so với số buổi được giao' + (k.boSung ? ', tính từ giai đoạn 2 vì bạn là thành viên bổ sung' : '') + '. BOD điểm danh sau mỗi buổi.</p></div></div>' + theLog(k.log);
      return;
    }
    var t = tomTatKpi(k);
    var the = k.mien ? '<div><b>Miễn</b><span>Bạn đang được miễn task (ôn thi chuyển cấp).</span></div>'
      : '<div><b>' + t.so + '</b><span>' + t.chu + '</span></div><div><b>' + k.task.cho + '</b><span>Task chờ BOD đánh giá</span></div><div><b>' + k.task.dangLam + '</b><span>Task đang làm</span></div>';
    $('#main').innerHTML = '<div class="head"><div><h2>Task của tôi</h2><p class="lead">Task đạt khi nộp đúng hạn và hoàn chỉnh hoặc cần chỉnh sửa, hoặc trễ hạn nhưng hoàn chỉnh.' + (k.boSung ? ' Bạn là thành viên bổ sung nên chỉ tính task giao từ giai đoạn 2.' : '') + '</p></div></div>' +
      '<div class="card"><div class="ctitle"><h3>' + ic('target', 18) + ' KPI task của tôi</h3></div><div class="kpi-the">' + the + '</div></div>' +
      '<div class="card"><div class="ctitle"><h3>' + ic('check', 18) + ' Task của tôi</h3></div><div id="kt">' + (d.task.length ? d.task.map(function (x, i) {
        return '<div class="kpi-task"><div class="row sb"><b>' + esc(x.ten) + '</b>' + (pillKetQua(x.ketQua) || '<span class="pill ' + ((ST_TASK[x.trangThai] || ['p-mute'])[0]) + '">' + esc(x.trangThai) + '</span>') + '</div>' +
          (x.moTa ? '<span class="dh">' + esc(x.moTa) + '</span>' : '') +
          '<span class="dh">Hạn ' + hienNgay(x.hanChot) + (x.hanGoc ? ' (gia hạn từ ' + hienNgay(x.hanGoc) + ')' : '') + (x.ngayNop ? ' · Nộp ' + hienNgay(x.ngayNop) : '') + (x.dungHan ? ' · ' + esc(x.dungHan) : '') + (x.chatLuong ? ' · ' + esc(x.chatLuong) : '') + ' · Giao bởi ' + esc(x.nguoiTao) + '</span>' +
          (x.dauHieu ? '<span class="dh">Nhận xét của ' + esc(x.nguoiDanhGia) + ': ' + esc(x.dauHieu) + '</span>' : '') +
          (x.phanHoi ? '<span class="dh">Phản hồi của bạn: ' + esc(x.phanHoi) + '</span>' : '') +
          (x.chatLuong ? '<div><button class="btn ghost sm" data-ph="' + i + '">' + (x.phanHoi ? 'Sửa phản hồi' : 'Phản hồi đánh giá') + '</button></div>' : '') + '</div>';
      }).join('') : '<p class="hint" style="margin:0">Bạn chưa có task nào trong nhiệm kỳ này.</p>') + '</div><div id="ktm"></div></div>' +
      '<p class="hint" style="margin:0">Xong task thì báo BOD để BOD ghi nhận. Cần gia hạn thì xin BOD trước hạn ít nhất 24 giờ.</p>';
    $$('[data-ph]').forEach(function (b) {
      b.onclick = function () {
        var x = d.task[Number(b.getAttribute('data-ph'))];
        moHop({ tieuDe: 'Phản hồi đánh giá', than: '<form class="form" id="phf"><p class="hint" style="margin:0">' + esc(x.ten) + ' · ' + esc(x.chatLuong) + '</p><label class="f">Bạn thấy đánh giá chưa chính xác ở đâu?<textarea id="pht" rows="4" maxlength="1000">' + esc(x.phanHoi) + '</textarea></label><button hidden></button></form>',
          chan: '<span class="msg" id="phm"></span><button class="btn ghost" data-dong>Đóng</button><button class="btn" id="phb">Gửi</button>' });
        var gui = function (e) { if (e) e.preventDefault(); $('#phb').disabled = true; goiPhien('phanHoiTask', x.thoiGianTao, $('#pht').value).then(function () { dongHop(true); veKpiCaNhan('task'); }).catch(function (err) { $('#phb').disabled = false; thongBao($('#phm'), 'loi', err.message); }); };
        $('#phf').onsubmit = gui; $('#phb').onclick = gui;
      };
    });
  }).catch(loiTai);
}

/** Lọc theo khối lớp (đọc từ cột Lớp), dùng chung cho các bảng dữ liệu nhiều người. */
function chipKhoi(ds, chon, id) {
  var khoi = [];
  ds.forEach(function (x) { if (x.khoi && khoi.indexOf(x.khoi) < 0) khoi.push(x.khoi); });
  khoi.sort(function (a, b) { return a - b; });
  return khoi.length > 1 ? '<div class="row" id="' + id + '">' + [0].concat(khoi).map(function (k) { return '<button class="chip" data-k="' + k + '" aria-pressed="' + (k === chon) + '">' + (k ? 'Khối ' + k : 'Mọi khối') + '</button>'; }).join('') + '</div>' : '';
}
function ganChip(id, chon) {
  var g = $('#' + id); if (!g) return;
  g.onclick = function (e) { var b = e.target.closest('.chip'); if (!b) return; $$('#' + id + ' .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); chon(b.getAttribute('data-k') !== null ? Number(b.getAttribute('data-k')) : b.getAttribute('data-b')); };
}
/** Tab trong một trang (ví dụ Task ban phụ trách: danh sách task, KPI task). ds: [[sub, tên]]. */
function tabTrang(ds) {
  return '<div class="seg" id="tabtrang" style="margin-bottom:4px">' + ds.map(function (x) { return '<button data-tab="' + x[0] + '" aria-pressed="' + ((sub || '') === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>';
}
function ganTabTrang() {
  var g = $('#tabtrang'); if (!g) return;
  g.onclick = function (e) { var b = e.target.closest('[data-tab]'); if (b) diToi(page, b.getAttribute('data-tab') || null); };
}

/**
 * Bảng KPI task hoặc KPI log của nhiều người: BOD xem mọi thành viên (trừ BOD), HR phụ trách xem các ban mình phụ trách.
 * Chỉ có con số; với BOD, số dưới 80% tô đỏ để dễ thấy ai cần nhắc. Lọc theo ban và theo khối.
 */
var KPI_BANG = { ban: 'Tất cả', khoi: 0, q: '' };
function veKpiBang(laTask, tabs) {
  var trang = page, tab = sub;
  dangTai();
  goiPhien('layKpi').then(function (d) {
    if (page !== trang || sub !== tab) return;
    var ds = d.laBod ? d.thanhVien : d.thanhVienBan, bod = d.laBod;
    var nhom = [];
    ds.forEach(function (k) { if (k.nhom && nhom.indexOf(k.nhom) < 0) nhom.push(k.nhom); });
    if (KPI_BANG.ban !== 'Tất cả' && nhom.indexOf(KPI_BANG.ban) < 0) KPI_BANG.ban = 'Tất cả';
    if (KPI_BANG.khoi && !ds.some(function (k) { return k.khoi === KPI_BANG.khoi; })) KPI_BANG.khoi = 0;
    var pv = d.phamVi || { ban: [] };
    var moTa = bod ? 'Mọi thành viên trừ BOD, trong nhiệm kỳ này (thành viên bổ sung chỉ tính từ giai đoạn 2). Kết quả cấp chứng nhận xem ở trang Chứng nhận.'
      : 'Thành viên các ban bạn phụ trách' + (pv.ban.length ? ': ' + pv.ban.map(esc).join(', ') : '') + '.';
    var dau = laTask ? '<th class="n">KPI task</th><th>Chi tiết</th><th class="n">Chờ đánh giá</th><th class="n">Đang làm</th>' : '<th class="n">KPI log</th><th>Chi tiết</th>';
    $('#main').innerHTML = '<div class="head"><div><h2>' + esc(tenTrang(trang, tab)) + '</h2><p class="lead">' + moTa + (bod ? ' ' + (laTask ? 'Đánh giá task ở trang Quản lý task.' : 'Điểm danh ở trang Sự kiện log.') : '') + '</p></div></div>' +
      (tabs ? tabTrang(tabs) : '') +
      '<div class="xh-tools"><input type="search" id="kb-q" placeholder="Tìm tên…" value="' + esc(KPI_BANG.q) + '" aria-label="Tìm thành viên">' +
      (nhom.length > 1 ? '<div class="row" id="kb-ban">' + ['Tất cả'].concat(nhom).map(function (b) { return '<button class="chip" data-b="' + esc(b) + '" aria-pressed="' + (b === KPI_BANG.ban) + '">' + esc(b) + '</button>'; }).join('') + '</div>' : '') +
      chipKhoi(ds, KPI_BANG.khoi, 'kb-khoi') + '</div>' +
      '<div class="card"><div class="tscroll"><table class="kpi-bang"><thead><tr><th>Thành viên</th><th>Ban</th>' + dau + '</tr></thead><tbody id="kb-b"></tbody></table></div></div>';
    var ve = function () {
      var q = boDau(KPI_BANG.q);
      var loc = ds.filter(function (k) { return (KPI_BANG.ban === 'Tất cả' || k.nhom === KPI_BANG.ban) && (!KPI_BANG.khoi || k.khoi === KPI_BANG.khoi) && boDau(k.ten).indexOf(q) >= 0; });
      $('#kb-b').innerHTML = loc.map(function (k) {
        var t = laTask ? tomTatKpi(k) : tomTatLog(k.log);
        var thap = bod && t.tiLe !== null && t.tiLe < 80;
        return '<tr><td>' + esc(k.ten) + (k.boSung ? ' <span class="xh-ban xh-bs">bổ sung</span>' : '') + '</td><td class="muted">' + esc(k.ban) + '</td><td class="n"><b' + (thap ? ' style="color:var(--bad)"' : '') + '>' + t.so + '</b></td><td class="muted">' + esc(t.chu) + '</td>' +
          (laTask ? '<td class="n">' + (k.task && k.task.cho ? k.task.cho : '') + '</td><td class="n">' + (k.task && k.task.dangLam ? k.task.dangLam : '') + '</td>' : '') + '</tr>';
      }).join('') || '<tr><td colspan="' + (laTask ? 6 : 4) + '" class="muted">' + (ds.length ? 'Không có ai khớp.' : bod ? 'Chưa có thành viên.' : 'BOD chưa giao ban nào cho bạn phụ trách.') + '</td></tr>';
    };
    ve();
    ganTabTrang();
    $('#kb-q').oninput = function (e) { KPI_BANG.q = e.target.value; ve(); };
    ganChip('kb-ban', function (b) { KPI_BANG.ban = b; ve(); });
    ganChip('kb-khoi', function (k) { KPI_BANG.khoi = k; ve(); });
  }).catch(loiTai);
}
/** BOD: Thành viên > KPI > KPI task (tab trống) hoặc KPI log (tab 'log'). */
VIEWS.kpi = function () { veKpiBang(sub !== 'log'); };
/** HR phụ trách ban: Ban phụ trách > Task (quản lý task giúp BOD, và KPI task), Log (KPI log). */
var TAB_PT_TASK = [['', 'Danh sách task'], ['kpi', 'KPI task']];
VIEWS.pttask = function () { if (sub === 'kpi') veKpiBang(true, TAB_PT_TASK); else veQuanLyTask(TAB_PT_TASK); };
VIEWS.ptlog = function () { veKpiBang(false); };
</script>
