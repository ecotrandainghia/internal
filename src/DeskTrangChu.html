<script>
/* =================== Màn chờ, trang chào, trang Thông báo, ảnh nền đăng nhập =================== */

/* ---------- Màn chờ (cho() nằm ở DungChung) ---------- */
function manHinhCho() { return '<div class="login-wrap dn-cho">' + cho(true) + '</div>'; }

/* ---------- Ảnh nền trang đăng nhập (lưu sẵn trên máy, chỉ tải lại khi BOD đổi ảnh) ---------- */
var ANH_NEN = (function () { try { return JSON.parse(localStorage.getItem('eco_anh_nen') || 'null'); } catch (e) { return null; } })();
var daHoiAnhNen = false;
function luuAnhNenMay(a) {
  ANH_NEN = a && a.data ? a : null;
  try { if (ANH_NEN) localStorage.setItem('eco_anh_nen', JSON.stringify(ANH_NEN)); else localStorage.removeItem('eco_anh_nen'); } catch (e) {}
}
function apAnhNen() {
  var w = $('.login-wrap.dn');
  if (!w) return;
  if (ANH_NEN && ANH_NEN.data) { w.style.backgroundImage = 'linear-gradient(rgb(12 28 6 / .25), rgb(12 28 6 / .6)), url("' + ANH_NEN.data + '")'; w.classList.add('coanh'); }
  else { w.style.backgroundImage = ''; w.classList.remove('coanh'); }
}
function napAnhNen() {
  apAnhNen();
  if (daHoiAnhNen) return;
  daHoiAnhNen = true;
  goi('layAnhNen', ANH_NEN ? ANH_NEN.phienBan : '').then(function (kq) {
    if (!kq || !kq.phienBan) luuAnhNenMay(null);
    else if (kq.data) luuAnhNenMay(kq);
    apAnhNen();
  }).catch(function () {});
}
/** Cắt ảnh vuông ở giữa và thu nhỏ còn canh × canh (ảnh đại diện, JPEG). */
function catAnhVuong(tep, canh) {
  return thuNhoAnh(tep, 1600).then(function (url) {
    return new Promise(function (ok, loi) {
      var img = new Image();
      img.onerror = function () { loi(new Error('Không mở được ảnh.')); };
      img.onload = function () {
        var c = document.createElement('canvas'), m = Math.min(img.width, img.height);
        c.width = c.height = canh;
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, canh, canh);
        ok(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = url;
    });
  });
}
/** Thu nhỏ ảnh trên máy trước khi gửi (cạnh dài tối đa 1600px, JPEG). */
function thuNhoAnh(tep, canhMax) {
  return new Promise(function (ok, loi) {
    var r = new FileReader();
    r.onerror = function () { loi(new Error('Không đọc được ảnh.')); };
    r.onload = function () {
      var img = new Image();
      img.onerror = function () { loi(new Error('Tệp này không phải ảnh, hoặc máy không mở được.')); };
      img.onload = function () {
        var tl = Math.min(1, canhMax / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * tl); c.height = Math.round(img.height * tl);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(tep);
  });
}

/* ---------- Trang chào ---------- */
function tenGoi(ten) { return String(ten || '').trim().split(/\s+/).pop(); }
function oTom(so, chu, phu, trang, lop) {
  return '<button class="tom ' + (lop || '') + '" data-p="' + trang + '"><b>' + so + '</b><span>' + chu + '</span>' + (phu ? '<small>' + phu + '</small>' : '') + '</button>';
}
/**
 * Trang chủ chỉ là lối tắt tới 4 việc dùng nhiều nhất (task, log, điểm, góp ý). Mỗi ô có một con số để biết có gì cần làm
 * mà không phải mở trang. Thành viên xem thêm link ghim và quy chế ở dưới.
 */
function oNhanh(k, d) {
  var bod = NGUOI.vaiTro === 'BOD', so = '', phu = '', lop = '';
  var phuTask = function (t) { return [t.sap ? t.sap + ' sắp đến hạn' : '', t.tre ? t.tre + ' trễ hạn' : ''].filter(String).join(' · ') || 'Không có gì gấp'; };
  if (d && k === 'task') {
    if (bod && d.taskBod) { so = d.taskBod.choDanhGia; phu = 'chờ đánh giá' + (d.taskBod.tre ? ' · ' + d.taskBod.tre + ' trễ hạn' : ''); lop = d.taskBod.tre ? 'do' : d.taskBod.choDanhGia ? 'vang' : ''; }
    else if (d.taskCuaToi) { so = d.taskCuaToi.dangLam; phu = 'đang làm · ' + phuTask(d.taskCuaToi); lop = d.taskCuaToi.tre ? 'do' : d.taskCuaToi.sap ? 'vang' : ''; }
  }
  if (d && k === 'log') {
    if (bod && d.logMo !== undefined) { so = d.logMo; phu = 'đợt log đang mở'; }
    else if (d.logCuaToi) { so = d.logCuaToi.tiLe === null ? '–' : d.logCuaToi.tiLe + '%'; phu = d.logCuaToi.tiLe === null ? 'Chưa có chỉ tiêu' : 'Đi ' + d.logCuaToi.thamGia + '/' + String(d.logCuaToi.giaoCuoi).replace('.', ',') + ' buổi'; }
  }
  if (d && k === 'xephang' && d.diemCuaToi) { so = d.diemCuaToi.diem; phu = 'điểm · hạng ' + d.diemCuaToi.hang + '/' + d.diemCuaToi.tong; }
  if (d && k === 'diem') phu = 'Cộng điểm hoạt động';
  if (d && k === 'gopy') {
    if (bod && d.gopYMoi !== undefined) { so = d.gopYMoi; phu = d.gopYMoi ? 'góp ý chưa đọc' : 'Đã đọc hết'; lop = d.gopYMoi ? 'vang' : ''; }
    else phu = 'Gửi ý kiến cho BOD';
  }
  var x = flat().filter(function (y) { return y[0] === k; })[0];
  if (!x) return '';
  return '<button class="tom nhanh ' + lop + '" data-p="' + k + '"><span class="nh-ic">' + ic(x[2], 22) + '</span><span class="nh-t">' + x[1] + huyHieu(k) + '</span>' +
    (so !== '' ? '<b>' + so + '</b>' : '') + '<small>' + (phu || (d ? '' : '&nbsp;')) + '</small></button>';
}
var NHANH = { BOD: ['task', 'log', 'diem', 'gopy'], khac: ['task', 'log', 'xephang', 'gopy'] };
function veNhanh(d) {
  var o = $('#nhanh');
  if (o) o.innerHTML = (NHANH[NGUOI.vaiTro] || NHANH.khac).map(function (k) { return oNhanh(k, d); }).join('');
}
VIEWS.home = function () {
  $('#main').innerHTML = khungChao(tenGoi(NGUOI.ten)) +
    '<div class="toms" id="nhanh"></div><div id="tomtat"></div>' +
    '<div id="tc-them" style="display:grid;gap:14px"></div>';
  veNhanh(null);
  goiPhien('layTrangChu').then(function (d) { if (page === 'home') veTomTat(d); })
    .catch(function (err) { if ($('#tomtat')) $('#tomtat').innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
};
function veTomTat(d) {
  if (!$('#tomtat')) return;
  capNhatTuTrangChu(d);
  veNhanh(d);
  var o = [];
  if (d.thu) {
    o.push(oTom(d.thu.cho, 'Thư chờ duyệt', 'BOD đang xem', 'mail'));
    o.push(oTom(d.thu.sua, 'Cần sửa lại', d.thu.sua ? 'Mở để sửa' : 'Không có', 'mail', d.thu.sua ? 'vang' : ''));
  }
  if (d.choDuyet) o.push(oTom(d.choDuyet, 'Thư chờ duyệt', 'UCV đang chờ bạn', 'mail', 'vang'));
  var tb = d.thongBao, nhac = '';
  // Chỉ nhắc cài thông báo cho người có việc được nhắc (BOD, HR phụ trách, phụ trách seeding, người tự bật nhắc task).
  var coNhac = NGUOI.vaiTro === 'BOD' || NGUOI.phuTrach || coNhomHr('SUP-SEED') || (tb && tb.tuNhac);
  if (coNhac && tb && ((tb.cach.indexOf('app') >= 0 && !tb.soMay) || (tb.cach.indexOf('zalo') >= 0 && !tb.daKetNoiZalo))) {
    nhac = '<div class="note info" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1 1 200px">' + ic('bell', 15) + ' Bạn chưa cài xong cách nhận thông báo, nên có thể bỏ lỡ nhắc hạn task.</span><button class="btn sm" data-p="thongbao">Cài thông báo</button></div>';
  }
  $('#tomtat').innerHTML = nhac + (o.length ? '<div class="toms">' + o.join('') + '</div>' : '');
  if (NGUOI.vaiTro !== 'BOD') veTrangChuThem(d);
}

/* ---------- Trang Thông báo ---------- */
var TEN_CACH = { zalo: 'Zalo', app: 'App trên điện thoại', mail: 'Mail' };
function dongThongBao(tb) {
  return '<div class="nhanTB"><span>' + ic('bell', 15) + ' Nhận thông báo qua <b>' + tb.cach.map(function (c) { return esc(TEN_CACH[c]); }).join(', ') + '</b></span><button class="btn ghost sm" data-p="thongbao">Đổi</button></div>';
}
function suKienCuaToi(tb) {
  var g = tb.suKien.lich.join('; ');
  var cach = NGUOI.vaiTro !== 'BOD' && tb.tuNhac ? ['Task của bạn sắp đến hạn hoặc trễ hạn (' + g + ').'] : [];
  if (NGUOI.phuTrach) cach.push('Task của những người bạn phụ trách sắp đến hạn hoặc trễ hạn, để bạn nhắc thêm.');
  if (coNhomHr('SUP-SEED')) cach.push('Đến giờ điền báo cáo seeding theo nhắc hẹn bạn đã đặt.');
  if (NGUOI.vaiTro === 'BOD') cach.push('Task của thành viên ban HR sắp đến hạn, nếu bạn là Head HR.');
  return {
    cach: cach,
    mail: NGUOI.vaiTro !== 'BOD' ? (NGUOI.vaiTro === 'UCV' ? ['Thư bạn gửi được duyệt hoặc bị trả lại.'] : []) :
      [].concat(tb.suKien.thuChoDuyet ? ['UCV gửi thư chờ duyệt.'] : []).concat(tb.suKien.gopY ? ['Có góp ý mới.'] : []).concat(tb.suKien.seeding ? ['HR điền báo cáo seeding.'] : [])
  };
}
function ketQuaGuiThu(kq) {
  return '<div class="note' + (kq.duoc ? ' info' : '') + '" style="display:block"><b>' + (kq.duoc ? 'Đã gửi thử' + (kq.tong > 1 ? ' tới ' + kq.duoc + ' / ' + kq.tong + ' người.' : '.') : 'Chưa gửi được.') + '</b>' +
    kq.chiTiet.map(function (x) { return '<div style="font-size:13px;margin-top:4px;overflow-wrap:anywhere">' + esc(x) + '</div>'; }).join('') + '</div>';
}
function dongMay(m, laCuaToi) {
  return '<div class="may"><span class="ic">' + ic('bell', 16) + '</span><div><b>' + esc(m.tenMay) + '</b><span class="hint">' + (m.thoiGian ? 'Bật lúc ' + ngayDayDu(m.thoiGian) : '') + '</span></div><button class="btn ghost sm" data-gomay="' + esc(m.ma) + '">Gỡ</button></div>';
}
function ganGoMay(goc, xong) {
  $$('[data-gomay]', goc).forEach(function (b) {
    b.onclick = function () {
      if (!xacNhan(b, 'Gỡ thật?')) return;
      b.disabled = true;
      goiPhien('goThietBi', b.getAttribute('data-gomay')).then(xong).catch(function (err) { b.disabled = false; alert(err.message); });
    };
  });
}
/** Trang Thông báo của tôi nằm trong Cài đặt, phần Của tôi. */
VIEWS.thongbao = function () { diToi('caidat', 'tbtoi'); };
/** phan = 'toi': cài đặt của chính mình; 'khac': BOD xem và chỉnh cách nhận của BOD và HR khác. Hai phần tách riêng, không trộn. */
function veTrangThongBao(goc, phan) {
  if (phan === 'khac') {
    // Bot Zalo không có mục riêng trong cài đặt: mở từ đây vì là một cách mọi người nhận thông báo.
    goc.innerHTML = '<div class="row"><button class="btn ghost sm" id="tb-zalo">' + ic('chat', 14) + 'Bot Zalo</button></div><div id="tb-moi" class="tb-khac"></div>';
    $('#tb-zalo').onclick = function () { diToi('caidat', 'zalo'); };
    veMoiNguoi(); return;
  }
  goc.innerHTML = cho();
  goiPhien('layThongBaoCuaToi').then(function (tb) {
    if (!goc.isConnected) return;
    goc.innerHTML = '<div id="tb-toi" class="tb-toi"></div>';
    veCuaToi(tb);
  }).catch(function (err) { goc.innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
}
function veCuaToi(tb) {
  if (!$('#tb-toi')) return;
  var z = tb.zalo || {};
  var dong = function (k, chu, phu) {
    return '<label class="cach"><input type="checkbox" value="' + k + '"' + (tb.cach.indexOf(k) >= 0 ? ' checked' : '') + '><span><b>' + chu + '</b><small>' + phu + '</small></span></label>';
  };
  var zaloPhu = !z.coBot ? 'CLB chưa có bot Zalo. Nhờ BOD tạo trong Cài đặt.' : z.daKetNoi ? 'Đã kết nối' + (z.tenZalo ? ' (' + esc(z.tenZalo) + ')' : '') + '.' :
    'Mở Zalo, tìm bot <b>' + esc(z.tenBot || 'của CLB') + '</b>. Bấm Kiểm tra Zalo rồi trong vòng 25 giây nhắn mã <b class="num">' + esc(z.ma) + '</b> cho bot.';
  var appPhu = tb.may.length ? 'Đã bật trên ' + tb.may.length + ' thiết bị.' : 'Chưa bật trên thiết bị nào. Bấm “Bật trên thiết bị này” ở dưới.';
  $('#tb-toi').innerHTML =
    (function () {
      var sk = suKienCuaToi(tb);
      return '<div class="card"><h3>' + ic('bell', 18) + ' Bạn được báo khi</h3><p class="hint" style="margin:-4px 0 0">Gửi theo cách bạn chọn bên dưới.</p>' + (sk.cach.length ? '<ul class="sk">' + sk.cach.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p class="hint">Hiện chưa có gì gửi cho bạn qua cách này.</p>') +
        (sk.mail.length ? '<h3 style="margin-top:14px">' + ic('mail', 18) + ' Báo qua mail</h3><p class="hint" style="margin:-4px 0 0">Luôn gửi qua mail.</p><ul class="sk">' + sk.mail.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    })() +
    (NGUOI.vaiTro === 'BOD' ? '' : '<div class="card form"><label class="switch"><input type="checkbox" id="tbtn"' + (tb.tuNhac ? ' checked' : '') + '>Tự nhắc task của tôi</label>' +
      '<p class="hint" style="margin:0">Không bắt buộc. HR phụ trách vẫn là người nhắc bạn chính; bật lên thì app nhắc thêm khi task của bạn sắp đến hạn hoặc trễ hạn, theo cách nhận bên dưới.</p><div id="tbnm"></div></div>') +
    '<div class="card form"><h3 style="margin:0">Cách nhận thông báo</h3><p class="hint" style="margin:0">Chọn ít nhất một cách. Thay đổi được lưu ngay.</p>' +
    '<div class="cachs" id="tb-cach">' + dong('zalo', 'Zalo', zaloPhu) + dong('app', 'App trên điện thoại', appPhu) + dong('mail', 'Mail', 'Gửi về ' + esc(tb.email) + '.') + '</div>' +
    '<div class="row">' + (z.coBot && !z.daKetNoi ? '<button class="btn ghost sm" id="tbzk">Kiểm tra Zalo</button>' : '') +
    '<button class="btn ghost sm" id="tbthu">' + ic('send', 14) + 'Gửi thử cho tôi</button></div><div id="tbm"></div></div>' +
    '<div class="card"><div class="ctitle" style="margin-bottom:6px"><h3 style="margin:0">Thiết bị đã bật thông báo app</h3><button class="btn sm" id="tbapp">' + ic('bell', 14) + 'Bật trên thiết bị này</button></div>' +
    '<div class="mays">' + (tb.may.length ? tb.may.map(function (m) { return dongMay(m, true); }).join('') : '<p class="hint" style="margin:0">Chưa có thiết bị nào.</p>') + '</div>' +
    '<p class="hint" style="margin:8px 0 0">Khi đổi điện thoại hoặc không dùng thiết bị cũ nữa, bấm Gỡ để không gửi nhầm.</p><div id="tbm2"></div></div>';
  var m = $('#tbm');
  var lai = function (kq) { tb = kq; veCuaToi(kq); };
  $$('#tb-cach input').forEach(function (c) {
    c.onchange = function () {
      var cach = $$('#tb-cach input').filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
      if (!cach.length) { c.checked = true; thongBao(m, 'loi', 'Cần giữ ít nhất một cách nhận thông báo.'); return; }
      thongBao(m, 'cho', 'Đang lưu…');
      goiPhien('luuCachNhanCuaToi', cach).then(function (kq) { tb = kq; thongBao($('#tbm'), 'ok', 'Đã lưu'); })
        .catch(function (err) { c.checked = !c.checked; thongBao($('#tbm'), 'loi', err.message); });
    };
  });
  if ($('#tbtn')) $('#tbtn').onchange = function () {
    var c = this; thongBao($('#tbnm'), 'cho', 'Đang lưu…');
    goiPhien('luuTuNhacTask', c.checked).then(function (kq) { lai(kq); thongBao($('#tbnm'), 'ok', 'Đã lưu'); })
      .catch(function (err) { c.checked = !c.checked; thongBao($('#tbnm'), 'loi', err.message); });
  };
  if ($('#tbzk')) $('#tbzk').onclick = function () {
    var b = this; b.disabled = true; thongBao(m, 'cho', 'Đang chờ 25 giây. Mở Zalo nhắn mã ' + z.ma + ' cho bot ngay nhé…');
    goiPhien('kiemTraKetNoiZalo').then(function (z2) {
      b.disabled = false;
      if (z2.daKetNoi) { tb.zalo = z2; veCuaToi(tb); thongBao($('#tbm'), 'ok', 'Đã kết nối Zalo.'); } else thongBao(m, 'loi', 'Chưa thấy tin nhắn có mã của bạn. ' + (z2.baoCao || ''));
    }).catch(function (err) { b.disabled = false; thongBao(m, 'loi', err.message); });
  };
  $('#tbapp').onclick = function () {
    var m2 = $('#tbm2');
    if (!coVo) { thongBao(m2, 'loi', 'Mở eco từ app đã cài trên điện thoại (ecotdn.github.io/home) rồi bật ở đó.'); return; }
    if (VO_TB === 'can-cai') { thongBao(m2, 'loi', 'Trên iPhone, cần thêm app CLB ECO vào màn hình chính (Chia sẻ, Thêm vào MH chính) rồi mở từ đó mới bật được thông báo.'); return; }
    if (VO_TB === 'cu') { thongBao(m2, 'loi', 'App trên máy này là bản cũ. Xoá app khỏi màn hình chính rồi thêm lại, sau đó bật lại.'); return; }
    if (VO_TB === 'khong') { thongBao(m2, 'loi', 'Trình duyệt này không hỗ trợ thông báo của app.'); return; }
    thongBao(m2, 'cho', 'Bấm “Bật” ở hộp hiện ra rồi cho phép thông báo.');
    batThongBaoMay(tb.khoaCong).then(function (may) { return goiPhien('luuThietBi', may); })
      .then(function (kq) { lai(kq); thongBao($('#tbm2'), 'ok', 'Đã bật thông báo trên máy này.'); if ($('#tb-moi')) veMoiNguoi(); })
      .catch(function (err) { thongBao($('#tbm2'), 'loi', err.message); });
  };
  $('#tbthu').onclick = function () {
    var b = this; b.disabled = true; thongBao(m, 'cho', 'Đang gửi…');
    goiPhien('guiThuThongBaoCuaToi').then(function (kq) { b.disabled = false; m.innerHTML = ketQuaGuiThu(kq); })
      .catch(function (err) { b.disabled = false; thongBao(m, 'loi', err.message); });
  };
  ganGoMay($('#tb-toi'), function () { goiPhien('layThongBaoCuaToi').then(lai); if ($('#tb-moi')) veMoiNguoi(); });
}
function veMoiNguoi() {
  var goc = $('#tb-moi');
  if (!goc.innerHTML) goc.innerHTML = '<div class="card">' + cho() + '</div>';
  goiPhien('layNguoiNhanThongBao').then(function (ds) {
    if (!$('#tb-moi')) return;
    var chon = ['app'];
    var guiThu = '<div class="card form"><h3 style="margin:0">' + ic('send', 18) + ' Gửi thử nhắc deadline</h3><p class="hint" style="margin:0">Kiểm tra một người đã nhận được thông báo hay chưa.</p>' +
      '<label class="f">Gửi cho<select id="gt-ai"><option value="*">Tất cả mọi người (' + ds.length + ')</option>' + ds.map(function (n) { return '<option value="' + esc(n.email) + '">' + esc(n.ten) + ' · ' + (VAI_TRO[n.vaiTro] || esc(n.vaiTro)) + '</option>'; }).join('') + '</select></label>' +
      '<div><div class="hint" style="margin-bottom:6px">Gửi bằng</div><div class="row" id="gt-cach">' + ['zalo', 'app', 'mail'].map(function (k) { return '<button type="button" class="chip" data-c="' + k + '" aria-pressed="' + (chon.indexOf(k) >= 0) + '">' + TEN_CACH[k] + '</button>'; }).join('') + '</div></div>' +
      '<div class="row"><button class="btn sm" id="gt-b">Gửi thử</button></div><div id="gt-m"></div></div>';
    goc.innerHTML = '<div class="card flush"><div style="padding:16px 18px 4px"><h3 style="margin:0 0 4px">Cách nhận của từng người</h3><p class="hint" style="margin:0 0 8px">Bấm vào từng cách để bật hoặc tắt; thay đổi được lưu ngay. Thiết bị nào không còn dùng thì bấm Gỡ.</p></div>' +
      '<div class="ngs">' + ds.map(function (n, i) {
        var canhBao = [n.cach.indexOf('zalo') >= 0 && !n.daKetNoiZalo ? 'Chưa kết nối Zalo' : '', n.cach.indexOf('app') >= 0 && !n.soMay ? 'Chưa bật thông báo app trên thiết bị nào' : ''].filter(String);
        return '<div class="ng"><div class="ng-dau"><span class="av" aria-hidden="true">' + esc(chuCai(n.ten)) + '</span><div style="min-width:0;flex:1"><b>' + esc(n.ten) + '</b><span class="hint">' + (VAI_TRO[n.vaiTro] || esc(n.vaiTro)) + (n.daKetNoiZalo ? ' · Zalo đã kết nối' : '') + '</span></div></div>' +
          '<div class="row" data-n="' + i + '">' + ['zalo', 'app', 'mail'].map(function (k) { return '<button type="button" class="chip" data-k="' + k + '" aria-pressed="' + (n.cach.indexOf(k) >= 0) + '">' + TEN_CACH[k] + '</button>'; }).join('') + '</div>' +
          (canhBao.length ? '<div class="err" style="font-size:12px">' + canhBao.join(', ') + '</div>' : '') +
          (n.may.length ? '<div class="mays">' + n.may.map(function (m) { return dongMay(m); }).join('') + '</div>' : '') + '</div>';
      }).join('') + '</div><div style="padding:0 18px 12px" id="mn-m"></div></div>' + guiThu;
    $('#gt-cach').onclick = function (e) {
      var b = e.target.closest('[data-c]'); if (!b) return;
      var on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on);
    };
    $('#gt-b').onclick = function () {
      var cach = $$('#gt-cach [aria-pressed="true"]').map(function (b) { return b.getAttribute('data-c'); });
      if (!cach.length) { thongBao($('#gt-m'), 'loi', 'Chọn ít nhất một cách gửi.'); return; }
      var b = this; b.disabled = true; thongBao($('#gt-m'), 'cho', 'Đang gửi…');
      goiPhien('guiThuThongBao', { email: $('#gt-ai').value, cach: cach }).then(function (kq) { b.disabled = false; $('#gt-m').innerHTML = ketQuaGuiThu(kq); })
        .catch(function (err) { b.disabled = false; thongBao($('#gt-m'), 'loi', err.message); });
    };
    $$('.ngs [data-k]').forEach(function (b) {
      b.onclick = function () {
        var hang = b.parentNode, n = ds[Number(hang.getAttribute('data-n'))];
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on);
        var cach = $$('[data-k][aria-pressed="true"]', hang).map(function (x) { return x.getAttribute('data-k'); });
        if (!cach.length) { b.setAttribute('aria-pressed', 'true'); thongBao($('#mn-m'), 'loi', 'Mỗi người cần ít nhất một cách nhận.'); return; }
        goiPhien('luuCachNhan', n.email, cach).then(function () {
          n.cach = cach; thongBao($('#mn-m'), 'ok', 'Đã lưu cho ' + n.ten + '.');
          if (n.email.toLowerCase() === NGUOI.email.toLowerCase()) goiPhien('layThongBaoCuaToi').then(veCuaToi);
        }).catch(function (err) { b.setAttribute('aria-pressed', !on); thongBao($('#mn-m'), 'loi', err.message); });
      };
    });
    ganGoMay(goc, function () { veMoiNguoi(); goiPhien('layThongBaoCuaToi').then(veCuaToi); });
  }).catch(function (err) { goc.innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
}
</script>
