<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body{font-family:Arial,sans-serif;font-size:14px;color:#1b2416;margin:0;padding:4px 2px}
  label{display:block;font-weight:bold;margin:12px 0 4px}
  small{font-weight:normal;color:#5f6b58}
  input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:8px;border:1px solid #c9d3c0;border-radius:6px}
  .kieu label{font-weight:normal;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
  .kieu small{display:block}
  button{margin-top:16px;background:#274e13;color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:bold;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #kq{margin-top:12px;white-space:pre-wrap}
  .ok{color:#2f7a28}.loi{color:#b3261e}
</style>
</head>
<body>
  <label for="link">Link sheet danh sách thành viên</label>
  <input type="text" id="link" value="<?= linkNguon ?>" placeholder="https://docs.google.com/spreadsheets/d/…">
  <label for="tab">Tên tab <small>Bỏ trống để dùng tab đầu tiên</small></label>
  <input type="text" id="tab">

  <label>Kiểu tải</label>
  <div class="kieu">
    <label><input type="radio" name="kieu" value="Sau tuyển đợt 1"><span>Sau tuyển đợt 1<small>Bắt đầu nhiệm kỳ mới, học kỳ 1. Điểm trên app eco về 0.</small></span></label>
    <label><input type="radio" name="kieu" value="Sau tuyển đợt 2"><span>Sau tuyển đợt 2<small>Bắt đầu học kỳ 2. Điểm về 0, người còn ở lại xem được điểm học kỳ 1.</small></span></label>
    <label><input type="radio" name="kieu" value="Cập nhật" checked><span>Cập nhật<small>Chỉ cập nhật thông tin thành viên, không đổi điểm.</small></span></label>
  </div>

  <label for="mk">Mật khẩu chung của CLB <small><?= coMatKhauMacDinh ? 'Đã có. Bỏ trống để giữ nguyên, nhập mới để đổi.' : 'Mọi thành viên dùng mật khẩu này cho lần đăng nhập app eco đầu tiên. Ít nhất 6 ký tự.' ?> Người đã tự đổi mật khẩu thì không bị ảnh hưởng.</small></label>
  <input type="password" id="mk" autocomplete="new-password">

  <button id="nut" onclick="tai()">Tải lên</button>
  <div id="kq"></div>

<script>
function tai() {
  var kieu = document.querySelector('input[name=kieu]:checked').value;
  if (kieu !== 'Cập nhật' && !confirm('Chọn "' + kieu + '" sẽ bắt đầu học kỳ mới và đưa điểm trên app eco về 0. Tiếp tục?')) return;
  var nut = document.getElementById('nut');
  var kq = document.getElementById('kq');
  nut.disabled = true;
  kq.className = '';
  kq.textContent = 'Đang tải…';
  google.script.run
    .withSuccessHandler(function (thongBao) { nut.disabled = false; kq.className = 'ok'; kq.textContent = thongBao; })
    .withFailureHandler(function (e) { nut.disabled = false; kq.className = 'loi'; kq.textContent = e.message; })
    .taiDanhSachThanhVien({
      link: document.getElementById('link').value,
      tenTab: document.getElementById('tab').value.trim(),
      kieu: kieu,
      matKhauMacDinh: document.getElementById('mk').value,
      ve: <?!= JSON.stringify(ve) ?>
    });
}
</script>
</body>
</html>
