<script>
/* =================== Cộng điểm, task, báo cáo, file log, góp ý, cài đặt =================== */

/* ---------- Cộng điểm ---------- */
VIEWS.diem = function () {
  dangTai();
  goiPhien('layDuLieuCongDiem').then(function (d) {
    if (page !== 'diem') return;
    $('#main').innerHTML = '<div class="head"><div><h2>Cộng điểm</h2><p class="lead">' + (d.ky ? 'Nhiệm kỳ ' + esc(d.ky.nhiemKy) + ' · Giai đoạn ' + d.ky.hocKy + '. ' : '') + 'Chọn loại hoạt động và những người được cộng. BOD không tham gia cộng điểm nên không có trong danh sách.</p></div></div>' +
      (d.ky ? '' : '<div class="note">' + ic('info') + '<span>Chưa có giai đoạn nào. Hãy tải danh sách thành viên kiểu "Sau tuyển đợt 1" ở menu ECO hậu kỳ trong Google Sheet.</span></div>') +
      '<div class="diem-grid"><form class="card form" id="fd">' +
      '<div><div style="font-weight:600;font-size:13px;margin-bottom:8px">Loại hoạt động</div><div class="types" id="types">' +
      (d.loai.length ? d.loai.map(function (l, i) { return '<button type="button" class="type" aria-pressed="' + (i === 0) + '" data-t="' + esc(l.ten) + '"><b>' + esc(l.ten) + '</b><span>+' + l.diem + ' điểm</span></button>'; }).join('') : '<span class="hint">Chưa có loại hoạt động. Thêm trong Cài đặt.</span>') + '</div></div>' +
      '<label class="f">Tên hoạt động <small>Không bắt buộc</small><input type="text" id="actname" maxlength="200" placeholder="Ví dụ: Hội chợ xuân"></label>' +
      picker('pk', d.thanhVien) +
      '<div class="sticky-foot row"><button class="btn" id="cd-b">' + ic('star', 16) + 'Cộng điểm</button><span id="dmsg"></span></div></form>' +
      '<div class="card recent"><div class="ctitle"><h3>Vừa cộng gần đây</h3><span class="hint">Cộng nhầm thì bấm Xoá</span></div><div class="lst" id="ganday">' +
      (d.ganDay.length ? d.ganDay.map(function (r) {
        return '<div class="li"><div class="c"><b class="t">' + esc(r.ten) + '</b><span class="s">' + esc(r.loai) + (r.tenHoatDong ? ' · ' + esc(r.tenHoatDong) : '') + ' · ' + ngayGio(r.thoiGian) + ' · ' + esc(r.nguoiCong) + '</span></div><span class="num" style="font-weight:700;color:var(--accent)">+' + r.diem + '</span><button class="btn ghost sm" data-del="' + r.thoiGian + '" data-ten="' + esc(r.ten) + '">Xoá</button></div>';
      }).join('') : rong(ic('star') + 'Chưa có lần cộng nào trong giai đoạn này.')) +
      '</div><div id="delm"></div></div></div>';
    var layChon = bindPicker('pk');
    $('#types').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; $$('#types .type').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); };
    $('#fd').onsubmit = function (e) {
      e.preventDefault();
      var loai = $('#types [aria-pressed=true]');
      var nguoi = layChon();
      if (!loai) { thongBao($('#dmsg'), 'loi', 'Chưa có loại hoạt động. Thêm trong Cài đặt.'); return; }
      if (!nguoi.length) { thongBao($('#dmsg'), 'loi', 'Bạn chưa chọn ai.'); return; }
      $('#cd-b').disabled = true; thongBao($('#dmsg'), 'cho', 'Đang lưu…');
      goiPhien('congDiem', { loai: loai.getAttribute('data-t'), tenHoatDong: $('#actname').value, nguoi: nguoi }).then(function (n) {
        VIEWS.diem(); setTimeout(function () { thongBao($('#dmsg'), 'ok', 'Đã cộng điểm ' + loai.getAttribute('data-t') + ' cho ' + n + ' người'); }, 900);
      }).catch(function (err) { $('#cd-b').disabled = false; thongBao($('#dmsg'), 'loi', err.message); });
    };
    $$('[data-del]').forEach(function (b) {
      b.onclick = function () {
        if (!xacNhan(b, 'Xoá thật?')) return;
        b.disabled = true;
        goiPhien('xoaDongDiem', Number(b.getAttribute('data-del')), b.getAttribute('data-ten')).then(function () { VIEWS.diem(); }).catch(function (err) { b.disabled = false; thongBao($('#delm'), 'loi', err.message); });
      };
    });
  }).catch(loiTai);
};

/* ---------- Task ---------- */
var ST_TASK = { 'Đã giao': ['p-info', ''], 'Sắp đến hạn': ['p-warn', 'st-sap'], 'Trễ hạn': ['p-bad', 'st-tre'], 'Không hoàn thành': ['p-bad', 'st-tre'], 'Đã xong': ['p-ok', 'st-xong'], 'Đã huỷ': ['p-mute', 'st-huy'] };
function hienNgay(s) { var p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : esc(s); }
function congNgay(s, n) { var p = s.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
/* ---------- Nhận thông báo (Zalo, app trên điện thoại, mail) ---------- */
VIEWS.task = function () {
  dangTai();
  goiPhien('layDuLieuTask').then(function (d) {
    if (page !== 'task') return;
    var loc = 'mo', tim = '', nhom = '';
    var laMo = function (t) { return t.trangThai !== 'Đã xong' && t.trangThai !== 'Đã huỷ' && t.trangThai !== 'Không hoàn thành'; };
    var hop = function (t, k) { return k === 'mo' ? laMo(t) : t.trangThai === k; };
    var dem = function (k) { return d.task.filter(function (t) { return hop(t, k) && (!nhom || t.nhom === nhom); }).length; };
    var LOC = [['mo', 'Đang mở'], ['Sắp đến hạn', 'Sắp đến hạn'], ['Trễ hạn', 'Trễ hạn'], ['Không hoàn thành', 'Không hoàn thành'], ['Đã xong', 'Đã xong'], ['Đã huỷ', 'Đã huỷ']];
    $('#main').innerHTML = '<div class="head"><div><h2>Task</h2><p class="lead">' + (NGUOI.vaiTro === 'HR' ? 'Task bạn tạo sẽ ghi là “nhập task”.' : 'Task BOD tạo ghi là “giao task”, task HR tạo ghi là “nhập task”.') + (d.phamVi ? ' ' + esc(d.phamVi) : '') + '</p></div>' + (d.thanhVien.length ? '<button class="btn" id="newt">' + ic('plus', 16) + 'Tạo task</button>' : '') + '</div>' +
      (d.thongBao ? '<div id="zbox">' + dongThongBao(d.thongBao) + '</div>' : '') +
      '<div class="toolbar"><div class="seg" id="tfil">' + LOC.map(function (x) { return '<button data-f="' + x[0] + '" aria-pressed="' + (x[0] === loc) + '">' + x[1] + ' <span class="n">' + dem(x[0]) + '</span></button>'; }).join('') + '</div>' +
      '<input type="search" id="tq" placeholder="Tìm theo tên task hoặc người phụ trách…" aria-label="Tìm task"></div>' +
      (d.dsNhom.length > 1 ? '<div class="toolbar"><div class="seg" id="tban">' + [''].concat(d.dsNhom).map(function (n) { return '<button data-b="' + esc(n) + '" aria-pressed="' + (n === nhom) + '">' + (n ? esc(n) : 'Mọi ban') + '</button>'; }).join('') + '</div></div>' : '') +
      '<div id="tam"></div><div class="tasks" id="tl"></div>' +
      '<p class="hint">“Đang mở” gồm mọi task chưa xong, chưa huỷ và chưa bị tính không hoàn thành. “Sắp đến hạn” là còn ' + (d.sapDenHanNgay === 0 ? 'đúng ngày hạn' : d.sapDenHanNgay + ' ngày trở xuống') + '. Trễ quá ' + d.khongHoanThanhSau + ' ngày mà chưa xong thì tính là không hoàn thành, thôi nhắc. Thành viên xin gia hạn trước hạn ít nhất 24 giờ thì bấm Gia hạn. Task đã xong được BOD đánh giá chất lượng, app tự ra Đạt hoặc Chưa đạt. Task đã xong, đã huỷ hoặc không hoàn thành được giữ ở đây 120 ngày.</p>';

    var ve = function () {
      var q = boDau(tim);
      $$('#tfil [data-f]').forEach(function (x) { x.querySelector('.n').textContent = dem(x.getAttribute('data-f')); });
      var rows = d.task.filter(function (t) { return hop(t, loc) && (!nhom || t.nhom === nhom) && (!q || boDau(t.ten + ' ' + t.nguoi).indexOf(q) >= 0); });
      $('#tl').innerHTML = rows.map(function (t) {
        var i = d.task.indexOf(t), mo = laMo(t), st = ST_TASK[t.trangThai] || ['p-mute', ''];
        return '<div class="task ' + st[1] + '"><div><div class="tt">' + esc(t.ten) + '</div>' + (t.moTa ? '<div class="md">' + esc(t.moTa) + '</div>' : '') +
          '<div class="meta"><span class="pill ' + st[0] + '">' + esc(t.trangThai) + '</span>' + pillKetQua(t.ketQua) + '<span>' + ic('users', 14) + ' <b>' + esc(t.nguoi) + '</b></span><span>' + ic('clock', 14) + ' Hạn <b>' + hienNgay(t.hanChot) + '</b>' + (t.hanGoc ? ' (gia hạn từ ' + hienNgay(t.hanGoc) + ')' : '') + '</span>' + (t.ngayNop ? '<span>Nộp ' + hienNgay(t.ngayNop) + (t.dungHan ? ' · ' + esc(t.dungHan) : '') + '</span>' : '') + '<span>' + esc(t.kieuTao) + ' bởi ' + esc(t.nguoiTao) + ' · ' + ngayGio(t.thoiGianTao) + '</span>' + (t.hrPhuTrach ? '<span>HR phụ trách: ' + esc(t.hrPhuTrach) + '</span>' : '') + '</div>' +
          (t.chatLuong ? '<div class="md">' + esc(t.chatLuong) + ' · ' + esc(t.nguoiDanhGia) + (t.dauHieu ? ': ' + esc(t.dauHieu) : '') + (t.phanHoi ? '<br>Phản hồi của ' + esc(t.nguoi) + ': ' + esc(t.phanHoi) : '') + '</div>' : '') + '</div>' +
          '<div class="act">' + (NGUOI.vaiTro === 'BOD' && t.trangThai === 'Đã xong' ? '<button class="btn sm" data-dg="' + i + '">' + ic('star', 14) + (t.chatLuong ? 'Sửa đánh giá' : 'Đánh giá') + '</button>' : '') +
          (t.sua && mo ? '<button class="btn ghost sm" data-gh="' + i + '">Gia hạn</button>' : '') +
          (NGUOI.vaiTro === 'BOD' && t.trangThai !== 'Đã huỷ' && t.hrPhuTrach ? '<button class="btn ghost sm" data-quen="' + i + '">HR quên nhắc</button>' : '') + (!t.sua ? (t.nguoi !== NGUOI.ten ? '' : mo ? '<button class="btn sm" data-st="Đã xong" data-i="' + i + '">' + ic('check', 14) + 'Đã xong</button>' : t.trangThai === 'Đã xong' ? '<button class="btn ghost sm" data-st="Đã giao" data-i="' + i + '">Mở lại</button>' : '') : mo ? '<button class="btn sm" data-st="Đã xong" data-i="' + i + '">' + ic('check', 14) + 'Đã xong</button><button class="btn ghost sm" data-edit="' + i + '">' + ic('edit', 14) + 'Sửa</button><button class="btn ghost sm" data-st="Đã huỷ" data-i="' + i + '">Huỷ</button>' : t.trangThai === 'Không hoàn thành' ? '<button class="btn ghost sm" data-edit="' + i + '">' + ic('edit', 14) + 'Sửa hạn</button><button class="btn ghost sm" data-st="Đã huỷ" data-i="' + i + '">Huỷ</button>' : '<button class="btn ghost sm" data-st="Đã giao" data-i="' + i + '">Mở lại</button>') + '</div></div>';
      }).join('') || rong(ic('check') + 'Không có task nào.');
      $$('#tl [data-st]').forEach(function (b) {
        b.onclick = function () {
          var t = d.task[Number(b.getAttribute('data-i'))], st = b.getAttribute('data-st');
          if (st === 'Đã xong') { hopTask(t, 'xong'); return; }
          if (st === 'Đã huỷ' && !xacNhan(b, 'Huỷ thật?')) return;
          b.disabled = true;
          goiPhien('doiTrangThaiTask', t.thoiGianTao, t.nguoi, st).then(function () { VIEWS.task(); }).catch(function (err) { b.disabled = false; thongBao($('#tam'), 'loi', err.message); });
        };
      });
      $$('#tl [data-dg]').forEach(function (b) { b.onclick = function () { hopTask(d.task[Number(b.getAttribute('data-dg'))], 'danhgia'); }; });
      $$('#tl [data-gh]').forEach(function (b) { b.onclick = function () { hopTask(d.task[Number(b.getAttribute('data-gh'))], 'giahan'); }; });
      $$('#tl [data-quen]').forEach(function (b) { b.onclick = function () { hopTask(d.task[Number(b.getAttribute('data-quen'))], 'quen'); }; });
      $$('#tl [data-edit]').forEach(function (b) { b.onclick = function () { moForm(d.task[Number(b.getAttribute('data-edit'))]); }; });
    };

    /** Hộp nhỏ cho một task: ghi ngày nộp khi xong, đánh giá (BOD), gia hạn, ghi nhận HR quên nhắc. */
    var hopTask = function (t, kieu) {
      var CL = ['Hoàn chỉnh', 'Cần chỉnh sửa', 'Làm quá sơ sài'];
      var cfg = {
        xong: { tieuDe: 'Đánh dấu đã xong', nut: 'Đã xong', than: '<label class="f">Ngày nộp <small>Ngày người làm nộp sản phẩm. Nộp sau hạn chót thì tính trễ hạn.</small><input type="date" id="hx" value="' + d.homNay + '" max="' + d.homNay + '"></label>' },
        danhgia: { tieuDe: 'Đánh giá chất lượng', nut: 'Lưu đánh giá', than: '<div class="types" id="hcl">' + CL.map(function (c) { return '<button type="button" class="type" aria-pressed="' + (c === (t.chatLuong || 'Hoàn chỉnh')) + '" data-cl="' + c + '"><b>' + c + '</b></button>'; }).join('') + '</div>' +
          '<p class="hint" style="margin:0">Hoàn chỉnh: dùng được ngay. Cần chỉnh sửa: làm nghiêm túc nhưng cần điều chỉnh, kể cả khi chưa đúng ý. Làm quá sơ sài: thiếu quá nửa phần việc, làm khác hẳn yêu cầu, nộp bản nháp, file trống hoặc chép nguyên mẫu. Chưa đúng ý không phải là sơ sài.</p>' +
          '<label class="f">Dấu hiệu, nhận xét <small>Bắt buộc khi chọn Làm quá sơ sài. Người làm đọc được.</small><textarea id="hdh" rows="3" maxlength="1000">' + esc(t.dauHieu) + '</textarea></label>' +
          '<p class="hint" style="margin:0">Nộp ' + hienNgay(t.ngayNop) + ', hạn ' + hienNgay(t.hanChot) + ': ' + esc(t.dungHan) + '.</p>' },
        giahan: { tieuDe: 'Gia hạn', nut: 'Lưu gia hạn', than: '<p class="hint" style="margin:0">Chỉ tính là gia hạn khi thành viên xin trước hạn ít nhất 24 giờ (muộn nhất là ngày trước hạn chót ' + hienNgay(t.hanChot) + ') và được chấp thuận. Xin muộn hơn thì không gia hạn, nộp sau hạn là trễ hạn.</p>' +
          '<div class="grid2"><label class="f">Thành viên xin vào ngày<input type="date" id="hgx" value="' + d.homNay + '" max="' + d.homNay + '"></label><label class="f">Hạn chót mới<input type="date" id="hgm" value="' + congNgay(t.hanChot, 2) + '"></label></div>' },
        quen: { tieuDe: 'HR quên nhắc', nut: 'Ghi nhận', than: '<p class="hint" style="margin:0">Ghi nhận ' + esc(t.hrPhuTrach) + ' (HR phụ trách ' + esc(t.nguoi) + ') quên một lượt nhắc của task này. Lần quên tính vào KPI của ' + esc(t.hrPhuTrach) + '.</p>' +
          '<label class="f">Lượt quên<select id="hql"><option>Lượt tối trước hạn 1 ngày</option><option>Lượt sáng ngày hạn</option></select></label>' }
      }[kieu];
      moHop({ tieuDe: cfg.tieuDe, than: '<form class="form" id="htf"><p style="margin:0"><b>' + esc(t.ten) + '</b> · ' + esc(t.nguoi) + '</p>' + cfg.than + '<button hidden></button></form>',
        chan: '<span class="msg" id="htm"></span><button class="btn ghost" data-dong>Đóng</button><button class="btn" id="htb">' + cfg.nut + '</button>' });
      if ($('#hcl')) $('#hcl').onclick = function (e) { var b = e.target.closest('[data-cl]'); if (!b) return; $$('#hcl .type').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); };
      var gui = function (e) {
        if (e) e.preventDefault();
        var p = kieu === 'xong' ? goiPhien('doiTrangThaiTask', t.thoiGianTao, t.nguoi, 'Đã xong', $('#hx').value)
          : kieu === 'danhgia' ? goiPhien('danhGiaTask', t.thoiGianTao, t.nguoi, { chatLuong: $('#hcl [aria-pressed=true]').getAttribute('data-cl'), dauHieu: $('#hdh').value })
          : kieu === 'giahan' ? goiPhien('giaHanTask', t.thoiGianTao, t.nguoi, { ngayXin: $('#hgx').value, hanMoi: $('#hgm').value })
          : goiPhien('ghiHrQuen', { loai: 'Nhắc deadline', nguoiHr: t.hrPhuTrach, moTa: $('#hql').value, thamChieu: t.ten + ' (' + t.nguoi + ', hạn ' + hienNgay(t.hanChot) + ')' });
        $('#htb').disabled = true; thongBao($('#htm'), 'cho', 'Đang lưu…');
        p.then(function () { dongHop(true); VIEWS.task(); setTimeout(function () { thongBao($('#tam'), 'ok', 'Đã lưu'); }, 900); })
          .catch(function (err) { $('#htb').disabled = false; thongBao($('#htm'), 'loi', err.message); });
      };
      $('#htf').onsubmit = gui; $('#htb').onclick = gui;
    };

    var moForm = function (t) {
      var h = moHop({
        tieuDe: t ? 'Sửa task' : 'Tạo task', lop: 'rong',
        than: '<form class="form" id="tf">' + (t ? '' : '<p class="hint" style="margin:0">Chọn nhiều người thì mỗi người nhận một task riêng với cùng nội dung.</p>') +
          '<div class="grid2"><label class="f">Tên task<input type="text" id="tn" maxlength="200" value="' + esc(t ? t.ten : '') + '" placeholder="Ví dụ: Chốt địa điểm workshop"></label>' +
          '<label class="f">Hạn chót<input type="date" id="td" value="' + (t ? t.hanChot : congNgay(d.homNay, 7)) + '"></label></div>' +
          '<label class="f">Mô tả <small>Không bắt buộc</small><textarea id="tdesc" rows="3" maxlength="2000">' + esc(t ? t.moTa : '') + '</textarea></label>' +
          (t ? '<label class="f">Người phụ trách<select id="tw">' + d.thanhVien.map(function (m) { return '<option' + (m.ten === t.nguoi ? ' selected' : '') + '>' + esc(m.ten) + '</option>'; }).join('') + '</select></label>' : picker('tp', d.thanhVien)) +
          '<button hidden></button></form>',
        chan: '<span class="msg" id="tmsg"></span><button class="btn ghost" data-dong>Đóng</button><button class="btn" id="tb">' + (t ? 'Lưu thay đổi' : 'Tạo task') + '</button>'
      });
      if (window.innerWidth <= 860) h.querySelector('.dlg').classList.add('full');
      var layChon = t ? null : bindPicker('tp');
      var gui = function (e) {
        if (e) e.preventDefault();
        var nd = { ten: $('#tn').value, moTa: $('#tdesc').value, hanChot: $('#td').value };
        $('#tb').disabled = true; thongBao($('#tmsg'), 'cho', 'Đang lưu…');
        var p = t ? goiPhien('suaTask', t.thoiGianTao, t.nguoi, { ten: nd.ten, moTa: nd.moTa, hanChot: nd.hanChot, nguoi: $('#tw').value })
          : goiPhien('taoTask', { ten: nd.ten, moTa: nd.moTa, hanChot: nd.hanChot, nguoi: layChon() });
        p.then(function (n) {
          dongHop(true); VIEWS.task(); setTimeout(function () { thongBao($('#tam'), 'ok', t ? 'Đã lưu task' : 'Đã tạo ' + n + ' task'); }, 900);
        }).catch(function (err) { $('#tb').disabled = false; thongBao($('#tmsg'), 'loi', err.message); });
      };
      $('#tf').onsubmit = gui; $('#tb').onclick = gui;
      if (window.innerWidth > 860) $('#tn').focus();
    };

    if ($('#newt')) $('#newt').onclick = function () { moForm(null); };
    $('#tfil').onclick = function (e) { var b = e.target.closest('[data-f]'); if (!b) return; loc = b.getAttribute('data-f'); $$('#tfil button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); ve(); };
    $('#tq').oninput = function (e) { tim = e.target.value; ve(); };
    if ($('#tban')) $('#tban').onclick = function (e) { var b = e.target.closest('[data-b]'); if (!b) return; nhom = b.getAttribute('data-b'); $$('#tban button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); ve(); };
    ve();
  }).catch(loiTai);
};

/* ---------- Báo cáo ---------- */
var MAU_DUONG = ['#3f8a2a', '#1f6fb5', '#c0392b', '#b07a00', '#7d4bb5', '#0f8c8c', '#c2185b', '#6b7a62'];
function veBieuDo(bd, chiSo, khoa, chon) {
  var W = 760, H = 260, L = 40, R = 26, T = 12, B = 34;
  var n = bd.moc.length;
  var max = 0;
  chon.forEach(function (c) { bd.chuoi[c].forEach(function (s) { max = Math.max(max, s[khoa] || 0); }); });
  var tran = max <= 4 ? 4 : Math.ceil(max / 4) * 4;
  var x = function (i) { return n <= 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1); };
  var y = function (v) { return T + (H - T - B) * (1 - v / tran); };
  var luoi = '';

    $('#subbody').innerHTML = '<form class="card form" id="lc"><label class="f">Link Google Sheet mẫu <small>Bắt buộc. File đăng ký log được chép từ mẫu này. Dùng file mẫu của tool tạo file log cũ (có tab Đăng ký log, có thể có tab Kế hoạch): app điền giống hệt tool cũ. Mẫu khác cần một dòng tiêu đề có cột Họ và tên; các cột buổi được thêm ngay sau cột tiêu đề cuối cùng.</small><input type="url" id="lc-m" value="' + esc(CD.log.linkMau) + '" placeholder="https://docs.google.com/spreadsheets/d/…"></label>' +
      '<label class="f">Link thư mục Google Drive để lưu file <small>Bỏ trống thì lưu ở thư mục gốc Drive của tài khoản CLB</small><input type="url" id="lc-f" value="' + esc(CD.log.linkThuMuc) + '" placeholder="https://drive.google.com/drive/folders/…"></label>' +
      '<div class="row"><button class="btn sm" id="lc-b">Lưu</button><span id="m"></span></div></form>';
    $('#lc').onsubmit = function (e) { e.preventDefault(); luuVa($('#lc-b'), $('#m'), 'luuCaiDatLog', [{ linkMau: $('#lc-m').value, linkThuMuc: $('#lc-f').value }]); };
  },
  hr: function (vaiTro) {
    vaiTro = vaiTro === 'UCV' ? 'UCV' : 'HR';
    var hr = CD.taiKhoan.filter(function (t) { return t.vaiTro === vaiTro; });
    var daCo = {}; CD.taiKhoan.forEach(function (t) { if (t.vaiTro !== 'TV') daCo[t.email.toLowerCase()] = true; });
    var conLai = CD.thanhVien.filter(function (t) { return t.email && !daCo[t.email.toLowerCase()] && t.ban.trim().toUpperCase() !== 'BOD'; });
    // HR được phân quản lý một số ban: chỉ thấy, thao tác và được nhắc deadline task của các ban đó.
    var cacBan = [];
    CD.thanhVien.forEach(function (t) { var n = String(t.ban).trim().split(/\s+/)[0].toUpperCase(); if (n && n !== 'BOD' && n !== 'HR' && cacBan.indexOf(n) < 0) cacBan.push(n); });
    var chuaAi = vaiTro !== 'HR' ? [] : cacBan.filter(function (b) { return !hr.some(function (t) { return t.banQuanLy.indexOf(b) >= 0; }); });
    // Nhóm HR do BOD chọn: SUP-SEED điền báo cáo seeding, SUP-RES được miễn task ban, CRE lo bonding và sinh nhật.
    var NHOM = [['SUP-SEED', 'điền báo cáo seeding'], ['SUP-RES', 'miễn task ban'], ['CRE', 'bonding, sinh nhật']];
    var phanNhom = function (t, i) {
      return '<span class="hint">Nhóm:</span>' + NHOM.map(function (n) { return '<label class="row" style="gap:4px;font-size:13px" title="' + n[1] + '"><input type="checkbox" data-nh="' + i + '" value="' + n[0] + '"' + ((t.nhomHr || []).indexOf(n[0]) >= 0 ? ' checked' : '') + '>' + n[0] + '</label>'; }).join('');
    };
    var phanBan = function (t, i) {
      if (vaiTro !== 'HR') return '<div class="row" style="gap:10px;margin-top:6px;flex-wrap:wrap">' + phanNhom(t, i) + '<button class="btn ghost sm" data-luupb="' + i + '">Lưu</button><span id="pbm' + i + '"></span></div>';
      return '<div class="row" style="gap:10px;margin-top:6px;flex-wrap:wrap"><label class="row" style="gap:6px;font-size:13px"><span class="hint">Mã HR</span><input type="text" id="mhr' + i + '" value="' + esc(t.maHr || '') + '" maxlength="20" placeholder="VD: HR01" style="width:110px" aria-label="Mã HR của ' + esc(t.ten) + '"></label>' +
        phanNhom(t, i) + (cacBan.length ? '<span class="hint">COO ban:</span>' + cacBan.map(function (n) { return '<label class="row" style="gap:4px;font-size:13px"><input type="checkbox" data-pb="' + i + '" value="' + esc(n) + '"' + (t.banQuanLy.indexOf(n) >= 0 ? ' checked' : '') + '>' + esc(n) + '</label>'; }).join('') : '') +
        '<button class="btn ghost sm" data-luupb="' + i + '">Lưu</button><span id="pbm' + i + '"></span></div>';
    };
    $('#subbody').innerHTML = '<div class="note info">' + ic('info') + '<span>Nhóm: <b>SUP-SEED</b> điền báo cáo seeding để cộng điểm, <b>SUP-RES</b> được miễn task ban, <b>CRE</b> lo bonding và chúc mừng sinh nhật. Một người có thể ở nhiều nhóm.</span></div>' + (vaiTro === 'HR' ? '<div class="note info">' + ic('info') + '<span>COO ban nào thì thấy, nhập, sửa và được nhắc deadline task của thành viên ban đó; mọi COO cùng ban dùng chung. Chưa phân ban thì HR chỉ thấy task của mình. Danh sách ban lấy từ cột Ban của danh sách thành viên. Mỗi thành viên có một HR phụ trách nhắc deadline, chọn ở Cài đặt, HR phụ trách thành viên.</span></div>' : '') +
      (chuaAi.length ? '<p class="err">Ban ' + chuaAi.join(', ') + ' chưa có COO nên task của ban này chưa được ai nhắc.</p>' : '') +
      '<div class="card flush"><div style="padding:16px 18px 6px"><h3 style="margin:0">Đang có quyền</h3></div><div class="lst">' + (hr.length ? hr.map(function (t, i) { return '<div class="li" style="flex-wrap:wrap"><div class="c"><b class="t">' + esc(t.ten) + '</b><span class="s">' + esc(t.email) + '</span>' + phanBan(t, i) + '</div><button class="btn ghost sm" data-go="' + esc(t.email) + '">Gỡ quyền</button></div>'; }).join('') : rong('Chưa có ai.')) + '</div><div style="padding:0 18px 12px" id="m1"></div></div>' +
      '<form class="card form" id="hf"><h3 style="margin:0">Thêm người</h3><label class="f">Thành viên <small>Chỉ hiện người có email trong danh sách thành viên</small><select id="hn">' + conLai.map(function (t) { return '<option>' + esc(t.ten) + '</option>'; }).join('') + '</select></label><label class="f">Mật khẩu mới <small>Không bắt buộc. Bỏ trống thì người đó vẫn đăng nhập bằng mật khẩu đang dùng (hoặc mật khẩu chung của CLB, hoặc Google).</small><input type="text" id="hp" autocomplete="off"></label>' + (vaiTro === 'HR' ? '<label class="f">Mã HR <small>Không bắt buộc, ví dụ HR01. Sửa được sau.</small><input type="text" id="hm" maxlength="20" autocomplete="off"></label>' : '') + '<div class="row"><button class="btn sm" id="hb"' + (conLai.length ? '' : ' disabled') + '>' + (vaiTro === 'UCV' ? 'Thêm UCV' : 'Thêm vào HR') + '</button><span id="m2"></span></div></form>';
    $$('[data-go]').forEach(function (b) { b.onclick = function () { if (!xacNhan(b, 'Gỡ thật?')) return; luuVa(b, $('#m1'), 'goTaiKhoan', [b.getAttribute('data-go')], function () { SUB.hr(vaiTro); }); }; });
    $$('[data-luupb]').forEach(function (b) {
      b.onclick = function () {
        var i = b.getAttribute('data-luupb');
        var nhom = $$('[data-nh="' + i + '"]:checked').map(function (c) { return c.value; });
        if (vaiTro !== 'HR') { luuVa(b, $('#pbm' + i), 'luuNhomHr', [hr[Number(i)].email, nhom]); return; }
        var ds = $$('[data-pb="' + i + '"]:checked').map(function (c) { return c.value; });
        b.disabled = true; thongBao($('#pbm' + i), 'cho', 'Đang lưu…');
        goiPhien('luuBanQuanLy', hr[Number(i)].email, ds, $('#mhr' + i).value).then(function () {
          luuVa(b, $('#pbm' + i), 'luuNhomHr', [hr[Number(i)].email, nhom]);
        }).catch(function (err) { b.disabled = false; thongBao($('#pbm' + i), 'loi', err.message); });
      };
    });
    $('#hf').onsubmit = function (e) { e.preventDefault(); luuVa($('#hb'), $('#m2'), 'themBanNhanSu', [$('#hn').value, $('#hp').value, vaiTro, $('#hm') ? $('#hm').value : ''], function () { SUB.hr(vaiTro); thongBao($('#m2'), 'ok', 'Đã thêm'); }); };
  },
  ucv: function () { SUB.hr('UCV'); },
  phancong: function () {
    $('#subbody').innerHTML = '<div class="card">' + cho() + '</div>';
    goiPhien('layPhanCongHr').then(function (d) {
      if (sub !== 'phancong') return;
      var nhom = {};
      d.thanhVien.forEach(function (t) { (nhom[t.nhom] = nhom[t.nhom] || []).push(t); });
      $('#subbody').innerHTML = '<div class="note info">' + ic('info') + '<span>Mỗi thành viên có một HR COO phụ trách nhắc deadline. Mỗi task của thành viên đó có 2 lượt nhắc (tối trước hạn 1 ngày, sáng ngày hạn) tính cho HR phụ trách. Task đã giao giữ HR lúc giao; đổi phân công chỉ áp dụng cho task mới.</span></div>' +
        d.ban.map(function (b) {
          var hr = d.hr.filter(function (h) { return h.coo.indexOf(b) >= 0; });
          return '<div class="card"><div class="ctitle"><h3>Ban ' + esc(b) + '</h3><span class="hint">' + (hr.length ? 'COO: ' + esc(hr.map(function (h) { return h.ten; }).join(', ')) : 'Chưa có COO, phân ban ở Tài khoản HR') + '</span></div>' +
            (nhom[b] || []).map(function (t) {
              return '<div class="row sb" style="padding:6px 0;border-top:1px solid var(--line)"><span>' + esc(t.ten) + ' <span class="hint">' + esc(t.ban) + '</span></span><select data-pc="' + esc(t.ten) + '" style="max-width:220px" aria-label="HR phụ trách ' + esc(t.ten) + '"><option value="">Chưa phân</option>' +
                hr.concat(t.hr && !hr.some(function (h) { return h.ten === t.hr; }) ? [{ ten: t.hr }] : []).map(function (h) { return '<option' + (h.ten === t.hr ? ' selected' : '') + '>' + esc(h.ten) + '</option>'; }).join('') + '</select></div>';
            }).join('') + '</div>';
        }).join('') +
        '<div class="row"><button class="btn" id="pc-l">Lưu phân công</button><span id="pc-m"></span></div>';
      $('#pc-l').onclick = function () {
        var ds = $$('[data-pc]').map(function (o) { return { ten: o.getAttribute('data-pc'), hr: o.value }; });
        var b = this; b.disabled = true; thongBao($('#pc-m'), 'cho', 'Đang lưu…');
        goiPhien('luuPhanCongHr', ds).then(function (n) { b.disabled = false; thongBao($('#pc-m'), 'ok', 'Đã lưu ' + n + ' người'); })
          .catch(function (err) { b.disabled = false; thongBao($('#pc-m'), 'loi', err.message); });
      };
    }).catch(function (err) { $('#subbody').innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
  },
  google: function () {
    $('#subbody').innerHTML = '<form class="card form" id="gg"><p style="margin:0">Khi bật, ai có tài khoản app eco có thể bấm “Đăng nhập bằng Google” thay vì gõ mật khẩu, với điều kiện email Google trùng email tài khoản. Nút này hiện khi mở app eco qua trang ecotdn.github.io/home hoặc app đã cài.</p>' +
      '<label class="f">Google Client ID <small>Tạo một lần trên Google Cloud bằng tài khoản CLB (xem hướng dẫn bên dưới). Bỏ trống để tắt.</small><input type="text" id="gg-i" value="' + esc(CD.googleClientId) + '" placeholder="1234567890-abc….apps.googleusercontent.com"></label>' +
      '<div class="row"><button class="btn sm" id="gg-b">Lưu</button><span id="m"></span></div></form>' +
      '<details class="card"' + (CD.googleClientId ? '' : ' open') + '><summary style="cursor:pointer;font-weight:600">Hướng dẫn lấy Google Client ID (làm một lần)</summary><ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:6px">' +
      '<li>Trên máy tính, đăng nhập tài khoản Google của CLB, mở <b>console.cloud.google.com</b>. Lần đầu sẽ được hỏi đồng ý điều khoản, bấm đồng ý.</li>' +
      '<li>Ở góc trên bên trái bấm chọn dự án, bấm <b>New project</b>, đặt tên “eco”, bấm <b>Create</b>, rồi chọn dự án vừa tạo.</li>' +
      '<li>Mở menu, vào <b>APIs &amp; Services</b> rồi <b>OAuth consent screen</b> (có thể tên là Google Auth Platform). Bấm <b>Get started</b>, điền tên app “eco”, email hỗ trợ là email CLB, chọn <b>External</b>, điền email liên hệ, đồng ý rồi bấm <b>Create</b>.</li>' +
      '<li>Vào mục <b>Audience</b>, bấm <b>Publish app</b> để ai cũng đăng nhập được (chỉ xin email và tên nên Google không cần duyệt).</li>' +
      '<li>Vào mục <b>Clients</b> (hoặc Credentials), bấm <b>Create client</b>, chọn loại <b>Web application</b>, tên “eco”.</li>' +
      '<li>Ở <b>Authorized JavaScript origins</b>, bấm Add URI và dán đúng: <code>https://ecotdn.github.io</code>. Bấm <b>Create</b>.</li>' +
      '<li>Sao chép <b>Client ID</b> (đuôi .apps.googleusercontent.com), dán vào ô ở trên, bấm Lưu.</li></ol></details>';
    $('#gg').onsubmit = function (e) { e.preventDefault(); luuVa($('#gg-b'), $('#m'), 'luuGoogleClientId', [$('#gg-i').value]); };
  },
  sinhnhat: function () {
    $('#subbody').innerHTML = '<div class="card">' + cho() + '</div>';
    goiPhien('layLichSinhNhat').then(function (d) {
      if (sub !== 'sinhnhat') return;
      var tt = !d.nhiemKy ? '<p class="hint" style="margin:0">Chưa có nhiệm kỳ. Lịch được tạo khi tải danh sách “Sau tuyển đợt 1”.</p>'
        : d.loi ? '<p class="err" style="margin:0">' + esc(d.loi) + '</p>'
        : d.coLich ? '<p style="margin:0">Lịch <b>' + esc(d.ten) + '</b> đang có ' + d.soSuKien + ' sinh nhật của nhiệm kỳ ' + esc(d.nhiemKy) + '.</p>'
        : '<p style="margin:0">Chưa có lịch cho nhiệm kỳ ' + esc(d.nhiemKy) + '. Bấm Đồng bộ lại để tạo.</p>';
      $('#subbody').innerHTML = '<div class="card form">' + tt +
        '<p class="hint" style="margin:0">Mỗi lần tải danh sách (từ đợt 1 trở đi), app tự thêm sinh nhật người mới, sửa người đổi ngày sinh hoặc ban, bỏ người đã rời. Lịch nằm trong Google Calendar của tài khoản CLB, mỗi nhiệm kỳ một lịch riêng.</p>' +
        (d.nhiemKy ? '<div class="row"><button class="btn sm" id="sn-b">' + ic('refresh', 14) + 'Đồng bộ lại</button><span id="sn-m"></span></div>' : '') + '</div>' +
        '<details class="card" open><summary style="cursor:pointer;font-weight:600">Chia sẻ lịch cho nhóm CRE (làm một lần mỗi nhiệm kỳ)</summary><ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:6px">' +
        '<li>Trên máy tính, đăng nhập tài khoản Google của CLB, ' + (d.linkCaiDat ? '<a href="' + esc(d.linkCaiDat) + '" target="_blank" rel="noopener">mở cài đặt của lịch này</a>' : 'mở <b>calendar.google.com</b>, ở cột trái tìm lịch “' + esc(d.ten || 'Sinh nhật') + '”, bấm dấu ba chấm rồi <b>Cài đặt và chia sẻ</b>') + '.</li>' +
        '<li>Ở mục <b>Chia sẻ với những người cụ thể</b>, bấm <b>Thêm người</b>, nhập email của các bạn nhóm CRE, chọn quyền <b>Xem tất cả chi tiết sự kiện</b>, bấm <b>Gửi</b>.</li>' +
        '<li>Các bạn CRE mở mail mời, bấm thêm lịch, rồi trong Google Calendar trên điện thoại đặt thông báo cho sự kiện cả ngày (gợi ý: trước 1 ngày lúc 20:00).</li></ol></details>';
      if ($('#sn-b')) $('#sn-b').onclick = function () {
        var b = this; b.disabled = true; thongBao($('#sn-m'), 'cho', 'Đang đồng bộ, có thể mất một hai phút…');
        goiPhien('dongBoSinhNhatNgay').then(function (k) {
          b.disabled = false;
          thongBao($('#sn-m'), 'ok', 'Đã thêm ' + k.soTao + ', bỏ ' + k.soXoa + ', giữ ' + k.soGiu + '.' + (k.conLai ? ' Còn ' + k.conLai + ' người, bấm lại lần nữa.' : '') + (k.thieuNgay.length ? ' ' + k.thieuNgay.length + ' người chưa có ngày sinh hợp lệ.' : ''));
        }).catch(function (err) { b.disabled = false; thongBao($('#sn-m'), 'loi', err.message); });
      };
    }).catch(function (err) { $('#subbody').innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
  },
  accounts: function () {
    $('#subbody').innerHTML = '<div class="setsearch">' + ic('search', 16) + '<input type="search" id="tk-q" placeholder="Tìm theo tên hoặc email" aria-label="Tìm tài khoản"></div>' +
      '<div class="card flush"><div class="lst" id="tk-ds"></div><div style="padding:0 18px 12px" id="m"></div></div>';
    var ve = function (q) {
      q = boDau(q || '');
      $('#tk-ds').innerHTML = CD.taiKhoan.map(function (t, i) {
        if (q && boDau(t.ten + ' ' + t.email).indexOf(q) < 0) return '';
        return '<div class="li" style="flex-wrap:wrap"><div class="c" style="min-width:180px"><b class="t">' + esc(t.ten) + '</b><span class="s">' + esc(VAI_TRO[t.vaiTro] || t.vaiTro) + ' · ' + esc(t.email) + '</span></div><div class="row" style="flex-wrap:nowrap"><input type="text" id="np' + i + '" placeholder="Mật khẩu mới" aria-label="Mật khẩu mới cho ' + esc(t.ten) + '" style="max-width:170px"><button class="btn ghost sm" data-rs="' + i + '">Đặt lại</button></div></div>';
      }).join('') || rong('Không tìm thấy ai.');
      $$('[data-rs]').forEach(function (b) {
        b.onclick = function () { var i = b.getAttribute('data-rs'); var t = CD.taiKhoan[i]; luuVa(b, $('#m'), 'datLaiMatKhau', [t.email, $('#np' + i).value], function () { $('#np' + i).value = ''; thongBao($('#m'), 'ok', 'Đã đặt lại mật khẩu cho ' + t.ten); }); };
      });
    };
    ve(); $('#tk-q').oninput = function (e) { ve(e.target.value); };
  }
};
</script>
