<style>
/* =================== Dùng chung cho app CLB ECO: màn chờ lá bay, buổi trong ngày =================== */
.nap{display:grid;justify-items:center;gap:8px;padding:26px 12px;text-align:center}
.gio{position:relative;width:150px;height:64px;overflow:hidden}
.gio .la{position:absolute;left:0;width:18px;height:18px;opacity:0;animation:la-bay 2.4s cubic-bezier(.45,.05,.55,.95) infinite}
.gio .la svg{width:100%;height:100%;display:block}
.gio .la:nth-child(1){top:22px;animation-delay:-.2s}
.gio .la:nth-child(2){top:8px;width:14px;height:14px;animation-name:la-bay2;animation-delay:-.7s;animation-duration:2.1s}
.gio .la:nth-child(3){top:36px;width:16px;height:16px;animation-delay:-1.3s;animation-duration:2.6s}
.gio .la:nth-child(4){top:16px;width:12px;height:12px;animation-name:la-bay2;animation-delay:-1.75s}
.gio .la:nth-child(5){top:30px;animation-delay:-2.1s;animation-duration:2.2s}
.gio .vet{position:absolute;left:0;height:2px;border-radius:2px;background:currentColor;opacity:0;animation:gio-thoi 1.4s ease-in infinite}
.gio .vet:nth-of-type(1){top:14px;width:42px;animation-delay:.2s}
.gio .vet:nth-of-type(2){top:34px;width:60px;animation-delay:.7s}
.gio .vet:nth-of-type(3){top:52px;width:34px;animation-delay:1.1s}
.nap{color:var(--muted)}
.nap-chu{font-size:14px;color:var(--muted);transition:opacity .25s,transform .25s;max-width:30ch}
.nap-chu.mo{opacity:0;transform:translateY(4px)}
.nap.lon{color:var(--ink-3)}
.nap.lon .gio{transform:scale(1.7);margin:26px 0 30px}
.nap.lon .nap-chu{color:var(--ink-2);font-size:15px}
@keyframes la-bay{0%{transform:translate(-24px,0) rotate(0);opacity:0}12%{opacity:1}35%{transform:translate(40px,-12px) rotate(140deg)}60%{transform:translate(85px,9px) rotate(250deg)}85%{transform:translate(130px,-6px) rotate(360deg);opacity:1}100%{transform:translate(160px,2px) rotate(420deg);opacity:0}}
@keyframes la-bay2{0%{transform:translate(-24px,6px) rotate(40deg) scaleX(1);opacity:0}15%{opacity:1}40%{transform:translate(45px,14px) rotate(-60deg) scaleX(-1)}70%{transform:translate(100px,-4px) rotate(-170deg) scaleX(1)}100%{transform:translate(165px,10px) rotate(-260deg) scaleX(-1);opacity:0}}
@keyframes gio-thoi{0%{transform:translateX(-60px) scaleX(.3);opacity:0}30%{opacity:.5}100%{transform:translateX(200px) scaleX(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.gio .la,.gio .vet{animation-duration:6s}}

</style>
<script>
/* ---------- Màn chờ: lá bị gió thổi bay ---------- */
var CAU_CHO = [
  'Gió đang thổi dữ liệu về, bạn chờ xíu…',
  'Đang tưới cây cho dữ liệu nảy mầm…',
  'Đang phân loại rác… à nhầm, phân loại dữ liệu…',
  'Ốc sên chở dữ liệu đang chạy hết tốc lực…',
  'Đang gọi Google dậy làm việc…',
  'Dữ liệu đang đạp xe về, không xả khói…',
  'Lá bay hết rồi, đang đi nhặt lại…',
  'Dữ liệu đang tắm nắng, sắp xong rồi…',
  'Đang nhặt rác trên đường truyền…',
  'Gió hơi to, lá bay lung tung…',
  'Tranh thủ uống ngụm nước đi bạn ơi…'
];
function cauCho() { return CAU_CHO[Math.floor(Math.random() * CAU_CHO.length)]; }
var MAU_LA = ['#5f9e35', '#8cc152', '#3f7d1f', '#a7d36b', '#6aa83a'];
function cho(lon) {
  var la = MAU_LA.map(function (m) { return '<span class="la"><svg viewBox="0 0 24 24"><path fill="' + m + '" d="M12 22C6 19 4 13 7 5c6 1 11 5 11 11 0 3-2 5-6 6z"/><path d="M12 22c-1-6-2-10-5-15" stroke="#1d3a0e" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".55"/></svg></span>'; }).join('');
  return '<div class="nap' + (lon ? ' lon' : '') + '" role="status"><div class="gio" aria-hidden="true">' + la + '<i class="vet"></i><i class="vet"></i><i class="vet"></i></div><span class="nap-chu" data-doi>' + cauCho() + '</span></div>';
}
setInterval(function () {
  Array.prototype.forEach.call(document.querySelectorAll('.nap-chu[data-doi]'), function (s) {
    s.classList.add('mo');
    setTimeout(function () { s.textContent = cauCho(); s.classList.remove('mo'); }, 250);
  });
}, 2600);

/* ---------- Buổi trong ngày (lời chào trên trang chủ) ---------- */
function buoiTrongNgay() {
  var h = new Date().getHours();
  if (h >= 5 && h < 11) return { ten: 'buổi sáng', lop: 'sang' };
  if (h >= 11 && h < 14) return { ten: 'buổi trưa', lop: 'trua' };
  if (h >= 14 && h < 18) return { ten: 'buổi chiều', lop: 'chieu' };
  if (h >= 18 && h < 22) return { ten: 'buổi tối', lop: 'toi' };
  return { ten: 'đêm khuya', lop: 'khuya' };
}
</script>
