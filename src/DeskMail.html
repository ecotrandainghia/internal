<script>
/* =================== Mail: khung soạn thư, mail của UCV, mail của BOD =================== */

/* ---------- Lọc HTML an toàn (thư dán vào, chữ ký) ---------- */
function locHtml(raw) {
  var doc = new DOMParser().parseFromString(String(raw || ''), 'text/html');
  $$('script,style,noscript,iframe,frame,frameset,object,embed,applet,form,input,button,textarea,select,option,meta,base,link,title', doc).forEach(function (n) { n.remove(); });
  $$('*', doc.body).forEach(function (el) {
    Array.prototype.slice.call(el.attributes).forEach(function (a) {
      var n = a.name.toLowerCase();
      if (n.indexOf('on') === 0) { el.removeAttribute(a.name); return; }
      if (['href', 'src', 'background', 'srcset', 'xlink:href'].indexOf(n) >= 0) {
        var v = a.value.replace(/[\u0000- ]/g, '').toLowerCase();
        if (v.indexOf('javascript:') === 0 || v.indexOf('vbscript:') === 0 || (v.indexOf('data:') === 0 && !(n === 'src' && v.indexOf('data:image/') === 0))) el.removeAttribute(a.name);
      }
    });
  });
  return doc.body.innerHTML;
}
function htmlRong(html) {
  var d = document.createElement('div'); d.innerHTML = html || '';
  return !d.textContent.trim() && !d.querySelector('img');
}
function chuSangHtmlKhach(chu) { return esc(chu).replace(/\r?\n/g, '<br>'); }

/** Hiện nội dung thư HTML trong khung riêng, không chạy được mã và không ảnh hưởng giao diện app. */
function khungThu(html) {
  var doc = '<base target="_blank"><style>body{font-family:Arial,sans-serif;font-size:14px;line-height:1.5;margin:12px;word-break:break-word;color:#1b2416;background:#fff}img{max-width:100%;height:auto}blockquote{margin:0 0 0 .8ex;border-left:2px solid #ccc;padding-left:1ex;color:#555}table{max-width:100%}</style>' + html;
  return '<iframe class="mbody" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="' + esc(doc) + '" onload="try{this.style.height=(this.contentDocument.documentElement.scrollHeight+4)+\'px\'}catch(e){}"></iframe>';
}
function kichThuoc(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

/* ---------- Thanh công cụ định dạng (dùng cho khung soạn thư và chữ ký) ---------- */
var CONG_CU = [['undo', 'undo', 'Hoàn tác'], ['redo', 'redo', 'Làm lại'], '|', ['font'], ['size'], '|',
  ['bold', '<b>B</b>', 'Đậm (Ctrl+B)', 1], ['italic', '<i>I</i>', 'Nghiêng (Ctrl+I)', 1], ['underline', '<u>U</u>', 'Gạch chân (Ctrl+U)', 1], ['mau'], '|',
  ['justifyLeft', 'alL', 'Căn trái'], ['justifyCenter', 'alC', 'Căn giữa'], '|',
  ['insertOrderedList', 'ol', 'Danh sách đánh số', 1], ['insertUnorderedList', 'ul', 'Danh sách dấu chấm', 1], ['outdent', 'outdent', 'Giảm thụt lề'], ['indent', 'indent', 'Tăng thụt lề'], '|',
  ['blockquote', 'quote', 'Trích dẫn'], ['link', 'link', 'Chèn liên kết (Ctrl+K)'], ['removeFormat', 'clear', 'Xoá định dạng']];
function thanhCongCu(id) {
  return '<div class="tbar" id="' + id + '">' + CONG_CU.map(function (t) {
    if (t === '|') return '<span class="tb-sep"></span>';
    if (t[0] === 'font') return '<select class="tb-sel" data-sel="fontName" title="Phông chữ" aria-label="Phông chữ"><option value="Arial, sans-serif">Sans Serif</option><option value="Georgia, serif">Serif</option><option value="Tahoma, Verdana, sans-serif">Tahoma</option><option value="\'Courier New\', monospace">Monospace</option></select>';
    if (t[0] === 'size') return '<select class="tb-sel" data-sel="fontSize" title="Cỡ chữ" aria-label="Cỡ chữ"><option value="2">Nhỏ</option><option value="3" selected>Bình thường</option><option value="5">Lớn</option><option value="6">Rất lớn</option></select>';
    if (t[0] === 'mau') return '<label class="tb tb-color" title="Màu chữ"><span style="font-weight:500;border-bottom:3px solid #c0392b;line-height:1">A</span><input type="color" value="#c0392b" data-mau aria-label="Màu chữ"></label>';
    return '<button type="button" class="tb" data-cmd="' + t[0] + '"' + (t[3] ? ' data-st="1"' : '') + ' title="' + t[2] + '" aria-label="' + t[2] + '">' + (I[t[1]] ? ic(t[1], 17) : t[1]) + '</button>';
  }).join('') + '</div><div class="linkpop" hidden data-lp><input type="text" placeholder="Chữ hiển thị" data-lt><input type="text" placeholder="Địa chỉ link (https://…)" data-lu><button type="button" class="btn sm" data-lok>Chèn</button><button type="button" class="btn ghost sm" data-lx>Huỷ</button></div>';
}
function ganCongCu(id, ed, khiDoi) {
  var bar = $('#' + id), lp = bar.nextElementSibling, vung = null;
  khiDoi = khiDoi || function () {};
  var giuVung = function () { var s = getSelection(); if (s.rangeCount && ed.contains(s.getRangeAt(0).commonAncestorContainer)) vung = s.getRangeAt(0).cloneRange(); };
  var traVung = function () { ed.focus(); if (vung) { var s = getSelection(); s.removeAllRanges(); s.addRange(vung); } };
  var lam = function (cmd, gt) {
    if (document.activeElement !== ed) traVung();
    try { document.execCommand('styleWithCSS', false, cmd === 'foreColor'); } catch (e) {}
    document.execCommand(cmd, false, gt);
    khiDoi(); trangThai();
  };
  var gan = function (tag) { var s = getSelection(); if (!s.rangeCount) return null; var n = s.getRangeAt(0).startContainer; while (n && n !== ed) { if (n.nodeType === 1 && n.tagName.toLowerCase() === tag) return n; n = n.parentNode; } return null; };
  var trangThai = function () {
    var s = getSelection(); if (!s.rangeCount || !ed.contains(s.getRangeAt(0).commonAncestorContainer)) return;
    $$('[data-st]', bar).forEach(function (b) { var on = false; try { on = document.queryCommandState(b.getAttribute('data-cmd')); } catch (e) {} b.classList.toggle('on', on); });
  };
  var moLink = function () {
    giuVung();
    var a = gan('a');
    lp.querySelector('[data-lt]').value = a ? a.textContent : (vung ? vung.toString() : '');
    lp.querySelector('[data-lu]').value = a ? a.getAttribute('href') : '';
    lp.hidden = false; lp.querySelector('[data-lu]').focus();
  };
  var chenLink = function () {
    var url = lp.querySelector('[data-lu]').value.trim(), chu = lp.querySelector('[data-lt]').value.trim();
    lp.hidden = true;
    if (!url) return;
    if (!/^(https?:|mailto:|tel:)/i.test(url)) url = (url.indexOf('@') > 0 && url.indexOf('/') < 0 ? 'mailto:' : 'https://') + url;
    traVung();
    var a = gan('a');
    if (a) { a.setAttribute('href', url); if (chu) a.textContent = chu; }
    else if (vung && !vung.collapsed && (!chu || chu === vung.toString())) document.execCommand('createLink', false, url);
    else document.execCommand('insertHTML', false, '<a href="' + esc(url) + '">' + esc(chu || url) + '</a>&nbsp;');
    khiDoi();
  };
  bar.addEventListener('mousedown', function (e) { if (e.target.closest('button.tb')) e.preventDefault(); });
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cmd]'); if (!b) return;
    var c = b.getAttribute('data-cmd');
    if (c === 'link') { moLink(); return; }
    if (c === 'blockquote') { lam('formatBlock', gan('blockquote') ? 'div' : 'blockquote'); return; }
    lam(c);
  });
  $$('[data-sel]', bar).forEach(function (s) { s.addEventListener('mousedown', giuVung); s.addEventListener('focus', giuVung); s.onchange = function () { lam(s.getAttribute('data-sel'), s.value); }; });
  var m = bar.querySelector('[data-mau]');
  m.addEventListener('mousedown', giuVung); m.addEventListener('click', giuVung);
  m.onchange = function () { m.previousElementSibling.style.borderBottomColor = m.value; traVung(); lam('foreColor', m.value); };
  lp.querySelector('[data-lok]').onclick = chenLink;
  lp.querySelector('[data-lx]').onclick = function () { lp.hidden = true; };
  lp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); chenLink(); } if (e.key === 'Escape') { e.stopPropagation(); lp.hidden = true; } });
  ed.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); moLink(); } });
  ed.addEventListener('input', khiDoi);
  ed.addEventListener('keyup', trangThai); ed.addEventListener('mouseup', trangThai);
  ed.addEventListener('paste', function (e) {
    var dl = e.clipboardData; if (!dl) return;
    if (dl.files && dl.files.length && ed.khiDanTep) { e.preventDefault(); ed.khiDanTep(dl.files); return; }
    var h = dl.getData('text/html');
    if (h) { e.preventDefault(); document.execCommand('insertHTML', false, locHtml(h).replace(/<img[^>]+src="data:[^"]*"[^>]*>/gi, '')); khiDoi(); }
  });
}

VIEWS.mail = function () { if (NGUOI.vaiTro === 'BOD') mailBOD(); else mailUCV(); };
var TT_VIEC = { 'Nháp': 'p-mute', 'Chờ duyệt': 'p-warn', 'Đã duyệt': 'p-ok', 'Cần sửa lại': 'p-bad', 'Từ chối': 'p-mute', 'Lỗi khi thực hiện': 'p-bad' };
function veLuong(l, coTai) {
  return '<h3>' + esc(l.tieuDe) + '</h3><div class="row">' + l.nhan.map(function (n) { return '<span class="pill p-info">' + esc(n) + '</span>'; }).join('') + (l.trongThungRac ? '<span class="pill p-mute">Thùng rác</span>' : '') + (l.laThuRac ? '<span class="pill p-bad">Thư rác</span>' : '') + '</div>' +
    l.thu.map(function (m) {
      return '<div class="mmsg"><div class="row sb"><b style="font-size:13.5px">' + esc(m.tu) + '</b><span class="hint">' + ngayDayDu(m.ngay) + '</span></div><div class="hint">Tới: ' + esc(m.den) + (m.cc ? ' · Cc: ' + esc(m.cc) : '') + '</div>' + khungThu(m.html) +
        (m.dinhKem.length ? '<div class="row">' + m.dinhKem.map(function (a, i) { return coTai ? '<button class="btn ghost sm" data-tai="' + esc(m.ma) + '" data-i="' + i + '">' + ic('attach', 14) + esc(a.ten) + ' · ' + kichThuoc(a.kichThuoc) + '</button>' : '<span class="pill p-mute">' + esc(a.ten) + '</span>'; }).join('') + '</div>' : '') + '</div>';
    }).join('');
}
function ganTaiDinhKem(maThu, msg) {
  $$('[data-tai]').forEach(function (b) {
    b.onclick = function () {
      b.disabled = true;
      goiPhien('taiDinhKem', maThu, b.getAttribute('data-tai'), Number(b.getAttribute('data-i'))).then(function (f) { b.disabled = false; taiTep(f); })
        .catch(function (err) { b.disabled = false; thongBao(msg(), 'loi', err.message); });
    };
  });
}

/* =================== Mail của UCV: hộp thư CLB kiểu Gmail, mọi thao tác chờ BOD duyệt =================== */
var CAU_HINH_SOAN = null;
function mailUCV() {
  var M = { thuMuc: 'Hộp thư đến', tim: '', batDau: 0, ds: [], coThem: false, nhan: [], cheDo: 'tatca', sel: null, viec: [] };
  var THU_MUC = [['Hộp thư đến', 'inbox'], ['Đã gửi', 'send'], ['Lưu trữ', 'archive'], ['Thư rác', 'info'], ['Thùng rác', 'trash']];
  $('#main').className = 'main rong';
  $('#main').innerHTML = '<div class="head"><div><h2>Hộp thư</h2><p class="lead">Hộp thư của CLB. Đọc thư thoải mái; còn gửi, trả lời, chuyển tiếp, lưu trữ, gắn nhãn, xoá… sẽ chờ BOD duyệt rồi mới thực hiện.</p></div></div>' +
    '<div class="mail" id="mail"><div class="folders" id="mf"></div><div class="mlist" id="ml"></div><div class="mread" id="mr"></div></div>' +
    '<button class="btn fab" id="fab">' + ic('edit', 18) + 'Soạn thư</button>';
  var msg = function () { return $('#mrm'); };
  $('#fab').onclick = function () { soanThu({ thaoTac: 'Soạn thư mới' }); };
  var veThuMuc = function () {
    var soSua = M.viec.filter(function (v) { return v.trangThai === 'Cần sửa lại' || v.trangThai === 'Lỗi khi thực hiện'; }).length;
    var muc = M.cheDo === 'rieng' ? [['Thư của tôi', 'mail']] : THU_MUC.concat(M.nhan.map(function (n) { return [n, 'tag']; }));
    $('#mf').innerHTML = '<button class="btn soan" data-soan>' + ic('edit', 18) + 'Soạn thư</button>' +
      '<button class="fd" data-mf="Việc của tôi"' + (M.thuMuc === 'Việc của tôi' ? ' aria-current="page"' : '') + '>' + ic('check', 17) + '<span class="t">Thư chờ duyệt của tôi</span>' + (soSua ? '<span class="badge">' + soSua + '</span>' : '') + '</button>' +
      muc.map(function (x) { return '<button class="fd" data-mf="' + esc(x[0]) + '"' + (x[0] === M.thuMuc ? ' aria-current="page"' : '') + '>' + ic(x[1], 17) + '<span class="t">' + esc(x[0]) + '</span></button>'; }).join('');
    $('#mf').querySelector('[data-soan]').onclick = function () { soanThu({ thaoTac: 'Soạn thư mới' }); };
    $$('[data-mf]', $('#mf')).forEach(function (b) {
      b.onclick = function () { M.thuMuc = b.getAttribute('data-mf'); M.batDau = 0; M.tim = ''; M.sel = null; moDoc(false); veThuMuc(); taiDs(); $('#mr').innerHTML = rong(ic('mail') + 'Chọn một thư để đọc.'); };
    });
  };
  var moDoc = function (co) { $('#mail').classList.toggle('doc', co); if (co && innerWidth <= 860) window.scrollTo(0, 0); };
  var nutVe = '<button class="back chimobile" data-ve>' + ic('left', 16) + 'Danh sách</button>';
  var ganVe = function () { var b = $('#mr').querySelector('[data-ve]'); if (b) b.onclick = function () { moDoc(false); }; };

  var taiDs = function (them) {
    if (M.thuMuc === 'Việc của tôi') { veViec(); return; }
    if (!them) $('#ml').innerHTML = cho();
    goiPhien('layHopThu', M.thuMuc, M.tim, M.batDau).then(function (d) {
      M.cheDo = d.cheDo; M.nhan = d.nhan; M.coThem = d.coThem;
      if (d.cheDo === 'rieng' && M.thuMuc !== 'Thư của tôi') { M.thuMuc = 'Thư của tôi'; }
      M.ds = them ? M.ds.concat(d.ds) : d.ds;
      veThuMuc(); veDs();
    }).catch(function (err) { $('#ml').innerHTML = '<p class="err" style="padding:14px">' + esc(err.message) + '</p>'; });
  };
  var veDs = function () {
    $('#ml').innerHTML = '<div class="msearch"><input type="search" id="mq" value="' + esc(M.tim) + '" placeholder="Tìm thư (Enter)" aria-label="Tìm thư"></div>' +
      (M.ds.length ? M.ds.map(function (t) {
        return '<button class="mi' + (t.chuaDoc ? ' moi' : '') + '" data-mi="' + esc(t.ma) + '"' + (t.ma === M.sel ? ' aria-current="true"' : '') + '><div class="t1"><b>' + esc(t.tu.replace(/<.*>/, '').replace(/"/g, '').trim() || t.tu) + (t.soThu > 1 ? ' <span class="hint">' + t.soThu + '</span>' : '') + '</b><span class="d">' + ngayNgan(t.ngay) + '</span></div><span class="s tde">' + esc(t.tieuDe) + '</span><span class="s hint">' + esc(t.doan) + '</span></button>';
      }).join('') : rong(ic('inbox') + 'Không có thư nào.')) +
      (M.coThem ? '<div style="padding:10px"><button class="btn ghost sm" id="mmore">Xem thêm</button></div>' : '');
    var q = $('#mq'), hen = null;
    q.onkeydown = function (e) { if (e.key === 'Enter') { M.tim = q.value.trim(); M.batDau = 0; taiDs(); } };
    q.oninput = function () { clearTimeout(hen); if (M.cheDo === 'rieng' || !q.value) hen = setTimeout(function () { M.tim = q.value.trim(); taiDs(); }, 350); };
    if ($('#mmore')) $('#mmore').onclick = function () { M.batDau += 30; taiDs(true); };
    $$('[data-mi]', $('#ml')).forEach(function (b) {
      b.onclick = function () { M.sel = b.getAttribute('data-mi'); b.classList.remove('moi'); $$('.mi', $('#ml')).forEach(function (x) { x.setAttribute('aria-current', x === b); }); docLuong(M.sel); };
    });
  };
  var docLuong = function (ma) {
    moDoc(true);
    $('#mr').innerHTML = nutVe + cho(); ganVe();
    goiPhien('docLuongThu', ma).then(function (l) {
      if (M.sel !== ma) return;
      var T = function (k, nhan, icon, chinh) { return '<button class="btn ' + (chinh ? '' : 'ghost ') + 'sm" data-tt="' + k + '">' + ic(icon, 15) + nhan + '</button>'; };
      $('#mr').innerHTML = nutVe + veLuong(l, true) +
        '<div class="mact">' + T('Trả lời', 'Trả lời', 'reply', 1) + T('Trả lời tất cả', 'Trả lời tất cả', 'reply') + T('Chuyển tiếp', 'Chuyển tiếp', 'fwd') + '</div>' +
        '<div class="row">' + (l.trongHopThu ? T('Lưu trữ', 'Lưu trữ', 'archive') : T('Chuyển về hộp thư đến', 'Về hộp thư đến', 'inbox')) + T('Gắn nhãn', 'Gắn nhãn', 'tag') + (l.nhan.length ? T('Bỏ nhãn', 'Bỏ nhãn', 'tag') : '') +
        (l.trongThungRac ? '' : T('Chuyển vào thùng rác', 'Xoá', 'trash')) + (l.laThuRac ? '' : T('Báo cáo thư rác', 'Thư rác', 'info')) + '</div><div id="mx"></div><p class="hint" style="margin:0">Mỗi thao tác được gửi BOD duyệt trước khi thực hiện.</p><span id="mrm"></span>';
      ganVe(); ganTaiDinhKem(ma, msg);
      $$('[data-tt]', $('#mr')).forEach(function (b) {
        b.onclick = function () {
          var tt = b.getAttribute('data-tt');
          if (tt === 'Trả lời' || tt === 'Trả lời tất cả' || tt === 'Chuyển tiếp') {
            var cuoi = l.thu[l.thu.length - 1];
            soanThu({ thaoTac: tt, maThu: ma, tieuDeThu: l.tieuDe, tieuDe: tt === 'Chuyển tiếp' ? 'Fwd: ' + l.tieuDe : '', goc: cuoi });
            return;
          }
          var nhanHtml = tt === 'Gắn nhãn' ? '<input type="text" id="mxn" list="mxl" placeholder="Tên nhãn, có sẵn hoặc mới"><datalist id="mxl">' + M.nhan.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>'
            : tt === 'Bỏ nhãn' ? '<select id="mxn">' + l.nhan.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' : '';
          $('#mx').innerHTML = '<div class="box"><b>' + esc(tt) + '</b>' + nhanHtml + '<div class="row"><button class="btn sm" id="mxg">Gửi BOD duyệt</button><button class="btn ghost sm" id="mxh">Thôi</button></div></div>';
          $('#mxh').onclick = function () { $('#mx').innerHTML = ''; };
          $('#mxg').onclick = function () {
            $('#mxg').disabled = true;
            goiPhien('luuViecMail', { thaoTac: tt, maThu: ma, nhan: $('#mxn') ? $('#mxn').value : '' }, true, null).then(function () {
              $('#mx').innerHTML = ''; thongBao(msg(), 'ok', 'Đã gửi BOD duyệt: ' + tt); napViec();
            }).catch(function (err) { $('#mxg').disabled = false; thongBao(msg(), 'loi', err.message); });
          };
        };
      });
    }).catch(function (err) { $('#mr').innerHTML = nutVe + '<p class="err">' + esc(err.message) + '</p>'; ganVe(); });
  };

  /* Thư chờ duyệt của tôi */
  var napViec = function () { return goiPhien('layViecCuaToi').then(function (ds) { M.viec = ds; veThuMuc(); if (M.thuMuc === 'Việc của tôi') veViec(); }).catch(function () {}); };
  var veViec = function () {
    $('#ml').innerHTML = M.viec.length ? M.viec.map(function (v, i) {
      return '<button class="mi" data-vi="' + i + '"><div class="t1"><b>' + esc(v.tieuDe || v.tieuDeThu || v.thaoTac) + '</b><span class="d">' + ngayNgan(v.thoiGian) + '</span></div><span class="s hint">' + esc(v.thaoTac) + (v.den ? ' · ' + esc(v.den) : '') + '</span><span class="pill ' + (TT_VIEC[v.trangThai] || 'p-mute') + '" style="margin-top:4px">' + esc(v.trangThai) + '</span></button>';
    }).join('') : rong(ic('check') + 'Bạn chưa có thư hay việc nào gửi BOD.');
    $$('[data-vi]', $('#ml')).forEach(function (b) {
      b.onclick = function () {
        $$('.mi', $('#ml')).forEach(function (x) { x.setAttribute('aria-current', x === b); });
        var v = M.viec[Number(b.getAttribute('data-vi'))];
        var sua = v.trangThai === 'Nháp' || v.trangThai === 'Cần sửa lại';
        var xoa = sua || v.trangThai === 'Từ chối';
        moDoc(true);
        $('#mr').innerHTML = nutVe + '<h3>' + esc(v.tieuDe || (v.thaoTac + (v.tieuDeThu ? ': ' + v.tieuDeThu : ''))) + '</h3><div class="row"><span class="pill ' + (TT_VIEC[v.trangThai] || 'p-mute') + '">' + esc(v.trangThai) + '</span><span class="hint">' + esc(v.thaoTac) + ' · ' + ngayDayDu(v.thoiGian) + (v.nguoiDuyet ? ' · ' + esc(v.nguoiDuyet) + ' xử lý lúc ' + ngayDayDu(v.thoiGianDuyet) : '') + '</span></div>' +
          (v.ghiChu ? '<div class="note info">' + ic('chat') + '<div><b>Ghi chú của BOD</b><div style="white-space:pre-wrap">' + esc(v.ghiChu) + '</div></div></div>' : '') +
          (v.den ? '<div class="hint">Tới: ' + esc(v.den) + (v.cc ? ' · Cc: ' + esc(v.cc) : '') + (v.bcc ? ' · Bcc: ' + esc(v.bcc) : '') + '</div>' : (v.tieuDeThu ? '<div class="hint">Thư: ' + esc(v.tieuDeThu) + '</div>' : '')) +
          (v.nhan ? '<div class="hint">Nhãn: ' + esc(v.nhan) + '</div>' : '') +

    ganCongCu('c-tb', ed, doi);

    /* Người nhận dạng thẻ, gợi ý từ danh bạ */
    var R = {};
    var EMAIL = /^[^\s@<>(),;:"]+@[^\s@<>(),;:"]+\.[^\s@<>(),;:"]+$/;
    var veThe = function (k) {
      var r = R[k];
      $$('.rchip', r.box).forEach(function (n) { n.remove(); });
      r.ds.forEach(function (e, i) {
        var c = document.createElement('span');
        c.className = 'rchip' + (EMAIL.test(e) ? '' : ' sai'); c.title = EMAIL.test(e) ? e : 'Email chưa đúng';
        c.innerHTML = esc(e) + '<button type="button" aria-label="Bỏ ' + esc(e) + '">' + ic('x', 13) + '</button>';
        c.querySelector('button').onclick = function (ev) { ev.stopPropagation(); r.ds.splice(i, 1); veThe(k); doi(); };
        r.box.insertBefore(c, r.inp);
      });
    };
    var them = function (k, chu) {
      String(chu || '').split(/[,;\n]+/).map(function (x) { var m = /<([^>]+)>/.exec(x); return (m ? m[1] : x).replace(/^mailto:/i, '').trim(); }).filter(Boolean).forEach(function (e) {
        if (!R[k].ds.some(function (x) { return x.toLowerCase() === e.toLowerCase(); })) R[k].ds.push(e);
      });
      veThe(k); doi();
    };
    var chot = function (k) { var r = R[k]; if (r && r.inp.value.trim()) { var t = r.inp.value; r.inp.value = ''; them(k, t); } dongGoiY(); };
    var goiY = null;
    var dongGoiY = function () { if (goiY) { goiY.remove(); goiY = null; } };
    var hienGoiY = function (k) {
      dongGoiY();
      var q = boDau(R[k].inp.value.trim());
      if (q.length < 2) return;
      var kq = C.danhBa.filter(function (d) { return boDau(d.ten + ' ' + d.email).indexOf(q) >= 0; }).slice(0, 8);
      if (!kq.length) return;

      goiY.innerHTML = kq.map(function (d, i) { return '<button type="button" data-e="' + esc(d.email) + '"' + (i === 0 ? ' class="on"' : '') + '><b>' + esc(d.ten) + '</b> <span class="hint">' + esc(d.email) + ' · ' + esc(d.nhom) + '</span></button>'; }).join('');
      goiY.addEventListener('mousedown', function (e) { var b = e.target.closest('[data-e]'); if (!b) return; e.preventDefault(); R[k].inp.value = ''; them(k, b.getAttribute('data-e')); dongGoiY(); R[k].inp.focus(); });
      R[k].box.appendChild(goiY);
    };
    ['to', 'cc', 'bcc'].forEach(function (k) {
      var box = $('#rc-' + k); if (!box) return;
      var inp = box.querySelector('input');
      R[k] = { box: box, inp: inp, ds: [] };
      box.addEventListener('click', function (e) { if (e.target === box) inp.focus(); });
      inp.addEventListener('keydown', function (e) {
        if (goiY && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); var bs = $$('button', goiY), i = bs.indexOf(goiY.querySelector('.on')); bs[i].classList.remove('on'); bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].classList.add('on'); return; }

      });

      inp.addEventListener('input', function () { if (/[,;]/.test(inp.value)) chot(k); else hienGoiY(k); doi(); });
      inp.addEventListener('paste', function (e) { var t = (e.clipboardData || window.clipboardData).getData('text'); if (/[,;\s]/.test(t.trim())) { e.preventDefault(); them(k, t); } });

    if ($('#mobb')) $('#mobb').onclick = function () {

        return '<details><summary style="cursor:pointer;font-weight:500;padding:4px 0">' + esc(n) + ' <span class="hint">(' + C.danhBa.filter(function (d) { return d.nhom === n; }).length + ')</span> <button type="button" class="btn ghost sm" data-themnhom="' + esc(n) + '" style="margin-left:6px">Thêm cả nhóm</button></summary>' +
          C.danhBa.map(function (d, i) { return d.nhom === n ? '<button type="button" class="mi2" data-db="' + i + '" style="padding:6px 8px;font-weight:500"><span style="flex:1">' + esc(d.ten) + '</span><span class="hint">' + esc(d.email) + '</span></button>' : ''; }).join('') + '</details>';
      }).join('') : '<p class="hint">Danh bạ trống. BOD thêm trong Cài đặt, Danh bạ.</p>');
      p.hidden = false;

        var g = e.target.closest('[data-themnhom]');
        if (g) { e.preventDefault(); them('to', C.danhBa.filter(function (d) { return d.nhom === g.getAttribute('data-themnhom'); }).map(function (d) { return d.email; }).join(',')); g.textContent = 'Đã thêm'; }

    if ($('#c-q')) $('#c-q').onchange = doi;

    /* Tệp đính kèm: chọn, kéo thả, dán */
    var veTep = function () {
      $('#c-at').innerHTML = S.tep.map(function (f, i) { return '<div class="att' + (f.dang ? ' dang' : '') + '" title="' + esc(f.ten) + '">' + ic('attach', 15) + '<span class="nm">' + esc(f.ten) + '</span><span class="hint">' + (f.kichThuoc ? kichThuoc(f.kichThuoc) : '') + '</span><button type="button" class="ibtn" style="width:26px;height:26px" data-bt="' + i + '" aria-label="Bỏ tệp">' + ic('x', 14) + '</button></div>'; }).join('');

        r.onload = function () { t.loai = f.type || 'application/octet-stream'; t.base64 = String(r.result).split(',')[1] || ''; t.dang = false; veTep(); };
        r.onerror = function () { S.tep.splice(S.tep.indexOf(t), 1); veTep(); };
        r.readAsDataURL(f);
      });
      veTep(); doi();
    };
    ed.khiDanTep = themTep;
    $('#c-fb').onclick = function () { $('#c-f').click(); };

    ['dragenter', 'dragover'].forEach(function (ev) { dlg.addEventListener(ev, function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); dlg.classList.add('keo'); } }); });
    ['dragleave', 'drop'].forEach(function (ev) { dlg.addEventListener(ev, function (e) { if (ev === 'dragleave' && dlg.contains(e.relatedTarget)) return; dlg.classList.remove('keo'); }); });
    dlg.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); themTep(e.dataTransfer.files); } });
    veTep();

    /* Lưu: nháp (tự động mỗi 20 giây khi có thay đổi) hoặc gửi BOD duyệt */
    var thuThap = function () {
      ['to', 'cc', 'bcc'].forEach(function (k) { if (R[k]) chot(k); });
      var html = ed.innerHTML.trim();
      return {
        thaoTac: v.thaoTac, maThu: v.maThu || '', den: R.to ? R.to.ds.join(', ') : '', cc: R.cc.ds.join(', '), bcc: R.bcc.ds.join(', '),

        tepGiu: S.tep.filter(function (f) { return f.giu; }).map(function (f) { return f.id; }),

      };

    var luu = function (guiDuyet, nut, im) {
      if (S.dangLuu) return Promise.resolve(false);

      S.dangLuu = true;

    };
    var hen = setInterval(function () { if (!$('#c-ed')) { clearInterval(hen); return; } if (S.ban !== S.daLuu && !htmlRong(ed.innerHTML)) luu(false, null, true); }, 20000);

  veThuMuc(); taiDs(); napViec();
  $('#mr').innerHTML = rong(ic('mail') + 'Chọn một thư để đọc.');
}

BOD_MAIL.duyet = function () {
  var loc = 'cho', ds = [], sel = -1;

        var sai = tach.filter(function (e) { return !/^[^\s@<>(),;:"]+@[^\s@<>(),;:"]+\.[^\s@<>(),;:"]+$/.test(e); });
        return { ds: tach.filter(function (e) { return sai.indexOf(e) < 0; }).map(function (e) { return { email: e, duLieu: { Email: e } }; }), moTa: 'Nhập tay · ' + tach.length + ' địa chỉ', loi: sai.length ? 'Email chưa đúng: ' + sai.join(', ') : '' };
      };
    },
    sheet: function () {
      $('#w-src').innerHTML = '<div class="sheet-nguon"><label class="f">Link Google Sheet<input type="url" id="w-l" placeholder="https://docs.google.com/spreadsheets/d/…" value="' + esc(W.sheet ? W.sheet.link : '') + '"></label><label class="f">Tab<select id="w-tab">' + (W.sheet ? W.sheet.tabs.map(function (t) { return '<option' + (t === W.sheet.tab ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') : '<option value="">Tab đầu tiên</option>') + '</select></label><button type="button" class="btn ghost" id="w-ld">' + ic('refresh', 15) + 'Đọc sheet</button></div>' +
        '<p class="hint" style="margin:0">Sheet phải chia sẻ cho tài khoản CLB.</p><span id="w-lm"></span><div id="w-sd" style="display:grid;gap:10px"></div>';
      var veSheet = function () {
        var s = W.sheet;
        if (!s) return;
        // Bảng chỉ hiện các cột ai cũng điền (thường là cột thông tin: tên, email, lớp…), cột câu trả lời dài lẻ tẻ thì ẩn bớt.
        var hien = s.cot.filter(function (c) { return c === s.cotEmail || (s.dong.length && s.dong.every(function (d) { return String(d[c] == null ? '' : d[c]).trim(); })); });
        if (!hien.length) hien = s.cot.slice();
        var an = s.cot.length - hien.length;
        $('#w-sd').innerHTML = '<p class="hint" style="margin:0">' + esc(s.tenFile) + ' · ' + s.dong.length + ' dòng' + (an ? ' · đang ẩn ' + an + ' cột không phải ai cũng điền' : '') + '. Rê chuột vào ô để xem đủ nội dung.</p><label class="f" style="max-width:320px">Cột chứa email người nhận<select id="w-ce">' + s.cot.map(function (c) { return '<option' + (c === s.cotEmail ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
          '<div class="tscroll bang-gon" style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px"><table><thead><tr><th><input type="checkbox" id="w-all" checked aria-label="Chọn tất cả"></th>' + hien.map(function (c) { return '<th title="' + esc(c) + '">' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          s.dong.map(function (d, i) { return '<tr><td><input type="checkbox" data-r="' + i + '" checked></td>' + hien.map(function (c) { return '<td title="' + esc(d[c]) + '">' + esc(d[c]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' + choTrongHint(s.cot);
        $('#w-all').onchange = function () { $$('[data-r]').forEach(function (x) { x.checked = $('#w-all').checked; }); };
      };
      $('#w-ld').onclick = function () {
        $('#w-ld').disabled = true; thongBao($('#w-lm'), 'cho', 'Đang đọc…');
        var link = $('#w-l').value.trim();
        var tabCu = W.sheet && W.sheet.link === link ? $('#w-tab').value : '';
        goiPhien('docSheetGui', link, tabCu).then(function (s) { s.link = link; W.sheet = s; $('#w-ld').disabled = false; $('#w-lm').innerHTML = ''; NGUON.sheet(); })
          .catch(function (err) { $('#w-ld').disabled = false; thongBao($('#w-lm'), 'loi', err.message); });
      };
      $('#w-tab').onchange = function () { if (W.sheet) $('#w-ld').click(); };
      veSheet();
      return function () {
        if (!W.sheet) return { ds: [], loi: 'Bạn chưa đọc sheet.' };
        var ce = $('#w-ce').value;
        var ds = $$('[data-r]:checked').map(function (c) { var d = W.sheet.dong[Number(c.getAttribute('data-r'))]; return { email: String(d[ce] || '').trim(), duLieu: d }; });
        var trong = ds.filter(function (x) { return !x.email; }).length;
        return { ds: ds.filter(function (x) { return x.email; }), moTa: 'Sheet ' + W.sheet.tenFile + ' · ' + ds.length + ' dòng', loi: trong ? 'Có ' + trong + ' dòng đã chọn không có email ở cột "' + ce + '".' : '' };
      };
    }
  };
  var b3 = function () {
    $('#wb').innerHTML = '<p class="muted">Đang đọc thư nháp…</p>';
    var lay = W.mau && W.mau.ma === W.ma ? Promise.resolve(W.mau) : goiPhien('xemThuNhapGmail', W.ma).then(function (t) { W.mau = t; return t; });
    lay.then(function (t) {
      var thieu = [];
      W.nguoiNhan.forEach(function (n) { thayMau(t.tieuDe, n.duLieu).thieu.concat(thayMau(t.html, n.duLieu, true).thieu).forEach(function (x) { if (thieu.indexOf(x) < 0) thieu.push(x); }); });
      var xem = W.nguoiNhan.slice(0, 3);
      var homNayStr = new Date(Date.now() + 3600e3 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      $('#wb').innerHTML = '<div class="card form"><div class="row"><span class="pill p-info">' + W.nguoiNhan.length + ' người nhận</span><span class="hint">' + esc(W.moTa) + ' · Hôm nay tài khoản CLB còn gửi được khoảng ' + W.nguonDl.conLai + ' thư.</span></div>' +
        (thieu.length ? '<div class="note">' + ic('info') + '<span>Không tìm thấy thông tin cho: ' + phs(thieu) + '. Sửa thư nháp trong Gmail rồi bấm Tải lại thư, hoặc chọn nguồn người nhận có cột tương ứng.</span></div>'
          : '<div class="note ok">' + ic('check') + '<span>' + (t.choTrong.length ? 'Đã kiểm tra: ' + phs(t.choTrong) + ' đều có thông tin cho cả ' + W.nguoiNhan.length + ' người nhận.' : 'Đã kiểm tra: thư không có chỗ chèn thông tin riêng, mọi người nhận cùng một nội dung.') + '</span></div>') +
        (t.dinhKem.length ? '<p class="hint" style="margin:0">Kèm ' + t.dinhKem.length + ' tệp: ' + t.dinhKem.map(esc).join(', ') + '</p>' : '') +
        '<div class="row sb"><b style="font-size:13px">Xem trước ' + xem.length + ' thư đầu</b><div class="row" style="gap:6px"><a class="btn ghost sm" href="' + esc(t.link) + '" target="_blank" rel="noopener">' + ic('ext', 14) + 'Sửa trong Gmail</a><button class="btn ghost sm" id="w-rl">' + ic('refresh', 14) + 'Tải lại thư</button></div></div>' + xem.map(function (n) { return '<div class="box"><div class="hint">Tới: ' + esc(n.email) + '</div><b>' + esc(thayMau(t.tieuDe, n.duLieu).chu) + '</b>' + khungThu(thayMau(t.html, n.duLieu, true).chu) + '</div>'; }).join('') +
        '<div class="seg" id="w-k" style="justify-self:start"><button data-k="ngay" aria-pressed="true">' + ic('send', 15) + 'Gửi ngay</button><button data-k="hen" aria-pressed="false">' + ic('clock', 15) + 'Hẹn giờ</button></div>' +
        '<div id="w-hl" hidden style="display:grid;gap:6px"><label class="f" style="max-width:280px">Gửi lúc<input type="datetime-local" id="w-h" value="' + homNayStr + '"></label><p class="hint" style="margin:0">Đến giờ hẹn app CLB ECO mới đọc thư nháp, nên vẫn sửa thư nháp trong Gmail được. Đừng xoá thư nháp này trước giờ gửi.</p></div>' +
        '<div class="row"><button class="btn" id="w-g"' + (thieu.length ? ' disabled' : '') + '>' + ic('send', 16) + 'Gửi ' + W.nguoiNhan.length + ' thư</button><span id="w-gm"></span></div></div>';
      $('#w-rl').onclick = function () { W.mau = null; b3(); };
      var kieu = 'ngay';
      $('#w-k').onclick = function (e) { var b = e.target.closest('[data-k]'); if (!b) return; kieu = b.getAttribute('data-k'); $$('#w-k button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); $('#w-hl').hidden = kieu !== 'hen'; $('#w-g').innerHTML = ic(kieu === 'hen' ? 'clock' : 'send', 16) + (kieu === 'hen' ? 'Lên lịch gửi ' : 'Gửi ') + W.nguoiNhan.length + ' thư'; };
      $('#w-g').onclick = function () {
        var hen = kieu === 'hen' ? new Date($('#w-h').value).getTime() : null;
        if (kieu === 'hen' && !hen) { thongBao($('#w-gm'), 'loi', 'Chọn giờ gửi.'); return; }
        $('#w-g').disabled = true; thongBao($('#w-gm'), 'cho', hen ? 'Đang lên lịch…' : 'Đang gửi, đừng đóng trang…');
        goiPhien('guiHangLoat', { maNhap: W.ma, nguoiNhan: W.nguoiNhan, moTaNguon: W.moTa, henGio: hen }).then(function (kq) {
          $('#wb').innerHTML = '<div class="card"><span class="toast">' + (kq.henGio ? 'Đã lên lịch gửi ' + kq.soNguoi + ' thư' : 'Đã gửi ' + kq.daGui + ' thư') + '</span>' + (kq.loi && kq.loi.length ? '<p class="err">Lỗi: ' + esc(kq.loi.join('; ')) + '</p>' : '') + '<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="w-moi">Gửi đợt khác</button>' + '<button class="btn ghost sm" id="w-xl">Xem lịch sử gửi</button>' + '</div></div>';
          $('#w-moi').onclick = function () { BOD_MAIL.hangloat(); };
          $('#w-xl').onclick = function () { BOD_MAIL.di('lich'); };
        }).catch(function (err) { $('#w-g').disabled = false; thongBao($('#w-gm'), 'loi', err.message); });
      };
    }).catch(function (err) { $('#wb').innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
  };
};

BOD_MAIL.lich = function () {
  $('#mbody').innerHTML = cho();
  var TT = { 'Đã lên lịch': 'p-info', 'Đang gửi': 'p-warn', 'Đã gửi': 'p-ok', 'Đã huỷ': 'p-mute', 'Lỗi': 'p-bad' };
  goiPhien('layLichGui').then(function (ds) {
    $('#mbody').innerHTML = '<div class="card flush"><div class="lst">' +
      (ds.length ? ds.map(function (l, i) {
        return '<div class="li" style="flex-wrap:wrap;align-items:flex-start"><div class="c" style="min-width:220px"><b class="t">' + esc(l.tieuDe) + '</b><span class="s">' + l.soNguoi + ' người · ' + esc(l.moTaNguon) + '</span><span class="s">' + esc(l.nguoiTao) + (l.thoiGianTao === l.thoiGianGui ? ' gửi lúc ' : ' lên lịch lúc ') + ngayGio(l.thoiGianTao) + '</span>' + (l.ketQua ? '<span class="s" style="white-space:normal">' + esc(l.ketQua) + '</span>' : '') + '</div>' +
          '<div style="display:grid;gap:6px;justify-items:end"><span class="pill ' + (TT[l.trangThai] || 'p-mute') + '">' + esc(l.trangThai) + '</span><span class="hint">' + ic('clock', 13) + ' ' + ngayDayDu(l.thoiGianGui) + '</span>' +
          (l.trangThai === 'Đã lên lịch' ? '<div class="row" style="gap:6px">' + (l.linkNhap ? '<a class="btn ghost sm" href="' + esc(l.linkNhap) + '" target="_blank" rel="noopener">' + ic('ext', 14) + 'Sửa thư trong Gmail</a>' : '') + '<button class="btn ghost sm" data-ls="' + i + '">Đổi giờ</button><button class="btn ghost sm" data-lh="' + i + '">Huỷ</button></div>' : '') + '</div></div>';
      }).join('') : rong(ic('clock') + 'Chưa gửi hàng loạt hay hẹn giờ thư nào.')) + '</div></div><div id="lsua"></div><p class="hint">Gồm các đợt gửi hàng loạt và thư hẹn giờ từ app CLB ECO. Thư hẹn giờ được gửi trong vòng 10 phút sau giờ hẹn, lấy nội dung mới nhất của thư nháp lúc gửi.</p>';
    $$('[data-lh]').forEach(function (b) {
      b.onclick = function () {
        if (!xacNhan(b, 'Huỷ thật?')) return;
        b.disabled = true; goiPhien('huyLichGui', ds[Number(b.getAttribute('data-lh'))].thoiGianTao).then(BOD_MAIL.lich).catch(function (err) { b.disabled = false; thongBao($('#lsua'), 'loi', err.message); });
      };
    });
    $$('[data-ls]').forEach(function (b) {
      b.onclick = function () {
        var l = ds[Number(b.getAttribute('data-ls'))];
        var gio = new Date(l.thoiGianGui - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        var h = moHop({ tieuDe: 'Đổi giờ gửi', than: '<p style="margin:0"><b>' + esc(l.tieuDe) + '</b></p><label class="f">Gửi lúc<input type="datetime-local" id="l-h" value="' + gio + '"></label>', chan: '<span class="msg" id="l-m"></span><button class="btn ghost" data-dong>Đóng</button><button class="btn" id="l-l">Lưu</button>' });
        h.querySelector('.dlg').style.maxWidth = '420px';
        $('#l-l').onclick = function () {
          $('#l-l').disabled = true;
          goiPhien('suaLichGui', l.thoiGianTao, { thoiGianGui: new Date($('#l-h').value).getTime() }).then(function () { dongHop(true); BOD_MAIL.lich(); })
            .catch(function (err) { $('#l-l').disabled = false; thongBao($('#l-m'), 'loi', err.message); });
        };
      };
    });
  }).catch(function (err) { $('#mbody').innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
};
</script>
