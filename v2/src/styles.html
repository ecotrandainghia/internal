<style>
/* Màu theo design system "Thiết kế app CLB ECO". Xanh ECO chỉ dùng cho mục đang chọn. */
:root {
  --paper: #FAF8F5; --surface: #FDFBFA; --side: #F3F1EC; --sunken: #F1EFEA;
  --ink: #27251E; --ink-2: #72706B; --ink-3: #92918B; --line: #D1D1CD; --line-soft: #E6E3DC;
  --accent: #274E13; --on-accent: #FFFFFF; --accent-soft: #E4EBDD;
  --btn: #27251E; --on-btn: #FAF8F5; --bad: #9A4636;
  --bad-soft: #F3E3DE; --warn: #86622A; --warn-soft: #F2EADB; --info: #3A546C; --info-soft: #E5EBF0; --good: #3F6B35;
  --shadow-pop: 0 12px 32px rgb(39 37 30 / .16), 0 1px 2px rgb(39 37 30 / .08);
  --r-btn: 6px; --r-in: 12px; --r-card: 16px;
  --content: 1040px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #161613; --surface: #1D1C18; --side: #1A1916; --sunken: #24231F;
  --ink: #EDEBE5; --ink-2: #A9A69E; --ink-3: #85827A; --line: #34322C; --line-soft: #2B2A25;
  --accent: #2F5E18; --accent-soft: #25331D; --btn: #EDEBE5; --on-btn: #1D1C18; --bad: #D08A7A;
  --bad-soft: #3A2420; --warn: #D9B47A; --warn-soft: #33291A; --info: #9DB7CF; --info-soft: #1F2A33; --good: #8FBF7F;
  --shadow-pop: 0 12px 32px rgb(0 0 0 / .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/1.5 "Be Vietnam Pro", system-ui, sans-serif; }
button { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

.app { display: flex; min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100dvh; width: 248px; flex: none; background: var(--side); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; padding: 16px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-size: 16px; }
.brand b { flex: 1; font-weight: 500; }
.logo { width: 32px; height: 32px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-in); color: var(--ink-2); font-weight: 500; text-decoration: none; }
.nav-item:hover { background: var(--sunken); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 11px; display: grid; place-items: center; }
.nav-item[aria-current="page"] .badge { background: rgb(255 255 255 / .2); }
.grow { flex: 1; }

.me { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; margin-top: 8px; border: 0; border-top: 1px solid var(--line-soft); border-radius: var(--r-in); background: none; cursor: pointer; text-align: left; }
.me:hover, .me[aria-expanded="true"] { background: var(--sunken); }
.me span.who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.me small { color: var(--ink-2); font-size: 12px; }
img.avatar { object-fit: cover; }
.avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 500; flex: none; }
.menu-scrim { position: fixed; inset: 0; z-index: 35; }
.menu { position: fixed; width: 224px; z-index: 36; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.menu .email { padding: 10px 10px 8px; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: var(--r-in); background: none; text-align: left; cursor: pointer; }
.menu-item:hover { background: var(--sunken); }
.menu-item kbd { margin-left: auto; font: inherit; font-size: 12px; color: var(--ink-3); }
.menu-item.danger { color: var(--bad); }
.menu hr { border: 0; height: 1px; background: var(--line-soft); margin: 4px 6px; }
.seg { display: inline-flex; gap: 2px; background: var(--sunken); border-radius: 999px; padding: 2px; margin-left: auto; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.body { flex: 1; min-width: 0; }
.main { max-width: calc(var(--content) + 80px); margin: 0 auto; padding: 32px 40px 64px; }
.main h1 { margin: 0 0 4px; font-size: 22px; font-weight: 500; }
.lead { margin: 0; color: var(--ink-2); }
.todo { margin-top: 24px; border: 1px dashed var(--line); border-radius: var(--r-in); padding: 24px; color: var(--ink-2); text-align: center; }

.icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: var(--r-in); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.avatar-btn { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
.topbar { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--paper); border-bottom: 1px solid var(--line-soft); }
.topbar-title { flex: 1; font-size: 16px; font-weight: 500; }
.only-phone { display: none; }
.scrim, .overlay { position: fixed; inset: 0; background: rgb(28 27 23 / .32); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 20; }

/* Pop-up Cài đặt */
.overlay { z-index: 40; display: grid; place-items: center; padding: 24px; }
.dialog { position: relative; width: min(960px, 100%); height: min(640px, 100%); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-pop); display: flex; overflow: hidden; }
.dialog .close { position: absolute; top: 10px; right: 10px; }
.set-nav { width: 256px; flex: none; background: var(--side); border-right: 1px solid var(--line-soft); padding: 16px 10px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.set-search { display: flex; align-items: center; gap: 8px; margin: 0 4px 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-in); background: var(--surface); color: var(--ink-3); }
.set-search input { border: 0; outline: 0; background: none; font: inherit; color: var(--ink); width: 100%; min-width: 0; }
.set-group { padding: 10px 12px 4px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.set-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0; border-radius: var(--r-in); background: none; text-align: left; cursor: pointer; color: var(--ink-2); }
.set-item[aria-current="true"] { background: var(--sunken); color: var(--ink); font-weight: 500; }
.set-body { flex: 1; min-width: 0; padding: 28px 40px; overflow: auto; }
.set-body h2 { margin: 0 0 4px; font-size: 22px; font-weight: 500; }
.row { display: flex; align-items: center; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.row > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row small { color: var(--ink-2); font-size: 12px; }
.btn-outline { padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--r-btn); background: none; cursor: pointer; white-space: nowrap; }

/* Nút, ô nhập, thông báo dùng chung */
.btn { padding: 10px 16px; border: 0; border-radius: var(--r-btn); background: var(--btn); color: var(--on-btn); font-weight: 500; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: default; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.field input { padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-in); background: var(--surface); font: inherit; font-size: 16px; color: var(--ink); }
.field input:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.msg { font-size: 13px; color: var(--ink-2); min-height: 20px; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--accent); }
.hint { margin: 0; font-size: 12px; color: var(--ink-2); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }

/* Màn chờ và màn đăng nhập */
.splash { min-height: 100dvh; display: grid; place-items: center; color: var(--ink-2); }
.login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: min(400px, 100%); display: flex; flex-direction: column; gap: 16px; }
.login-card .brand { padding: 0; }
.login-card h1 { margin: 0; font-size: 22px; font-weight: 500; }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 16px; border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--surface); font-weight: 500; cursor: pointer; }
.or { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

/* Hộp nhỏ: đổi mật khẩu, lần đăng nhập đầu */
.box { width: min(480px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.box h2 { margin: 0; font-size: 18px; font-weight: 500; }
.box .steps { font-size: 12px; color: var(--ink-3); }
.box .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.box ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.tabs { display: flex; gap: 2px; background: var(--sunken); border-radius: 999px; padding: 2px; align-self: flex-start; }
.tabs button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.link-box { display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: var(--r-in); font-size: 13px; }
.link-box span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Tour giới thiệu */
.tour-hole { position: fixed; z-index: 50; border-radius: var(--r-in); box-shadow: 0 0 0 9999px rgb(28 27 23 / .45); pointer-events: none; transition: all .2s ease; }
.tour-tip { position: fixed; z-index: 51; width: min(300px, calc(100vw - 32px)); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.tour-tip b { font-weight: 500; }
.tour-tip .actions { display: flex; align-items: center; gap: 8px; }
.tour-tip .actions span { flex: 1; font-size: 12px; color: var(--ink-3); }

/* Màn chờ có câu đùa (giữ như app cũ) */
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px 0; color: var(--ink-2); }
.loading .leaf { color: var(--accent); display: grid; animation: sway 1.6s ease-in-out infinite; }
.loading [data-wait] { transition: opacity .25s; }
.loading [data-wait].fade { opacity: 0; }
@keyframes sway { 0%, 100% { transform: rotate(-12deg) translateY(0); } 50% { transform: rotate(12deg) translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .loading .leaf { animation: none; } }

/* Trang chủ */
.home { display: flex; flex-direction: column; gap: 24px; }
.hello { border-radius: var(--r-card); background: var(--sunken); padding: 24px 28px; display: flex; flex-direction: column; gap: 4px; }
.hello small { font-size: 14px; color: var(--ink-2); }
.hello h1 { margin: 0; font-size: 22px; font-weight: 500; }
.hello p { margin: 0; color: var(--ink-2); }
.note { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: var(--r-in); padding: 10px 12px 10px 16px; background: var(--info-soft); color: var(--info); }
.note > span { flex: 1 1 220px; }
.note .btn { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.note.plain { background: var(--sunken); color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats button { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 0; border-left: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.stats button:first-child { border-left: 0; padding-left: 0; }
.stats button:hover b { text-decoration: underline; text-underline-offset: 3px; }
.stats b { font-size: 22px; font-weight: 500; }
.stats span { color: var(--ink-2); }
.c-bad { color: var(--bad); } .c-warn { color: var(--warn); } .c-info { color: var(--info); } .c-good { color: var(--good); }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec h2 { margin: 0; font-size: 16px; font-weight: 500; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t b { font-weight: 500; overflow-wrap: anywhere; }
.item .t small { font-size: 12px; color: var(--ink-2); }
a.item { color: inherit; text-decoration: none; }
a.item:hover b { text-decoration: underline; text-underline-offset: 3px; }
.empty { padding: 16px 0; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.pill { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: var(--sunken); color: var(--ink-2); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.btn.sm { padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.home-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.goto { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.goto a { height: 76px; border-radius: var(--r-card); background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--ink); text-decoration: none; }
.goto a:hover { background: var(--sunken); }

/* Trang danh sách (Quản lý task...) */
.page { display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-start; gap: 16px; }
.page-head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.page-head h1 { margin: 0; }
.page-head .btn { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; }
.chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; cursor: pointer; white-space: nowrap; }
.chip span { opacity: .7; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.search { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--r-in); background: var(--surface); color: var(--ink-3); }
.toolbar .search { width: 240px; }
.search input { border: 0; outline: 0; background: none; font: inherit; color: var(--ink); width: 100%; min-width: 0; }
.pick { padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--r-in); background: var(--surface); font: inherit; color: var(--ink); max-width: 220px; }
.tlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 210px 130px 110px 90px; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.trow:hover .link-btn { text-decoration: underline; text-underline-offset: 3px; }
.trow .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.trow .t small { font-size: 12px; color: var(--ink-2); }
.trow .who, .trow .due { color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.trow .acts { display: flex; justify-content: flex-end; }
.link-btn { padding: 0; border: 0; background: none; font-weight: 500; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.pill.good { background: var(--accent-soft); color: var(--good); }
.btn.ghost.danger { color: var(--bad); }

/* Cộng điểm */
.pts-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
.pts-main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.chips.wrap { flex-wrap: wrap; }
.chip.sm { padding: 3px 10px; font-size: 12px; }
.sec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pts-other { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
.pts-tools { display: flex; gap: 8px; align-items: center; }
.pts-tools .search { flex: 1; }
.pts-people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; border-top: 1px solid var(--line); }
.pts-person { align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.pts-person .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pts-person .d { font-size: 12px; color: var(--ink-2); }
.pts-person .p { font-size: 12px; color: var(--ink-3); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
.pts-side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 24px; }
.pts-sum { display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: var(--r-card); background: var(--sunken); }
.pts-sum small { font-size: 12px; color: var(--ink-2); }
.pts-sum b { font-weight: 500; overflow-wrap: anywhere; }
.pts-sum > span { color: var(--ink-2); }
.pts-big { display: flex; flex-direction: column; gap: 2px; margin: 8px 0 10px; color: var(--ink-2); }
.pts-big b { font-size: 20px; color: var(--ink); }
.item.off .t b { color: var(--ink-3); text-decoration: line-through; }
.batch-list { flex-basis: 100%; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.batch-list li { display: flex; justify-content: space-between; gap: 8px; }
.batch-list li.off { color: var(--ink-3); }
.item.batch { flex-wrap: wrap; }
.link-btn.danger { color: var(--bad); font-weight: 400; font-size: 13px; }
.lg-sg .link-btn { color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; margin-left: 6px; }

/* Quản lý log */
.lg-sum { white-space: nowrap; }
.lg-grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; align-items: start; }
.lg-sessions { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.lg-s { display: flex; align-items: center; gap: 12px; padding: 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.lg-s .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lg-s .t b { font-weight: 500; overflow-wrap: anywhere; }
.lg-s .t small { font-size: 12px; color: var(--ink-2); }
.lg-s:hover, .lg-s[aria-pressed="true"] { background: var(--sunken); }
.lg-panel { display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: var(--r-card); background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .08); min-width: 0; }
.lg-head { display: flex; align-items: center; gap: 8px; }
.lg-head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lg-head h2 { margin: 0; font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.lg-head small { font-size: 12px; color: var(--ink-2); }
.lg-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--ink-2); }
.lg-row .seg { margin-left: 0; }
.lg-people { display: flex; flex-direction: column; border-top: 1px solid var(--line); max-height: 480px; overflow: auto; }
.lg-people .p { min-width: 0; }
.dr-actions .msg { flex: 1; align-self: center; }
.tbl { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.tr { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
.tr.th { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.tr b { font-weight: 500; }
.q-title { font-weight: 500; font-size: 14px; }
.q-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
.q-row { display: flex; align-items: center; gap: 8px; }
