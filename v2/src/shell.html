<script>
/* Khung app: thanh bên theo vai trò, menu 3 gạch, menu avatar, pop-up Cài đặt, chuyển trang. */
var ICONS = {
  home: 'M3 10.5 12 3l9 7.5M5 9v11h14V9M10 20v-6h4v6',
  task: 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11',
  log: 'M14 3H6v18h12V7zM14 3v4h4M9 12h6M9 16h6',
  star: 'M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z',
  mail: 'M3 6h18v12H3zM3 7l9 6 9-6',
  chat: 'M4 5h16v11H9l-5 4z',
  users: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.8c1.8.6 3 2.4 3 5.2',
  target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  chart: 'M4 20v-9M10 20V5M16 20v-6M3 20h18',
  gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4L10.7 6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.5z',
  theme: 'M12 3a9 9 0 1 0 0 18zM12 3a9 9 0 0 1 0 18',
  help: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01',
  logout: 'M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10',
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5',
  bell: 'M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4',
  book: 'M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h8',
  lock: 'M6 11h12v10H6zM8 11V8a4 4 0 0 1 8 0v3',
  leaf: 'M5 19c0-8 6-14 15-14 0 9-6 15-14 15M5 19l8-8',
  search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4',
  close: 'M6 6l12 12M18 6L6 18',
  back: 'M15 6l-6 6 6 6'
};
function icon(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + ICONS[name] + '"/></svg>'; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }

/* Cách chia trang giữ như app cũ. Cài đặt không còn trên thanh bên. [mã trang, tên, biểu tượng, bước làm] */
var NAV = {
  BOD: [['home', 'Trang chủ', 'home', 4], ['task', 'Quản lý task', 'task', 5], ['log', 'Quản lý log', 'log', 5], ['points', 'Cộng điểm', 'star', 5],
    ['mail', 'Hộp thư', 'mail', 6], ['feedback', 'Góp ý', 'chat', 6], ['members', 'Thành viên', 'users', 7]],
  TV: [['home', 'Trang chủ', 'home', 4], ['my-kpi', 'KPI của tôi', 'target', 7], ['ranking', 'Điểm và xếp hạng', 'chart', 7], ['feedback', 'Góp ý', 'chat', 6]],
  HR: [['home', 'Trang chủ', 'home', 4], ['my-kpi', 'KPI của tôi', 'target', 7], ['ranking', 'Điểm và xếp hạng', 'chart', 7], ['feedback', 'Góp ý', 'chat', 6], ['my-team', 'Ban phụ trách', 'users', 8]]
};
/* Người dùng mẫu cho tới khi có đăng nhập (bước 3). */
var USER = { BOD: ['Phan Văn', 'Head HR · BOD'], TV: ['Nguyễn Văn An', 'Thành viên · PG'], HR: ['Trần Thị Bình', 'NS phụ trách ban PR'] }[ROLE];
var USER_EMAIL = 'ten.cua.ban@gmail.com';

/* Nhóm Cài đặt. Người không phải BOD chỉ thấy nhóm Của tôi. [mã, tên, biểu tượng, mô tả, các dòng [tên, mô tả, nút]] */
var SETTINGS = [
  ['Của tôi', false, [
    ['account', 'Tài khoản của tôi', 'user', 'Ai cũng thấy phần này.', [['Ảnh đại diện', 'Hiện ở thanh bên và bảng điểm', 'Đổi ảnh'], ['Mật khẩu', 'Đổi mật khẩu đăng nhập của bạn', 'Đổi mật khẩu'], ['Giao diện', 'Sáng, tối hoặc theo cài đặt của máy', 'theme'], ['Hướng dẫn', 'Xem lại hướng dẫn cài app và tour giới thiệu', 'Xem lại']]],
    ['my-notify', 'Thông báo của tôi', 'bell', 'Phải bật ít nhất kênh Zalo.', [['Zalo', 'Bot Zalo của CLB', 'Kết nối'], ['App trên điện thoại', 'Khi đã thêm app vào màn hình chính', 'Bật'], ['Gửi thử', 'Gửi một tin thử tới các kênh đang bật', 'Gửi thử'], ['Thông báo 30 ngày qua', 'Xem lại những tin app đã gửi bạn', 'Xem']]]]],
  ['Câu lạc bộ (chỉ BOD)', true, [
    ['rules', 'Quy tắc CLB', 'book', 'Mỗi lần sửa được ghi vào Nhật ký.', [['Cơ cấu ban', 'Tên ban, viết tắt, ban nào có NS phụ trách', 'Sửa'], ['Thang điểm', 'Các loại hoạt động và số điểm mỗi loại', 'Sửa'], ['Khen thưởng và hạn task', 'Top khen thưởng, số ngày tính là sắp đến hạn', 'Sửa'], ['Ngưỡng cảnh báo', 'Có số mặc định, sửa được khi cần', 'Sửa'], ['Kế hoạch năm', 'Các sự kiện trong năm để gom task và log', 'Mở']]],
    ['club-notify', 'Thông báo của CLB', 'bell', '', [['Thông báo của thành viên', 'Ai nhận qua kênh nào, gửi thử', 'Xem'], ['Lịch nhắc task', 'Các mốc nhắc trước hạn và khi trễ', 'Sửa'], ['Báo cho BOD', 'Góp ý mới, thư chờ duyệt, báo cáo seeding', 'Sửa'], ['Bot Zalo', 'Mã kết nối và số người đã kết nối', 'Mở']]],
    ['activities', 'Hoạt động CLB', 'star', '', [['File mẫu log', 'File mẫu và thư mục lưu file log', 'Sửa'], ['Sheet đăng ký log', 'App đọc sheet này khi BOD điểm danh', 'Đổi link'], ['Báo cáo seeding', 'Mở trang báo cáo seeding', 'Mở'], ['Link ghim', 'Mọi người, kể cả BOD, thấy giống nhau', 'Sửa']]],
    ['mailbox', 'Hộp thư', 'mail', '', [['Danh bạ', 'Thành viên CLB và các địa chỉ khác', 'Mở'], ['Chữ ký', 'Tự thêm vào cuối thư UCV gửi', 'Sửa'], ['Khi vượt hạn mức gửi', 'Chia sang ngày sau, bớt người hoặc hẹn giờ', 'Xem']]],
    ['accounts', 'Tài khoản và phân quyền', 'lock', '', [['Tải danh sách thành viên', 'Sau Oday, sau mỗi đợt tuyển', 'Tải lên'], ['Phân quyền nhân sự', 'BOD gán tay từng người', 'Sửa'], ['Core team và UCV', 'Tải sheet lên; UCV có thêm hộp thư', 'Tải lên'], ['Đặt lại mật khẩu', 'Cấp lại mật khẩu cho bất kỳ ai', 'Mở'], ['Đăng nhập bằng Google', 'Cho phép đăng nhập bằng tài khoản Google', 'Bật'], ['Lịch sinh nhật', 'Google Lịch ghi sinh nhật thành viên', 'Mở']]],
    ['season', 'Giao diện theo mùa', 'leaf', 'Đổi cho cả CLB.', [['Chủ đề đang dùng', 'Hình trang trí ở trang chủ và màn đăng nhập', 'Đổi'], ['Ảnh nền đăng nhập', 'Đang dùng nền xanh mặc định', 'Đổi ảnh']]],
    ['system', 'Hệ thống', 'chart', '', [['Tình trạng hệ thống', 'Việc tự chạy lúc 2 giờ sáng, lỗi báo qua Zalo hoặc app', 'Xem'], ['Sao lưu và khôi phục', 'Tự sao lưu mỗi đêm, giữ 30 bản', 'Khôi phục'], ['Nhật ký', 'Ai sửa gì, lúc nào', 'Xem'], ['Tab dữ liệu', 'Các tab đã khoá và tab chỉ để xem', 'Xem']]]]]
];

/* ---------- Giao diện sáng, tối, theo máy (lưu trên máy này) ---------- */
function getTheme() { try { return localStorage.getItem('eco-theme') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme(t) {
  var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
function setTheme(t) { try { localStorage.setItem('eco-theme', t); } catch (e) {} applyTheme(t); document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.themeSet === t); }); }
function themeSeg() {
  var t = getTheme();
  return '<span class="seg">' + [['light', 'Sáng'], ['dark', 'Tối'], ['auto', 'Theo máy']].map(function (x) {
    return '<button type="button" data-theme-set="' + x[0] + '" aria-pressed="' + (t === x[0]) + '">' + x[1] + '</button>';
  }).join('') + '</span>';
}

/* ---------- Thanh bên và chuyển trang ---------- */
var page = 'home';
function currentPage() { return page; }
function renderNav() {
  var cur = currentPage();
  $('nav').innerHTML = NAV[ROLE].map(function (x) {
    return '<a class="nav-item" href="#" data-page="' + x[0] + '"' + (x[0] === cur ? ' aria-current="page"' : '') + '>' + icon(x[2]) + '<span>' + esc(x[1]) + '</span></a>';
  }).join('');
  var av = '<span class="avatar">' + esc(USER[0].split(' ').pop()[0]) + '</span>';
  $('meBtn').innerHTML = av + '<span class="who"><b>' + esc(USER[0]) + '</b><small>' + esc(USER[1]) + '</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>';
  $('meBtnPhone').innerHTML = av;
}
function renderPage() {
  var cur = currentPage(), item = NAV[ROLE].filter(function (x) { return x[0] === cur; })[0];
  $('topTitle').textContent = item[1];
  $('main').innerHTML = '<h1>' + esc(item[1]) + '</h1><p class="lead">Khung app mới. Nội dung trang này làm ở bước ' + item[3] + ' của kế hoạch.</p><div class="todo">Chưa có nội dung</div>';
  renderNav();
  closeSide();
}

/* ---------- Menu 3 gạch (điện thoại) ---------- */
function openSide() { $('side').classList.add('open'); $('scrim').hidden = false; }
function closeSide() { $('side').classList.remove('open'); $('scrim').hidden = true; }

/* ---------- Menu avatar ---------- */
function openMenu(btn) {
  var m = $('meMenu');
  m.innerHTML = '<div class="email">' + esc(USER_EMAIL) + '</div>' +
    '<button class="menu-item" type="button" data-act="settings">' + icon('gear') + '<span>Cài đặt</span><kbd>Ctrl+,</kbd></button>' +
    '<div class="menu-item">' + icon('theme') + '<span>Giao diện</span>' + themeSeg() + '</div>' +
    '<button class="menu-item" type="button" data-act="tour">' + icon('help') + '<span>Xem lại hướng dẫn</span></button><hr>' +
    '<button class="menu-item danger" type="button" data-act="logout">' + icon('logout') + '<span>Đăng xuất</span></button>';
  var r = $('meBtn').getBoundingClientRect();
  m.style.left = r.left + 'px';
  m.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  m.style.width = r.width + 'px';
  m.hidden = false; $('menuScrim').hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  m.querySelector('[data-act]').focus();
}
function closeMenu() { $('meMenu').hidden = true; $('menuScrim').hidden = true; $('meBtn').setAttribute('aria-expanded', 'false'); }

/* ---------- Pop-up Cài đặt ---------- */
var openSection = null;
function visibleGroups() { return SETTINGS.filter(function (g) { return !g[1] || ROLE === 'BOD'; }); }
function renderSettings(query) {
  var groups = visibleGroups(), q = (query || '').trim().toLowerCase();
  var all = [].concat.apply([], groups.map(function (g) { return g[2]; }));
  var sec = all.filter(function (s) { return s[0] === openSection; })[0] || all[0];
  var nav = groups.map(function (g) {
    var items = g[2].filter(function (s) { return !q || (s[1] + ' ' + s[4].map(function (r) { return r[0] + ' ' + r[1]; }).join(' ')).toLowerCase().indexOf(q) >= 0; });
    if (!items.length) return '';
    return '<div class="set-group">' + esc(g[0]) + '</div>' + items.map(function (s) {
      return '<button class="set-item" type="button" data-sec="' + s[0] + '"' + (s === sec ? ' aria-current="true"' : '') + '>' + icon(s[2]) + '<span>' + esc(s[1]) + '</span></button>';
    }).join('');
  }).join('');
  var body = '<button class="icon-btn only-phone" type="button" data-act="back" aria-label="Quay lại">' + icon('back') + '</button>' +
    '<h2 id="setTitle">' + esc(sec[1]) + '</h2>' + (sec[3] ? '<p class="lead">' + esc(sec[3]) + '</p>' : '') +
    sec[4].map(function (r) {
      return '<div class="row"><div><b>' + esc(r[0]) + '</b><small>' + esc(r[1]) + '</small></div>' + (r[2] === 'theme' ? themeSeg() : '<button class="btn-outline" type="button">' + esc(r[2]) + '</button>') + '</div>';
    }).join('');
  var box = $('settings').querySelector('.dialog');
  if (!box) {
    $('settings').innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="setTitle">' +
      '<button class="icon-btn close" type="button" data-act="close-settings" aria-label="Đóng cài đặt">' + icon('close') + '</button>' +
      '<div class="set-nav"><label class="set-search">' + icon('search') + '<input type="search" id="setQuery" placeholder="Tìm cài đặt" aria-label="Tìm cài đặt"></label><div id="setNav"></div></div>' +
      '<div class="set-body" id="setBody"></div></div>';
    box = $('settings').querySelector('.dialog');
    $('setQuery').addEventListener('input', function () { renderSettings(this.value); });
  }
  $('setNav').innerHTML = nav || '<div class="set-group">Không thấy cài đặt nào</div>';
  $('setBody').innerHTML = body;
  box.classList.toggle('in-section', !!openSection);
}
function openSettings() { closeMenu(); closeSide(); openSection = null; $('settings').hidden = false; renderSettings(''); $('setQuery').focus(); }
function closeSettings() { $('settings').hidden = true; }

/* ---------- Sự kiện ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act],[data-sec],[data-theme-set],[data-page]');
  if (e.target.id === 'menuScrim') return closeMenu();
  if (e.target.id === 'settings') return closeSettings();
  if (!t) return;
  if (t.dataset.page) { e.preventDefault(); page = t.dataset.page; return renderPage(); }
  if (t.dataset.themeSet) return setTheme(t.dataset.themeSet);
  if (t.dataset.sec) { openSection = t.dataset.sec; return renderSettings($('setQuery').value); }
  var act = t.dataset.act;
  if (act === 'settings') openSettings();
  else if (act === 'close-settings') closeSettings();
  else if (act === 'back') { openSection = null; renderSettings($('setQuery').value); }
  else if (act === 'tour' || act === 'logout') { closeMenu(); alert('Phần này làm ở bước 3 (đăng nhập).'); }
});
$('meBtn').addEventListener('click', function () { $('meMenu').hidden ? openMenu(this) : closeMenu(); });
$('meBtnPhone').addEventListener('click', function () { openMenu(this); });
$('openSide').addEventListener('click', openSide);
$('closeSide').addEventListener('click', closeSide);
$('scrim').addEventListener('click', closeSide);
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); openSettings(); }
  if (e.key === 'Escape') { closeMenu(); closeSettings(); closeSide(); }
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyTheme(getTheme()); });
applyTheme(getTheme());
renderPage();
</script>
