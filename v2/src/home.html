<script>
/* Các trang trong vùng nội dung. Trang nào chưa có ở đây thì hiện khung "làm ở bước sau". */
var PAGES = {};

/* ---------- Màn chờ có câu đùa (giữ như app cũ) ---------- */
var WAIT_LINES = [
  'Gió đang thổi dữ liệu về, bạn chờ xíu…',
  'Đang tưới cây cho dữ liệu nảy mầm…',
  'Đang phân loại rác… à nhầm, phân loại dữ liệu…',
  'Ốc sên chở dữ liệu đang chạy hết tốc lực…',
  'Đang gọi Google dậy làm việc…',
  'Dữ liệu đang đạp xe về, không xả khói…',
  'Lá bay hết rồi, đang đi nhặt lại…',
  'Dữ liệu đang tắm nắng, sắp xong rồi…',
  'Đang nhặt rác trên đường truyền…',
  'Gió hơi to, lá bay lung tung…',
  'Tranh thủ uống ngụm nước đi bạn ơi…'
];
function waitLine() { return WAIT_LINES[Math.floor(Math.random() * WAIT_LINES.length)]; }
function loadingHtml() { return '<div class="loading" role="status"><span class="leaf">' + icon('leaf') + '</span><span data-wait>' + waitLine() + '</span></div>'; }
setInterval(function () {
  document.querySelectorAll('[data-wait]').forEach(function (s) {
    s.classList.add('fade');
    setTimeout(function () { s.textContent = waitLine(); s.classList.remove('fade'); }, 250);
  });
}, 2600);

/* ---------- Ngày giờ ---------- */
function p2(n) { return (n < 10 ? '0' : '') + n; }
function fmtDay(ms) { var d = new Date(ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1); }
function fmtTime(ms) { var d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function fmtDeadline(ms) { return ms ? 'Hạn ' + fmtTime(ms) + ' ' + fmtDay(ms) : 'Chưa có hạn'; }
function dayPart() {
  var h = new Date().getHours();
  return h >= 5 && h < 11 ? 'buổi sáng' : h < 14 && h >= 11 ? 'buổi trưa' : h < 18 && h >= 14 ? 'buổi chiều' : h < 22 && h >= 18 ? 'buổi tối' : 'đêm khuya';
}
/** Số buổi log giữ tối đa 2 số lẻ: 1,17. */
function fmtNum(n) { return String(Math.round(n * 100) / 100).replace('.', ','); }

/* ---------- Trang chủ ---------- */
var TASK_PILLS = { assigned: ['Đã giao', 'info'], due_soon: ['Sắp đến hạn', 'warn'], late: ['Trễ hạn', 'bad'], done: ['Chờ chấm', ''] };
function pill(text, kind) { return '<span class="pill ' + (kind || '') + '">' + esc(text) + '</span>'; }
function stat(value, label, pageId, tone) {
  return '<button type="button" data-page="' + pageId + '"><b class="' + (tone || '') + '">' + esc(value) + '</b><span>' + esc(label) + '</span></button>';
}
function item(title, meta, right) {
  return '<div class="item"><div class="t"><b>' + esc(title) + '</b>' + (meta ? '<small>' + esc(meta) + '</small>' : '') + '</div>' + (right || '') + '</div>';
}
function goButton(pageId, text) { return '<button type="button" class="btn ghost sm" data-page="' + pageId + '">' + esc(text) + '</button>'; }

PAGES.home = function (main) {
  main.innerHTML = '<div class="home"><section class="hello" aria-label="Lời chào">' + seasonDecor() + '<small>Chào ' + dayPart() + ',</small><h1>' + esc(USER.name.split(' ').pop()) + ' ơi!</h1></section>' +
    '<div id="homeBody">' + loadingHtml() + '</div></div>';
  call('homeData', TOKEN).then(function (d) { if (currentPage() === 'home' && $('homeBody')) renderHome(d); })
    .catch(function (err) { if ($('homeBody')) $('homeBody').innerHTML = '<p class="msg bad">' + esc(err.message) + '</p>'; });
};

function renderHome(d) {
  var urgentMine = d.myTasks.filter(function (t) { return t.status === 'late' || t.status === 'due_soon'; }).length;
  var html = '';
  if (USER.isBod) {
    var b = d.bod;
    if (BADGES.mail !== b.counts.mail) { BADGES.mail = b.counts.mail; renderNav(); }
    setHelloLine(b.todo.length ? 'Hôm nay có ' + b.todo.length + ' việc cần bạn xem. Làm nhanh rồi nghỉ nha.' : 'Hôm nay không có việc gấp. Nghỉ ngơi chút nha.');
    html += '<div class="note plain"><span>' + esc(b.nextStep) + '</span><button type="button" class="btn sm" data-act="roster">Mở</button></div>';
    html += notifyNote(d);
    html += '<div class="stats">' + stat(b.counts.tasks, 'Task trễ hạn hoặc sắp đến hạn', 'task', b.counts.tasks ? 'c-bad' : '') +
      stat(b.counts.mail, 'Thư UCV chờ duyệt', 'mail', b.counts.mail ? 'c-warn' : '') +
      stat(b.counts.feedback, 'Góp ý chưa đọc', 'feedback', b.counts.feedback ? 'c-info' : '') + '</div>';
    html += '<section class="sec" aria-labelledby="todoTitle"><h2 id="todoTitle">Cần làm hôm nay</h2><div class="list">' +
      (b.todo.length || extraRows(d).length ? extraRows(d).concat(b.todo.map(function (x) { return bodRow(x, d.now); })).join('') :
        '<div class="empty">Không có việc gấp. Task trễ hạn, thư chờ duyệt và góp ý mới sẽ hiện ở đây.</div>') + '</div></section>';
    html += d.myTasks.length ? '<div class="home-cols">' + myTasksSection(d) + linksSection(d) + '</div>' : linksSection(d);
    html += '<section class="sec" aria-labelledby="gotoTitle"><h2 id="gotoTitle">Đi tới</h2><div class="goto">' +
      navItems().filter(function (x) { return x[0] !== 'home'; }).map(function (x) {
        return '<a href="#" data-page="' + x[0] + '">' + icon(x[2]) + esc(x[1]) + '</a>';
      }).join('') + '</div></section>';
  } else {
    var m = d.member, need = m.kpiLog && m.kpiLog.needed;
    var parts = [urgentMine ? 'còn ' + urgentMine + ' task sắp đến hạn hoặc trễ hạn' : '', need ? 'cần thêm ' + need + ' buổi log' : ''].filter(String);
    setHelloLine(parts.length ? 'Bạn ' + parts.join(' và ') + '.' : 'Hôm nay bạn không có việc gấp.');
    if (!d.term || (d.term.phase !== 'phase_1' && d.term.phase !== 'phase_2')) {
      html += '<div class="note plain"><span>' + (d.term ? 'Đang ở giai đoạn giao thoa của nhiệm kỳ ' + esc(d.term.label) + ', chưa tính điểm và KPI.' : 'Nhiệm kỳ chưa bắt đầu, chưa tính điểm và KPI.') + '</span></div>';
    }
    html += notifyNote(d);
    html += '<div class="stats">' + pointsStat(m) + kpiTaskStat(m.kpiTask, d.threshold) + kpiLogStat(m.kpiLog) + '</div>';
    var extra = extraRows(d);
    if (extra.length) html += '<section class="sec" aria-labelledby="todoTitle"><h2 id="todoTitle">Cần làm hôm nay</h2><div class="list">' + extra.join('') + '</div></section>';
    html += '<div class="home-cols">' + myTasksSection(d) + linksSection(d) + '</div>';
  }
  $('homeBody').outerHTML = html;
}

/** Dòng thứ ba của lời chào: tóm tắt việc hôm nay. */
function setHelloLine(line) {
  var h = document.querySelector('.hello');
  if (h) h.insertAdjacentHTML('beforeend', '<p>' + esc(line) + '</p>');
}

function notifyNote(d) {
  if (!d.notify) return '';
  return '<div class="note">' + icon('bell') + '<span>Bạn chưa cài xong cách nhận thông báo, nên có thể bỏ lỡ tin quan trọng.</span>' +
    '<button type="button" class="btn sm" data-act="notify">Cài thông báo</button></div>';
}

function bodRow(x, now) {
  if (x.kind === 'mail') return item(x.title, x.at ? x.meta + ' · gửi lúc ' + fmtTime(x.at) + ' ' + fmtDay(x.at) : x.meta, pill('Chờ duyệt', 'warn') + goButton('mail', 'Mở'));
  if (x.kind === 'grade') return item(x.title, 'Quản lý task', pill('Chờ chấm', 'info') + goButton('task', 'Xem'));
  if (x.kind === 'late') {
    return item(x.title, x.meta ? x.meta + (x.deadline ? ' · hạn ' + fmtDay(x.deadline) : '') : 'Quản lý task', (x.deadline ? pill(lateBy(now - x.deadline), 'bad') : '') + goButton('task', 'Xem'));
  }
  return item(x.title, 'Góp ý', pill('Mới', 'info') + goButton('feedback', 'Xem'));
}

/** Trễ 5 giờ, Trễ 2 ngày. */
function lateBy(ms) {
  return ms < 864e5 ? 'Trễ ' + Math.max(1, Math.ceil(ms / 36e5)) + ' giờ' : 'Trễ ' + Math.floor(ms / 864e5) + ' ngày';
}

/** Dòng thêm cho NS phụ trách ban và UCV. */
function extraRows(d) {
  var rows = [];
  if (d.lead && (d.lead.late || d.lead.soon)) {
    rows.push(item('Ban phụ trách: ' + [d.lead.late ? d.lead.late + ' task trễ hạn' : '', d.lead.soon ? d.lead.soon + ' task sắp đến hạn' : ''].filter(String).join(', '),
      'Nhắc thêm các bạn trong ban qua Messenger', goButton('my-team', 'Xem')));
  }
  if (d.ucv && d.ucv.needsChanges) rows.push(item(d.ucv.needsChanges + ' thư cần sửa lại', 'BOD đã trả lại', pill('Cần sửa', 'bad')));
  if (d.ucv && d.ucv.pending) rows.push(item(d.ucv.pending + ' thư đang chờ BOD duyệt', 'Hộp thư', pill('Chờ duyệt', 'warn')));
  return rows;
}

function pointsStat(m) {
  if (!m.points) return stat('–', 'Điểm và hạng', 'ranking');
  return stat(m.points.total + ' điểm', 'Hạng ' + m.points.rank + '/' + m.points.of + ' · ' + m.points.phaseLabel, 'ranking');
}
function kpiTaskStat(k, threshold) {
  if (!k || k.percent === null) return stat('–', k && k.assigned ? 'KPI task · chưa có task được chấm' : 'KPI task', 'my-kpi');
  var ok = k.percent >= threshold;
  return stat(k.percent + '%', 'KPI task · ' + (ok ? 'đã đạt' : 'chưa đạt ' + threshold + '%'), 'my-kpi', ok ? 'c-good' : 'c-bad');
}
function kpiLogStat(k) {
  if (!k || !k.quota) return stat('–', 'KPI log · chưa có chỉ tiêu', 'my-kpi');
  return stat(fmtNum(k.attended) + '/' + fmtNum(k.quota) + ' buổi', 'KPI log · ' + (k.needed ? 'cần thêm ' + k.needed + ' buổi' : 'đã đạt'), 'my-kpi', k.needed ? 'c-warn' : 'c-good');
}

function myTasksSection(d) {
  if (USER.isBod && !d.myTasks.length) return '';
  var rows = d.myTasks.map(function (t) {
    var p = TASK_PILLS[t.status] || ['', ''];
    var btn = t.status === 'done'
      ? (t.canUndo ? '<button type="button" class="btn ghost sm" data-undo="' + esc(t.taskId) + '">Huỷ xác nhận</button>' : '')
      : '<button type="button" class="btn sm' + (t.status === 'assigned' ? ' ghost' : '') + '" data-done="' + esc(t.taskId) + '">Đã xong</button>';
    return item(t.name, fmtDeadline(t.deadline) + ' · ' + t.by, pill(p[0], p[1]) + btn);
  });
  return '<section class="sec" aria-labelledby="myTaskTitle"><h2 id="myTaskTitle">Task của bạn</h2><div class="list">' +
    (rows.length ? rows.join('') : '<div class="empty">Bạn chưa có task nào cần làm.</div>') + '</div>' +
    '<p class="hint">Cần gia hạn? Nhắn BOD hoặc NS phụ trách ban qua Messenger.</p><span class="msg" id="taskMsg" role="status"></span></section>';
}

function linksSection(d) {
  return '<section class="sec" aria-labelledby="linkTitle"><h2 id="linkTitle">Link ghim</h2><div class="list">' +
    (d.links.length ? d.links.map(function (l) {
      return '<a class="item link" href="' + esc(l.url) + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg><span class="t"><b>' + esc(l.label) + '</b></span></a>';
    }).join('') : '<div class="empty">BOD chưa ghim link nào.</div>') + '</div>' +
    '<p class="hint">Mọi người, kể cả BOD, thấy cùng các link này.</p></section>';
}

/* Bấm Đã xong, Huỷ xác nhận trên trang chủ. */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-done],[data-undo]');
  if (!b) return;
  var undo = !!b.dataset.undo;
  b.disabled = true;
  if ($('taskMsg')) { $('taskMsg').className = 'msg'; $('taskMsg').textContent = 'Đang lưu…'; }
  call(undo ? 'undoConfirmTask' : 'confirmTask', TOKEN, undo ? b.dataset.undo : b.dataset.done)
    .then(function () { if (currentPage() === 'home') renderPage(); })
    .catch(function (err) { b.disabled = false; if ($('taskMsg')) { $('taskMsg').className = 'msg bad'; $('taskMsg').textContent = err.message; } });
});
</script>
