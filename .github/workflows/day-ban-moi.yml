# Trong lúc thử app mới: mỗi khi gộp thay đổi trong v2/ vào main, tự đẩy code trong v2/src lên dự án Apps Script
# riêng của app mới (không đụng app cũ). Chuyển hẳn sang app mới xong thì xoá file này.
# Cần thêm 2 mục trong Settings → Secrets and variables → Actions (CLASPRC_JSON dùng chung với app cũ):
#   NEW_SCRIPT_ID     : ID tập lệnh của dự án Apps Script mới
#   NEW_DEPLOYMENT_ID : ID bản triển khai ứng dụng web của dự án mới (có sau lần triển khai đầu)
name: Đẩy app mới lên Apps Script thử

on:
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/day-ban-moi.yml']
  workflow_dispatch:

concurrency:
  group: day-ban-moi
  cancel-in-progress: false

jobs:
  day-ban-moi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Chạy kiểm tra
        run: npm test
      - name: Đẩy code lên Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.NEW_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.NEW_DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::warning::Chưa cài CLASPRC_JSON hoặc NEW_SCRIPT_ID nên chưa đẩy code. Xem docs/chuyen-sang-app-moi.md."
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"v2/src"}' "$SCRIPT_ID" > .clasp.json
          npx -y @google/clasp@3.4.1 push -f
          if [ -n "$DEPLOYMENT_ID" ]; then
            npx -y @google/clasp@3.4.1 redeploy "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7}"
          else
            echo "::notice::Đã đẩy code. Chưa có NEW_DEPLOYMENT_ID nên app mới đang chạy chưa được cập nhật."
          fi
